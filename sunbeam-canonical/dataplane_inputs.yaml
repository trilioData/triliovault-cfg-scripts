# dataplane_inputs.yaml
#
# T4O Data Plane Configuration for Sunbeam (MicroK8s)
#
# Edit the [manual] sections before running deploy_dataplane.sh.
# deploy_dataplane.sh auto-populates the [auto] connectivity values from the cluster.
#
# Usage:
#   vi dataplane_inputs.yaml      # set [manual] values (images, registry, flags)
#   bash deploy_dataplane.sh      # auto-fills connectivity, runs Ansible

# ---------------------------------------------------------------------------
# T4O Version                                                        [manual]
# ---------------------------------------------------------------------------
trilio_version: "6.2.1"

# ---------------------------------------------------------------------------
# Container Images                                                   [manual]
# Update on every T4O release.
# Format: docker.io/trilio/<component>-canonical:<version>-<openstack-release>
# ---------------------------------------------------------------------------
triliovault_datamover_image: "docker.io/trilio/trilio-datamover-canonical:6.2.1-2024.1"
triliovault_wlm_image:       "docker.io/trilio/trilio-wlm-canonical:6.2.1-2024.1"
triliovault_dms_image:       "docker.io/trilio/trilio-dms-canonical:6.2.1-2024.1"

# ---------------------------------------------------------------------------
# Container Registry Authentication                                  [manual]
# Set login_enabled: true when pulling from a private / authenticated registry.
# ---------------------------------------------------------------------------
trilio_container_registry_login_enabled: false
trilio_container_registry_url:           "docker.io"
trilio_container_registry_username:      ""
trilio_container_registry_password:      ""

# ---------------------------------------------------------------------------
# Connectivity                                                       [auto]
# deploy_dataplane.sh reads K8s secrets (trilio-infra-passwords, Keystone)
# to populate these. Override manually if auto-population fails.
#
# dmapi_transport_url format : rabbit://dmapi:<pass>@<node-ip>:30672/dmapi
# dmapi_database_connection format: mysql+pymysql://dmapi:<pass>@<node-ip>:30306/dmapi
# ---------------------------------------------------------------------------
dmapi_transport_url:       ""
dmapi_database_connection: ""
keystone_auth_url:         ""
keystone_ssl_verify:       false

# ---------------------------------------------------------------------------
# RabbitMQ / Oslo Messaging                                         [manual]
# These must match the RabbitMQ cluster settings in ctlplane_inputs.yaml.
# ---------------------------------------------------------------------------
rabbit_ssl:          false
# Set true if ctlplane_inputs.yaml rabbitmq.quorum_queues.enabled is true
rabbit_quorum_queue: false
oslomsg_rpc_use_ssl: false

# ---------------------------------------------------------------------------
# Ceph / Cinder Integration                                         [manual]
# Set cinder_backend_ceph: true when OpenStack Cinder uses a Ceph backend.
# ---------------------------------------------------------------------------
cinder_backend_ceph:          false
libvirt_images_rbd_ceph_conf: "/etc/ceph/ceph.conf"
ceph_cinder_user:             "cinder"

# ---------------------------------------------------------------------------
# Storage                                                           [manual]
# Local directory on each compute node used for DataMover mount points.
# ---------------------------------------------------------------------------
vault_data_dir: "/var/lib/trilio/triliovault-mounts"
