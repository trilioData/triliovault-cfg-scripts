# passwords.yaml
#
# T4O service passwords -- generated by prepare.sh --mode install on first run.
# WARNING: Do NOT commit this file after passwords are generated -- it contains credentials in plain text.
#
# Managing passwords during upgrades:
#   - Passwords are set once at install time and reused across all T4O upgrades.
#   - Do NOT change values here after infrastructure is deployed unless you are
#     intentionally rotating credentials (requires MySQL, RabbitMQ, and Keystone updates too).
#   - To rotate: update values here, then re-run:
#       bash deploy_infra.sh --mode upgrade
#       bash deploy_ctlplane.sh --mode upgrade

# MySQL
mysql_root_password:     ""   # root user -- cluster init and DB setup
mysql_wlm_password:      ""   # user workloadmgr -> database workloadmgr
mysql_dmapi_password:    ""   # user dmapi -> database dmapi

# RabbitMQ
rabbitmq_wlm_password:   ""   # user workloadmgr -> vhost workloadmgr
rabbitmq_dmapi_password: ""   # user dmapi -> vhost dmapi

# Keystone service accounts
keystone_wlm_password:   ""   # service user triliovault (WLM API)
keystone_dmapi_password: ""   # service user dmapi (DataMover API)
