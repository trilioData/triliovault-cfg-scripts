name: trilio-data-mover-sunbeam
type: charm
title: TrilioVault DataMover (Sunbeam)
summary: TrilioVault DataMover subordinate charm for Sunbeam Canonical OpenStack
description: |
  Deploys TrilioVault DataMover (tvault-contego) as a Juju subordinate charm
  co-located on every compute node running openstack-hypervisor.

  This charm targets Sunbeam Canonical OpenStack specifically. It differs from
  trilio-data-mover (which is subordinate to nova-compute on traditional
  Canonical OpenStack) in these ways:
    - Subordinate target: openstack-hypervisor (not nova-compute)
    - Framework: ops (not charms.reactive)
    - Credentials: keystone-credentials interface (cross-model SAAS from openstack model)

  When a new compute node joins via "sunbeam cluster join", openstack-hypervisor
  creates a new principal unit on that machine. Juju then automatically creates a
  trilio-data-mover subordinate unit on the same machine — no operator
  action is required from the Trilio side.

subordinate: true

base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    plugin: charm
    source: .
    build-packages:
      - git

requires:
  juju-info:
    interface: juju-info
    scope: container
  amqp:
    interface: rabbitmq
  identity-credentials:
    interface: keystone-credentials
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  ceph:
    interface: ceph-client
    optional: true

provides:
  data-mover:
    interface: data-mover
    scope: container

config:
  options:
    # --- Ceph ----------------------------------------------------------------
    # Two flags decide how contego reaches Ceph, if at all:
    #
    #   ceph_enabled  internal_ceph_enabled  Result
    #   ------------  ---------------------  --------------------------------
    #   false         (ignored)              No Ceph anywhere. No relation is
    #                                        used, no Ceph stanzas rendered.
    #   true          true   (default)       Sunbeam's own microceph, via the
    #                                        ceph relation. The broker mints a
    #                                        client named after the Juju app.
    #   true          false                  External cluster. You pre-create
    #                                        the client and supply its keyring
    #                                        and ceph.conf below.
    ceph_enabled:
      type: boolean
      default: true
      description: |
        Ceph is used as storage for Cinder or Nova on this cloud.
        Set false when Cinder uses LVM/iSCSI or a vendor driver and Nova
        ephemeral is on local disk. With false, contego renders no Ceph
        configuration at all — that is the correct outcome for such a cloud,
        not a degraded one — and the ceph relation is ignored if present.
    internal_ceph_enabled:
      type: boolean
      default: true
      description: |
        The Ceph cluster is Sunbeam's own microceph, reached over the ceph
        relation. Considered ONLY when ceph_enabled is true.

        Set false when Cinder or Nova use a Ceph cluster deployed OUTSIDE
        Sunbeam by third-party tooling (cephadm, Rook, and so on). There is
        then no microceph/ceph-mon application to relate to, so no broker can
        mint a key for us, and the charm holds no admin credential for a
        cluster it does not manage.

        With false you MUST pre-create the Ceph client yourself, with read,
        write and execute permission on the Cinder and Nova RBD pools, named
        to match trilio_ceph_username. On a Ceph admin node:

          ceph auth get-or-create client.trilio-data-mover \
            mon 'profile rbd' \
            osd 'profile rbd pool=<cinder-pool>, profile rbd pool=<nova-pool>' \
            -o ceph.client.trilio-data-mover.keyring

        then set ceph_conf and ceph_keyring from that cluster.
    trilio_ceph_username:
      type: string
      default: "trilio-data-mover"
      description: |
        Name of the Ceph client contego authenticates as. Determines rbd_user
        and the keyring filename. Considered ONLY when ceph_enabled is true
        and internal_ceph_enabled is false.

        This is the client YOU created on the external cluster (see above).
        The default matches the name the relation path uses, so the same name
        works in both modes; change it only if you are reusing an existing
        client such as `cinder`.

        In internal mode this option is ignored: the broker names the key after
        the Juju application, and a mismatch silently targets a key that was
        never created.
    ceph_conf:
      type: string
      default: ""
      description: |
        Full contents of ceph.conf for the external cluster, including its mon
        host line. Considered ONLY when ceph_enabled is true and
        internal_ceph_enabled is false. Source it from the external cluster,
        e.g. /etc/ceph/ceph.conf on a Ceph admin node.

        WRITE-IF-ABSENT: written to /etc/ceph/ceph.conf only when that file
        does not already exist. On Sunbeam a compute node usually has none —
        Nova reaches Ceph via Cinder's per-volume connection_info rather than
        /etc/ceph — so in practice this value is what provides it. A file some
        other tool did place is reused untouched, because whatever put it there
        is the authority on its contents; delete it first if you want ours.
    ceph_keyring:
      type: string
      default: ""
      description: |
        Full contents of the keyring for trilio_ceph_username. Considered ONLY
        when ceph_enabled is true and internal_ceph_enabled is false.

        WRITE-IF-ABSENT, to
        /etc/ceph/ceph.client.<trilio_ceph_username>.keyring. If you point
        trilio_ceph_username at a client the node already has a keyring for
        (e.g. cinder), that keyring is reused untouched — overwriting it would
        replace the credential Nova and Cinder use on that node. When written,
        it is written verbatim, so an existing [client.X] stanza and its caps
        lines are preserved.

        SECURITY: this is a cephx secret and Juju config is NOT secret storage.
        The value sits in the controller database, is printed by
        `juju config trilio-data-mover`, and is emitted by `juju export-bundle`.
        Never paste a real key into a bundle file that gets committed. Set it
        from a file at deploy time instead:
          juju config trilio-data-mover \
            ceph_keyring="$(cat ./ceph.client.trilio-data-mover.keyring)"
        Migrating this to a Juju user secret is tracked as follow-up work.

    triliovault-pkg-source:
      type: string
      default: "deb [trusted=yes] https://apt.fury.io/trilio-maint-6-2 /"
      description: APT repository line for TrilioVault packages
    trilio-version:
      type: string
      default: ""
      description: |
        Specific tvault-contego package version to install, e.g. "6.2.1".
        Leave empty to install the latest available version from the repo.
    debug:
      type: boolean
      default: false
      description: Enable debug logging
    rabbit-quorum-queue:
      type: boolean
      default: true
      description: |
        Must match nova.conf's rabbit_quorum_queue on this compute node.
        Applied to both contego's oslo_messaging_rabbit section and this
        charm's own compute-side DMS server (mapped to trilio_dms's
        rabbitmq_queue_type: quorum when true, classic when false). A
        mismatched durability flag on a shared-name queue gets a 406
        PRECONDITION_FAILED from RabbitMQ.
    amqp-durable-queues:
      type: boolean
      default: true
      description: |
        Standard oslo.messaging amqp_durable_queues setting, applied to
        contego's oslo_messaging_rabbit section. Also maps to trilio_dms's
        rabbitmq_queue_durable for this charm's own compute-side DMS server
        (quorum/stream queue types there are always durable regardless of
        this setting — only affects behavior when rabbit-quorum-queue is
        false / classic queue type).
    wlm-db-url:
      type: string
      default: ""
      description: |
        WLM database URL for the DMS client conf (/etc/triliovault-dms/client.conf).
        Format: mysql+pymysql://<user>:<pass>@<host>/<db>
        Obtain from the WLM pod:
          kubectl exec -n openstack trilio-wlm-k8s-0 -c trilio-wlm -- \
            grep ^connection /etc/triliovault-wlm/triliovault-wlm.conf
