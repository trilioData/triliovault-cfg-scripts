name: trilio-data-mover-sunbeam
type: charm
title: TrilioVault DataMover (Sunbeam)
summary: TrilioVault DataMover subordinate charm for Sunbeam Canonical OpenStack
description: |
  Deploys TrilioVault DataMover (tvault-contego) as a Juju subordinate charm
  co-located on every compute node running openstack-hypervisor.

  This charm targets Sunbeam Canonical OpenStack specifically. It differs from
  trilio-data-mover (which is subordinate to nova-compute on traditional
  Canonical OpenStack) in these ways:
    - Subordinate target: openstack-hypervisor (not nova-compute)
    - Framework: ops (not charms.reactive)
    - Credentials: keystone-credentials interface (cross-model SAAS from openstack model)

  When a new compute node joins via "sunbeam cluster join", openstack-hypervisor
  creates a new principal unit on that machine. Juju then automatically creates a
  trilio-data-mover subordinate unit on the same machine — no operator
  action is required from the Trilio side.

subordinate: true

base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    plugin: charm
    source: .
    build-packages:
      - git

requires:
  juju-info:
    interface: juju-info
    scope: container
  amqp:
    interface: rabbitmq
  identity-credentials:
    interface: keystone-credentials
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  ceph:
    interface: ceph-client
    optional: true

provides:
  data-mover:
    interface: data-mover
    scope: container

config:
  options:
    # --- External Ceph -------------------------------------------------------
    # For a Ceph cluster deployed OUTSIDE Sunbeam by third-party tooling there
    # is no microceph/ceph-mon Juju application to relate to.
    #
    # YOU MUST PRE-CREATE THE CEPH CLIENT YOURSELF. In relation mode the broker
    # auto-provisions a client named after the Juju application and the charm
    # only adjusts its caps. In external mode there is no broker and the charm
    # holds no admin credential for a cluster it does not manage, so it can
    # neither create a user nor grant caps. On a Ceph admin node:
    #
    #   ceph auth get-or-create client.trilio \
    #     mon 'profile rbd' \
    #     osd 'profile rbd pool=<cinder-pool>, profile rbd pool=<nova-pool>' \
    #     -o ceph.client.trilio.keyring
    #
    # then pass that client name as ceph-client-name and the file contents as
    # ceph-keyring. Reusing an existing client (e.g. cinder) works too.
    #
    # Setting BOTH ceph-conf and ceph-keyring switches the charm to external
    # mode: it renders the [ceph] stanzas in triliovault-datamover.conf and
    # skips the broker request entirely.
    #
    # Note Nova does not read /etc/ceph on Sunbeam — its attach flow is dynamic
    # via Cinder's connection_info, which carries the mon addresses per volume.
    # So a compute node here typically has NO ceph.conf of its own, and these
    # values are what actually provide one. They are still write-if-absent, so
    # a file some other tool did place is reused rather than replaced.
    #
    # Leave both empty on a cloud with no Ceph at all — the Ceph stanzas are
    # then simply not rendered, which is the correct outcome, not a failure.
    ceph-conf:
      type: string
      default: ""
      description: |
        EXTERNAL MODE ONLY. Full contents of ceph.conf for an external Ceph
        cluster. Must include a mon host line.

        Source it from the external cluster, e.g. /etc/ceph/ceph.conf on a Ceph
        admin node.

        WRITE-IF-ABSENT: written to /etc/ceph/ceph.conf only when that file
        does not already exist. On Sunbeam a compute node usually has none —
        Nova reaches Ceph via Cinder's per-volume connection_info, not via
        /etc/ceph — so in practice this value is what provides it. If some
        other tool did place a ceph.conf there, that file is reused as-is and
        this value is ignored, because whatever put it there is the authority
        on its contents. Delete it first if you want ours instead.
        Ignored entirely unless ceph-keyring is also set.
    ceph-keyring:
      type: string
      default: ""
      description: |
        EXTERNAL MODE ONLY. Full contents of the Ceph client keyring.

        WRITE-IF-ABSENT: written to
        /etc/ceph/ceph.client.<ceph-client-name>.keyring only when that file
        does not already exist. If you point ceph-client-name at a client the
        cloud already has a keyring for (commonly `cinder`), that keyring is
        reused untouched and this value is ignored — overwriting it would
        replace the credential Nova and Cinder use on that node.
        When written, it is written as-is rather than synthesised, so an
        existing [client.X] stanza and its caps lines are preserved. The client
        needs at least 'osd allow rwx' on the Cinder/Nova RBD pools contego
        must read. Ignored entirely unless ceph-conf is also set.

        SECURITY: this is a cephx secret and Juju config is NOT secret storage.
        The value is held in the controller database, printed by
        `juju config trilio-data-mover`, and emitted by `juju export-bundle`.
        Never paste a real key into a bundle file that gets committed. Set it
        from a file at deploy time instead:
          juju config trilio-data-mover ceph-keyring="$(cat ./ceph.client.cinder.keyring)"
        Migrating this to a Juju user secret is tracked as follow-up work.
    ceph-client-name:
      type: string
      default: ""
      description: |
        EXTERNAL MODE ONLY — has no effect without ceph-conf and ceph-keyring,
        because the relation path takes its client name from the Juju
        application name (the broker mints the key under that name, and a
        mismatch silently targets a key that was never created).
        Name of a Ceph client YOU created on the external cluster (or an
        existing one you are reusing, e.g. cinder). The charm cannot create it
        — see the header note above. Determines the keyring filename and
        rbd_user. Defaults to the Juju application name, which is usually NOT
        what an external cluster calls its client, so the charm warns if you
        leave it unset in external mode.
    ceph-pools:
      type: string
      default: ""
      description: |
        EXTERNAL MODE ONLY. Comma-separated RBD pools the external client can
        read, e.g. "cinder-volumes,nova". Informational only — recorded so
        diagnostics match the relation path. Nothing verifies it against the
        cluster, because with an external cluster there is no broker to ask.

    triliovault-pkg-source:
      type: string
      default: "deb [trusted=yes] https://apt.fury.io/trilio-maint-6-2 /"
      description: APT repository line for TrilioVault packages
    trilio-version:
      type: string
      default: ""
      description: |
        Specific tvault-contego package version to install, e.g. "6.2.1".
        Leave empty to install the latest available version from the repo.
    debug:
      type: boolean
      default: false
      description: Enable debug logging
    rabbit-quorum-queue:
      type: boolean
      default: true
      description: |
        Must match nova.conf's rabbit_quorum_queue on this compute node.
        Applied to both contego's oslo_messaging_rabbit section and this
        charm's own compute-side DMS server (mapped to trilio_dms's
        rabbitmq_queue_type: quorum when true, classic when false). A
        mismatched durability flag on a shared-name queue gets a 406
        PRECONDITION_FAILED from RabbitMQ.
    amqp-durable-queues:
      type: boolean
      default: true
      description: |
        Standard oslo.messaging amqp_durable_queues setting, applied to
        contego's oslo_messaging_rabbit section. Also maps to trilio_dms's
        rabbitmq_queue_durable for this charm's own compute-side DMS server
        (quorum/stream queue types there are always durable regardless of
        this setting — only affects behavior when rabbit-quorum-queue is
        false / classic queue type).
    wlm-db-url:
      type: string
      default: ""
      description: |
        WLM database URL for the DMS client conf (/etc/triliovault-dms/client.conf).
        Format: mysql+pymysql://<user>:<pass>@<host>/<db>
        Obtain from the WLM pod:
          kubectl exec -n openstack trilio-wlm-k8s-0 -c trilio-wlm -- \
            grep ^connection /etc/triliovault-wlm/triliovault-wlm.conf
