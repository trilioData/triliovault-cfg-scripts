name: trilio-dms-k8s
type: charm
title: TrilioVault Dynamic Mount Service k8s
summary: TrilioVault DMS k8s charm for Sunbeam Canonical OpenStack (control plane)
description: |
  Deploys the TrilioVault Dynamic Mount Service (DMS) server on the Sunbeam
  control plane as a Kubernetes charm.

  DMS is a mount-coordination daemon that handles NFS and S3 (via s3vaultfuse)
  mount/unmount operations on behalf of WLM and DMAPI. Communication between
  the DMS server and its clients (WLM, DMAPI) is done via RabbitMQ — DMS has
  no HTTP listener of its own.

  A DMS server instance must also run on every compute node. That is handled
  by the trilio-data-mover charm (machine subordinate), which runs the
  compute-side DMS server alongside tvault-contego on each openstack-hypervisor.

assumes:
  - k8s-api
  - juju >= 3.1

bases:
  - build-on:
      - name: ubuntu
        channel: "22.04"
    run-on:
      - name: ubuntu
        channel: "22.04"

containers:
  trilio-dms:
    resource: trilio-dms-image
    envConfig:
      K8S_NODE_NAME:
        field:
          path: spec.nodeName
          api-version: v1

resources:
  trilio-dms-image:
    type: oci-image
    description: OCI image for TrilioVault Dynamic Mount Service
    upstream-source: docker.io/trilio/trilio-dms-canonical:6.2.1-2024.1

requires:
  amqp:
    interface: rabbitmq
    limit: 1
  receive-ca-cert:
    interface: certificate_transfer
    optional: true

config:
  options:
    debug:
      type: boolean
      default: false
      description: Enable debug logging
    rabbit-quorum-queue:
      type: boolean
      default: true
      description: |
        Must match nova.conf's rabbit_quorum_queue on the compute nodes.
        Maps to trilio_dms's rabbitmq_queue_type (quorum when true, classic
        when false). A mismatched durability flag on a shared-name queue
        gets a 406 PRECONDITION_FAILED from RabbitMQ.
    amqp-durable-queues:
      type: boolean
      default: true
      description: |
        Standard oslo.messaging amqp_durable_queues setting. Maps to
        trilio_dms's rabbitmq_queue_durable — quorum/stream queue types are
        always durable regardless of this setting, so it only affects
        behavior when rabbit-quorum-queue is false (classic queue type).
    worker-threads:
      type: int
      default: 10
      description: Number of worker threads for parallel mount request processing
    keystone-endpoint:
      type: string
      default: "http://keystone-k8s.openstack.svc.cluster.local:5000/v3"
      description: |
        Keystone identity service internal URL used as auth_url in server.conf
        for Barbican token validation. Defaults to the k8s-internal Keystone
        service DNS name (standard for Sunbeam). Override only if your cluster
        uses a different Keystone endpoint.
    wlm-db-url:
      type: string
      default: ""
      description: |
        WLM database URL for the DMS client conf (/etc/triliovault-dms/client.conf).
        Format: mysql+pymysql://<user>:<pass>@<host>/<db>
        Obtain from the WLM pod:
          kubectl exec -n openstack trilio-wlm-k8s-0 -c trilio-wlm -- \
            grep ^connection /etc/triliovault-wlm/triliovault-wlm.conf
