name: trilio-wlm-k8s
type: charm
title: TrilioVault WorkloadManager (Kubernetes)
summary: TrilioVault WorkloadManager K8s charm for Sunbeam Canonical OpenStack
description: |
  Deploys TrilioVault WorkloadManager on Sunbeam Canonical OpenStack as a
  Kubernetes charm. Runs four microservices as Pebble-managed services inside
  the trilio-wlm container:
    - wlm-api      (REST API, port 8781 — Keystone service type: workloads)
    - wlm-workloads (background workload processor)
    - wlm-scheduler (job scheduler)
    - wlm-cron     (periodic cron jobs — leader unit only, singleton)

  wlm-cron is intentionally started only on the leader unit to prevent duplicate
  scheduled job execution across multiple replicas.

  Also runs a co-located Dynamic Mount Service (DMS) server as a second
  container (trilio-dms) in the same pod — one DMS instance per WLM replica.
  This is the control-plane DMS; a separate, independent instance also runs
  on every compute node via trilio-data-mover-sunbeam.

assumes:
  - k8s-api
  - juju >= 3.1

bases:
  - build-on:
      - name: ubuntu
        channel: "22.04"
    run-on:
      - name: ubuntu
        channel: "22.04"

containers:
  trilio-wlm:
    resource: trilio-wlm-image
  trilio-dms:
    resource: trilio-wlm-image

resources:
  trilio-wlm-image:
    type: oci-image
    description: >
      OCI image for TrilioVault WorkloadManager and the embedded DMS sidecar.
      Both trilio-wlm and trilio-dms containers use this same image — the WLM
      image already includes python3-trilio-dms and python3-s3-fuse-plugin.
    upstream-source: docker.io/trilio/trilio-wlm-canonical:6.2.1-2024.1
  license:
    type: file
    filename: license
    description: TrilioVault license file. Attach with juju attach-resource trilio-wlm-k8s license=<path>

requires:
  database:
    interface: mysql_client
    limit: 1
  amqp:
    interface: rabbitmq
    limit: 1
  amqp-dms:
    interface: rabbitmq
    limit: 1
  identity-service:
    interface: keystone
    limit: 1
  ingress-internal:
    interface: ingress
    optional: true
    limit: 1
  ingress-public:
    interface: ingress
    optional: true
    limit: 1
  receive-ca-cert:
    interface: certificate_transfer
    optional: true

provides:
  wlm-service:
    interface: wlm-service

peers:
  peers:
    interface: trilio-wlm-peer

config:
  options:
    api-workers:
      type: int
      default: 2
      description: Number of wlm-api worker processes
    workloads-workers:
      type: int
      default: 2
      description: Number of wlm-workloads worker processes
    debug:
      type: boolean
      default: false
      description: Enable debug logging for all WLM services
    nova-endpoint:
      type: string
      # Sunbeam's nova-k8s charm's own k8s Service is named "nova" (not
      # "nova-k8s" — that's the *application*/charm name, a different thing).
      default: "http://nova.openstack.svc.cluster.local:8774/v2.1"
      description: Nova internal endpoint URL for WLM to call
    neutron-endpoint:
      type: string
      default: "http://neutron.openstack.svc.cluster.local:9696"
      description: Neutron internal endpoint URL for WLM to call
    cinder-endpoint:
      type: string
      default: "http://cinder.openstack.svc.cluster.local:8776/v3/%(tenant_id)s"
      description: Cinder internal endpoint URL for WLM to call
    glance-endpoint:
      type: string
      default: "http://glance.openstack.svc.cluster.local:9292"
      description: Glance internal endpoint URL for WLM to call
    region:
      type: string
      default: "RegionOne"
      description: OpenStack region name
    trustee-role:
      type: string
      default: "member, creator"
      description: |
        Keystone role(s) delegated via the *per-tenant* workload trust that
        workloadmgr's own runtime code creates automatically for each project
        (not the separate cloud-admin trust — that one is unrelated to this
        option and always requests "admin" directly, hardcoded in the
        create-cloud-admin-trust action, matching the older charm-trilio-wlm
        reactive charm's own behavior). Comma-separated. Must match the
        role(s) assigned to tenant users in Keystone. Matches the value used
        by known-working charm-trilio-wlm reference deployments on the same
        OpenStack release (Caracal/2024.1) — "admin" is not required here;
        it was previously included by mistake, conflating this per-tenant
        trust with the cloud-admin trust's own, separate, legitimate need
        for admin (Nova's Secure RBAC gates the OS-EXT-SRV-ATTR:host field,
        which dm-api needs to route contego RPCs, behind admin context —
        but only the cloud-admin trust actually needs to satisfy that check).
    rabbit-quorum-queue:
      type: boolean
      default: true
      description: |
        Must match nova.conf's rabbit_quorum_queue on the compute nodes —
        contego shares RPC queue names with dm-api/DMS, and declaring the
        same queue with a different durability flag on each side gets a 406
        PRECONDITION_FAILED from RabbitMQ. Sunbeam/Caracal defaults to true;
        override only if your deployment's nova.conf sets this to false.
    amqp-durable-queues:
      type: boolean
      default: true
      description: |
        Standard oslo.messaging amqp_durable_queues setting. Must match
        nova.conf's convention on the compute nodes for the same reason as
        rabbit-quorum-queue.
    cloud-admin-role:
      type: string
      default: "admin"
      description: Keystone role name of the cloud administrator.
    cloud-admin-domain:
      type: string
      default: "admin_domain"
      description: |
        Keystone domain name (or ID) of the cloud administrator.
        Sunbeam default is "admin_domain".
    cloud-admin-user-id:
      type: string
      default: ""
      description: |
        Keystone UUID of the cloud admin user, needed for workloadmgr's own
        cloud-admin trust lookup (workloadmgr/compute/nova.py's
        _get_trusts('cloud_admin', CONF.cloud_admin_project_id)) to find the
        trust created by the create-cloud-admin-trust action.
        Leave empty (default) to auto-populate from the identity-service
        relation's admin-user-id field, which keystone-k8s already publishes —
        no manual lookup needed in the normal case. Set explicitly only if the
        cloud-admin identity differs from the relation's own admin user
        (e.g. openstack user show <user> -f value -c id).
    cloud-admin-project-id:
      type: string
      default: ""
      description: |
        Keystone UUID of the cloud admin project — same purpose and same
        auto-population behavior as cloud-admin-user-id above (sourced from
        the identity-service relation's admin-project-id field when left
        empty). Set explicitly only if it differs from the relation's own
        admin project (e.g. openstack project show <project> -f value -c id).
    cloud-unique-id:
      type: string
      default: ""
      description: |
        Keystone UUID of the WLM service user. Uniquely identifies this WLM
        deployment to other TrilioVault components. Populate after deployment:
          openstack user show <wlm-service-username> -f value -c id
    dms-worker-threads:
      type: int
      default: 10
      description: |
        Number of worker threads for the embedded DMS server's parallel mount
        request processing (see trilio-dms container in this charm's docstring).
