create-cloud-admin-trust:
  description: |
    Create trust between the TrilioVault WLM service user and the Cloud Admin.
    This is required once after initial deployment before using TrilioVault.

    Example:
      juju run trilio-wlm-k8s/leader create-cloud-admin-trust password=<admin-password>
  params:
    password:
      type: string
      description: Cloud admin account password
    user-domain-name:
      type: string
      description: Admin user domain name
      default: admin_domain
    project-name:
      type: string
      description: Admin project name
      default: admin
    project-domain-name:
      type: string
      description: Admin project domain name
      default: admin_domain
  required:
    - password

create-license:
  description: |
    Apply the TrilioVault license file.

    The licence is read from the `license` Juju resource and copied into the
    trilio-wlm workload container by the action itself — no kubectl cp:

      juju attach-resource trilio-wlm-k8s license=<path-to-license-file>
      juju run trilio-wlm-k8s/leader create-license

    The attached file must have NO extension: the resource declares
    `filename: license` and Juju validates the uploaded file's extension
    against it, so copy license_trilio.txt to a file named `license` first.

    license-file-path is an optional override for a licence already inside the
    trilio-wlm container; when it is given the resource is not read. Note the
    action runs on the leader, so in that mode the file must be on the leader's
    pod, not just pod 0 — which is the reason the resource is the default.

    OpenStack credentials are read automatically from the identity-service
    relation (the WLM service account) — no password parameter needed.
  params:
    license-file-path:
      type: string
      description: >
        Optional override. Path to a licence file already present inside the
        trilio-wlm workload container. When set, the attached `license`
        resource is ignored.
