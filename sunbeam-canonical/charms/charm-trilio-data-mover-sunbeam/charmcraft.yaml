name: trilio-data-mover-sunbeam
type: charm
title: TrilioVault DataMover (Sunbeam)
summary: TrilioVault DataMover subordinate charm for Sunbeam Canonical OpenStack
description: |
  Deploys TrilioVault DataMover (tvault-contego) as a Juju subordinate charm
  co-located on every compute node running openstack-hypervisor.

  This charm targets Sunbeam Canonical OpenStack specifically. It differs from
  charm-trilio-data-mover (which is subordinate to nova-compute on traditional
  Canonical OpenStack) in these ways:
    - Subordinate target: openstack-hypervisor (not nova-compute)
    - Framework: ops (not charms.reactive)
    - Credentials: keystone-credentials interface (cross-model SAAS from openstack model)

  When a new compute node joins via "sunbeam cluster join", openstack-hypervisor
  creates a new principal unit on that machine. Juju then automatically creates a
  trilio-data-mover-sunbeam subordinate unit on the same machine — no operator
  action is required from the Trilio side.

subordinate: true

bases:
  - build-on:
      - name: ubuntu
        channel: "22.04"
    run-on:
      - name: ubuntu
        channel: "22.04"

requires:
  juju-info:
    interface: juju-info
    scope: container
  amqp:
    interface: rabbitmq
  identity-credentials:
    interface: keystone-credentials

provides:
  data-mover:
    interface: data-mover
    scope: container

config:
  options:
    triliovault-pkg-source:
      type: string
      default: "deb [trusted=yes] https://apt.trilio.io jammy main"
      description: APT repository line for TrilioVault packages
    trilio-version:
      type: string
      default: ""
      description: |
        Specific tvault-contego package version to install, e.g. "6.2.1".
        Leave empty to install the latest available version from the repo.
    debug:
      type: boolean
      default: false
      description: Enable debug logging
    backup-target-type:
      type: string
      default: "nfs"
      description: Backup target type — nfs or s3
    nfs-shares:
      type: string
      default: ""
      description: "NFS share for backup target, e.g. 192.168.1.10:/backup"
    nfs-options:
      type: string
      default: "nolock,soft,timeo=600,intr,lookupcache=none,nfsvers=3,retrans=10"
      description: NFS mount options
    s3-access-key:
      type: string
      default: ""
      description: S3 access key ID
    s3-secret-key:
      type: string
      default: ""
      description: S3 secret access key
    s3-bucket:
      type: string
      default: ""
      description: S3 bucket name
    s3-region:
      type: string
      default: ""
      description: S3 region name
    s3-endpoint-url:
      type: string
      default: ""
      description: S3 endpoint URL (leave empty for AWS S3)
    s3-ssl-enabled:
      type: boolean
      default: true
      description: Enable SSL for S3 connections
