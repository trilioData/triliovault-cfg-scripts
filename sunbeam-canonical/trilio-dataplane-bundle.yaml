# TrilioVault Data Plane Bundle for Sunbeam Canonical OpenStack
#
# Deploys trilio-data-mover as a Juju subordinate charm into the
# "openstack-machines" (machine) model. The subordinate co-locates automatically
# on every machine running openstack-hypervisor — including new nodes that join
# the cluster later via "sunbeam cluster join".
#
# Usage:
#   ./deploy_dataplane.py
#
# Deploying this file directly with `juju deploy` installs the DataMover but
# leaves it unrelated — a subordinate with no principal never gets a unit. The
# script binds it to openstack-hypervisor and wires the rest.
#
# ---------------------------------------------------------------------------
# SCOPE — this bundle installs Trilio services ONLY.
#
# The applications section lists trilio-data-mover and nothing else.
# openstack-hypervisor and microceph already exist in a bootstrapped Sunbeam
# cloud and are owned by Sunbeam — microceph in particular is Sunbeam's storage
# layer, never ours to install. We integrate with them after deploy; we never
# declare, deploy, refresh or rescale them.
#
# This is not a style preference, it is the fix for TVAULT-7644. `juju deploy
# <bundle>` is a DESIRED-STATE operation over every application named in the
# applications section, whether or not the bundle is meant to own it. This file
# used to declare microceph with revision 251 pinned to whatever one cloud ran on
# 2026-07-24; the QA cloud had since moved to microceph 296, so the entire
# install died before a single Trilio charm was deployed:
#
#   ERROR cannot deploy bundle: application "microceph": downgrades are not
#   currently supported: deployed revision 296 is newer than requested revision 251
#
# Pinning the other direction is worse, not better — it silently refreshes a core
# Sunbeam charm off its supported revision with no error at all. And omitting the
# pins is what caused the TVAULT-7404 control-plane outage. There is no safe
# value: declaring the app at all is the bug.
#
# NEVER add an application to this file that Trilio does not own.
# ---------------------------------------------------------------------------

applications:

  trilio-data-mover:
    charm: trilio-data-mover-sunbeam
    channel: 6.2/candidate
    revision: 15
    options:
      triliovault-pkg-source: "deb [trusted=yes] https://apt.fury.io/trilio-maint-6-2 /"
      trilio-version: ""     # Leave empty for latest; or pin to e.g. "6.2.1"
      debug: false

# ---------------------------------------------------------------------------
# There is deliberately no relations section and no saas section.
#
# Every relation this charm needs points at something Sunbeam owns, so none of
# them can be expressed here: Juju's bundle validator requires each relation
# endpoint to name an application declared in this bundle (or a saas alias).
# deploy_dataplane.py adds them all with `juju integrate`, which touches only the
# relation and can never refresh or rescale an application.
#
# ALWAYS (the DataMover cannot work without these):
#   trilio-data-mover:juju-info            <-> openstack-hypervisor:juju-info
#   trilio-data-mover:amqp                 <-> <rabbitmq offer>:amqp
#   trilio-data-mover:identity-credentials <-> <keystone-credentials offer>:identity-credentials
#
# CONDITIONAL — added only when the cloud actually has them:
#   trilio-data-mover:ceph            <-> microceph:ceph
#   trilio-data-mover:receive-ca-cert <-> <cert-distributor offer>:send-ca-cert
#
# The saas section is gone on purpose. Offer URLs are SITE-SPECIFIC: they embed
# the offering controller/user and model of your own cloud. This file used to
# hardcode "sunbeam-controller:controller0/openstack.*", which matches exactly
# one lab — the same class of bug as the revision pins. The script now discovers
# the real URLs with `juju offers -m <ctlplane-model>` and consumes them, so nothing site-local
# is committed here.
#
# WHY ceph is conditional: microceph may not exist at all — a Sunbeam cloud
# backed by local/LVM storage is a valid configuration and Trilio must run there.
# The charm declares `ceph` as optional and runs fine unrelated; it discovers
# whether Cinder/Nova actually use Ceph (_discover_cinder_ceph_pools /
# _discover_nova_ceph_pool) and _ceph_backend_enabled() gates the [libvirt] and
# [ceph] config blocks off when no pools were granted. The relation only buys
# contego its own Ceph credentials for direct rbd CLI use against Ceph-backed
# Cinder volumes; Nova's own attach flow does not need it. If OpenStack does not
# use Ceph, neither do we.
#
# WHY receive-ca-cert is conditional: upstream Sunbeam treats cert-distributor as
# an optional offer — the CLI returns it from get_optional_control_plane_offers(),
# types it as optional(string) in tfvars, and gates every cross-model integration
# with `count = (var.cert-distributor-offer-url != null) ? 1 : 0`. All 27 upstream
# charms declare receive-ca-cert with `optional: true`, and ops_sunbeam registers
# its handler without the mandatory flag, so the charm must go Active without it.
# Ours match that. When the offer IS present (any TLS-enabled Sunbeam) the script
# adds the relation — and it matters there: without the CA bundle,
# keystonemiddleware fails TLS verification against the Keystone HTTPS endpoint.
# ---------------------------------------------------------------------------
