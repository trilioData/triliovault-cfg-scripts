# TrilioVault Data Plane Bundle for Sunbeam Canonical OpenStack
#
# Deploys trilio-data-mover as a Juju subordinate charm into the
# "openstack-machines" (machine) model. The subordinate co-locates automatically
# on every machine running openstack-hypervisor -- including new nodes that join
# the cluster later via "sunbeam cluster join".
#
# Usage:
#   ./deploy_trilio.py dataplane
#
# This bundle declares TRILIO APPLICATIONS ONLY. openstack-hypervisor and
# microceph are Sunbeam's, not ours, and are NOT declared here -- see the note
# in trilio-ctlplane-bundle.yaml for why referencing them is what broke
# TVAULT-7644. The relations to them, and the cross-model offers for rabbitmq /
# keystone-credentials / cert-distributor, are added by deploy_trilio.py.
#
# There is no saas: section either: the offer URLs embed the controller, user
# and model name, so they differ on every cloud. The script reads the real ones
# from the control-plane model instead of hardcoding one lab's values.

applications:

  trilio-data-mover:
    charm: trilio-data-mover-sunbeam
    channel: 6.2/candidate
    revision: 16
    options:
      triliovault-pkg-source: "deb [trusted=yes] https://apt.fury.io/trilio-maint-6-2 /"
      trilio-version: ""     # Leave empty for latest; or pin to e.g. "6.2.1"
      debug: false
