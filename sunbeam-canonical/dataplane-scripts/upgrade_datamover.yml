---
# Rolling upgrade of TrilioVault DataMover on Sunbeam compute nodes.
# Upgrades nodes one at a time (serial: 1) to avoid a full-cluster outage.
# The play stops immediately if a node fails — fix the failed node before continuing.
#
# Usage:
#   ansible-playbook -i inventory.ini upgrade_datamover.yml
#   ansible-playbook -i inventory.ini upgrade_datamover.yml --limit compute01  # single node
#   ansible-playbook -i inventory.ini upgrade_datamover.yml -e "serial_count=5% # upgrade 5% at a time
#
- name: Pre-upgrade health check
  hosts: compute
  gather_facts: false
  serial: "{{ serial_count | default('100%') }}"

  tasks:
    - name: Check tvault-contego is currently active before upgrading
      ansible.builtin.command: systemctl is-active tvault-contego
      register: pre_status
      changed_when: false
      failed_when: false
      become: true

    - name: Warn if tvault-contego is already not running on a node
      ansible.builtin.debug:
        msg: "WARNING: {{ inventory_hostname }}: tvault-contego is {{ pre_status.stdout }} before upgrade started"
      when: pre_status.stdout != "active"

- name: Rolling upgrade of TrilioVault DataMover
  hosts: compute
  gather_facts: true
  serial: 1
  max_fail_percentage: 0

  vars:
    # Override in group_vars/compute.yml
    # Required: trilio_apt_repo_url, dmapi_transport_url, dmapi_database_connection

  tasks:
    - name: Upgrade tvault-contego on this node
      ansible.builtin.include_role:
        name: trilio-openstack
        tasks_from: upgrade.yml

- name: Post-upgrade verification across all nodes
  hosts: compute
  gather_facts: false

  tasks:
    - name: Get tvault-contego service status after upgrade
      ansible.builtin.command: systemctl is-active tvault-contego
      register: post_status
      changed_when: false
      failed_when: false
      become: true

    - name: Get upgraded package version
      ansible.builtin.command: dpkg-query -W -f='${Version}' python3-tvault-contego
      register: pkg_version
      changed_when: false
      become: true

    - name: Report final status for all nodes
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: version={{ pkg_version.stdout }}, service={{ post_status.stdout }}"

    - name: Fail if tvault-contego is not active after upgrade
      ansible.builtin.fail:
        msg: "tvault-contego is NOT running on {{ inventory_hostname }} after upgrade (status: {{ post_status.stdout }})"
      when: post_status.stdout != "active"
