---
# Playbook to install TrilioVault DataMover on all Sunbeam data plane nodes
# Run from the Sunbeam primary/bootstrap node which has SSH access to all data plane nodes
# via MAAS-injected SSH keys.
#
# Usage:
#   ansible-playbook -i inventory.ini install_datamover.yml
#   ansible-playbook -i inventory.ini install_datamover.yml --tags trilio-configure  # reconfigure only
#   ansible-playbook -i inventory.ini install_datamover.yml --limit node01           # single node
#
# To generate inventory.ini from a live Sunbeam cluster, run:
#   openstack hypervisor list -f value -c 'Hypervisor Hostname' | \
#       awk 'BEGIN{print "[trilio_data_plane]"} {print $1}' > inventory.ini
#
- name: Install TrilioVault DataMover on Sunbeam data plane nodes
  hosts: trilio_data_plane
  gather_facts: true
  become: false

  vars:
    # Override these in group_vars/trilio_data_plane.yml or on the command line.
    # Run generate_dataplane_vars.sh to auto-populate connectivity values.

  roles:
    - role: trilio-openstack

- name: Verify DataMover service status on all data plane nodes
  hosts: trilio_data_plane
  gather_facts: false

  tasks:
    - name: Get tvault-contego service status
      ansible.builtin.command: systemctl is-active tvault-contego
      register: dm_status
      changed_when: false
      failed_when: false
      become: true

    - name: Report DataMover service status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: tvault-contego is {{ dm_status.stdout }}"

    - name: Collect failed nodes
      ansible.builtin.set_fact:
        dm_failed: "{{ dm_status.stdout != 'active' }}"

    - name: Fail if any DataMover service is not active
      ansible.builtin.fail:
        msg: "tvault-contego is NOT running on {{ inventory_hostname }} (status: {{ dm_status.stdout }})"
      when: dm_failed
