---
# T4O version
trilio_version: "6.2.1"

# Container images — aligned with RHOSO18 cm-trilio-datamover.yaml
triliovault_datamover_image: "docker.io/trilio/trilio-datamover-canonical:6.2.1-2024.1"
triliovault_wlm_image: "docker.io/trilio/trilio-wlm-canonical:6.2.1-2024.1"
triliovault_dms_image: "docker.io/trilio/trilio-dms-canonical:6.2.1-2024.1"

# Container registry authentication.
# Set trilio_container_registry_login_enabled to true and supply credentials
# when pulling from a private registry. Leave false for public docker.io images.
trilio_container_registry_login_enabled: false
trilio_container_registry_url: "docker.io"
trilio_container_registry_username: ""
trilio_container_registry_password: ""

# Service name
trilio_datamover_service: "tvault-contego"

# Config file locations
trilio_conf_dir: "/etc/triliovault-datamover"
trilio_datamover_conf: "{{ trilio_conf_dir }}/tvault-contego.conf"
trilio_log_conf: "{{ trilio_conf_dir }}/datamover_logging.conf"
trilio_log_dir: "/var/log/triliovault"

# Datamover runtime config — mirrors RHOSO18 cm-trilio-datamover.yaml parameters
vault_data_dir: "/var/lib/trilio/triliovault-mounts"
dmapi_transport_url: ""
dmapi_database_connection: ""

# Keystone
keystone_auth_url: ""
keystone_ssl_verify: false

# RabbitMQ / oslo messaging
rabbit_ssl: false
rabbit_quorum_queue: false
oslomsg_rpc_use_ssl: false

# Ceph / Cinder
cinder_backend_ceph: false
libvirt_images_rbd_ceph_conf: "/etc/ceph/ceph.conf"
ceph_cinder_user: "cinder"
cinder_http_retries: "10"

# S3VaultFuse global config — mirrors RHOSO18 s3vaultfuse_global defaults
s3vaultfuse_global:
  default:
    vault_storage_type: "s3"
    vault_s3_max_pool_connections: 50
    vault_s3_read_timeout: 30
    vault_s3_max_attempts: 3
    vault_s3_auth_version: "DEFAULT"
    vault_s3_signature_version: "default"
    vault_s3_ssl: "True"
    vault_s3_ssl_verify: "True"
    vault_s3_region_name: "us-east-1"
    vault_segment_size: 33554432
    vault_cache_size: 16
    queue_depth: 100
    worker_pool_size: 10
    vault_retry_count: 2
    vault_enable_threadpool: "True"
    vault_threaded_filesystem: "True"
    max_uploads_pending: 20
    vault_logging_level: "error"
    log_file: "/var/log/triliovault/triliovault-object-store.log"
    log_config_append: "/etc/triliovault-object-store/object_store_logging.conf"
    trace_function_calls: "False"
    bucket_object_lock: "False"
    use_manifest_suffix: "False"
    azure_immutability_enabled: "False"
    metadata_cache_max_items: 32
    vault_cache_username: "nova"
  s3fuse_sys_admin:
    helper_command: "sudo /usr/bin/privsep-helper"
