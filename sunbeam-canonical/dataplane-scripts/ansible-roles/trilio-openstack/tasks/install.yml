---
- name: Install Docker and DataMover host dependencies
  ansible.builtin.apt:
    name:
      - docker.io
      - fuse
      - libfuse2
      - nfs-common
      - qemu-utils
      - python3-libvirt
    state: present
    update_cache: true
  become: true

- name: Log in to container registry
  community.docker.docker_login:
    registry_url: "{{ trilio_container_registry_url }}"
    username: "{{ trilio_container_registry_username }}"
    password: "{{ trilio_container_registry_password }}"
  become: true
  when: trilio_container_registry_login_enabled | bool
  no_log: true

- name: Pull TrilioVault DataMover image
  community.docker.docker_image:
    name: "{{ triliovault_datamover_image }}"
    source: pull
    force_source: true
  become: true
  notify: restart tvault-contego

- name: Pull TrilioVault DMS image
  community.docker.docker_image:
    name: "{{ triliovault_dms_image }}"
    source: pull
    force_source: true
  become: true

- name: Ensure required directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ trilio_conf_dir }}"
    - "{{ trilio_log_dir }}"
    - "{{ vault_data_dir }}"
  become: true

- name: Enable user_allow_other in fuse.conf (required for DataMover mounts)
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    line: "user_allow_other"
    state: present
  become: true
