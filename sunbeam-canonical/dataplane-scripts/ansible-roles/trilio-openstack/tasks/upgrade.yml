---
# Graceful upgrade of tvault-contego on a single compute node.
# Called by upgrade_datamover.yml with serial batching so nodes are upgraded
# one at a time (or in small batches) without a full-cluster outage.

- name: Check current installed tvault-contego version
  ansible.builtin.command: dpkg-query -W -f='${Version}' python3-tvault-contego
  register: current_version
  changed_when: false
  failed_when: false
  become: true

- name: Show current version before upgrade
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: tvault-contego current version = {{ current_version.stdout | default('not installed') }}"

- name: Gracefully stop tvault-contego before package upgrade
  ansible.builtin.systemd:
    name: "{{ trilio_datamover_service }}"
    state: stopped
  become: true
  async: 60
  poll: 5

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Upgrade TrilioVault DataMover packages
  ansible.builtin.apt:
    name:
      - "{{ trilio_datamover_package }}"
      - "{{ trilio_s3_fuse_package }}"
    state: latest
    allow_unauthenticated: true
  become: true

- name: Update tvault-contego configuration
  ansible.builtin.template:
    src: triliovault_datamover_conf.j2
    dest: "{{ trilio_datamover_conf }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Reload systemd and start tvault-contego
  ansible.builtin.systemd:
    name: "{{ trilio_datamover_service }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Wait for tvault-contego to become active
  ansible.builtin.command: systemctl is-active tvault-contego
  register: post_upgrade_status
  until: post_upgrade_status.stdout == "active"
  retries: 12
  delay: 5
  changed_when: false
  become: true

- name: Check upgraded tvault-contego version
  ansible.builtin.command: dpkg-query -W -f='${Version}' python3-tvault-contego
  register: upgraded_version
  changed_when: false
  become: true

- name: Report upgrade result for this node
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: tvault-contego upgraded {{ current_version.stdout | default('N/A') }} -> {{ upgraded_version.stdout }}, service is {{ post_upgrade_status.stdout }}"
