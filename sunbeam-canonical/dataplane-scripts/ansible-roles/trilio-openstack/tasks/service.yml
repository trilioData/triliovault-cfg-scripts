---
- name: Enable and start tvault-contego service
  ansible.builtin.systemd:
    name: "{{ trilio_datamover_service }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Verify tvault-contego service is running
  ansible.builtin.systemd:
    name: "{{ trilio_datamover_service }}"
  register: service_status
  become: true

- name: Fail if tvault-contego is not active
  ansible.builtin.fail:
    msg: "tvault-contego service is not running: {{ service_status.status.ActiveState }}"
  when: service_status.status.ActiveState != "active"
