## RabbitMQ Cluster for TrilioVault
## Managed by: RabbitMQ Cluster Operator (rabbitmq/cluster-operator)
## Cluster name: trilio-rabbitmq  Namespace: trilio-openstack
##
## 3-replica RabbitMQ cluster with quorum queues.
## Admin credentials are auto-generated by the operator and stored
## in the 'trilio-rabbitmq-default-user' secret.
## T4O-specific vhosts (workloadmgr, dmapi) and users are created
## by deploy_infra.sh after the cluster is ready.
##
## Connection endpoint (inside cluster):
##   trilio-rabbitmq.trilio-openstack.svc.cluster.local:5672
##
## Connection endpoint (compute nodes via NodePort):
##   <node-ip>:30672

apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: trilio-rabbitmq
  namespace: trilio-openstack
spec:
  replicas: 3

  persistence:
    storage: 8Gi

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  override:
    statefulSet:
      spec:
        template:
          spec:
            nodeSelector:
              triliovault-control-plane: "enabled"
