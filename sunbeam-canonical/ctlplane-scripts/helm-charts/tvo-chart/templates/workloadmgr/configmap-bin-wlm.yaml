apiVersion: v1
kind: ConfigMap
metadata:
  name: triliovault-wlm-bin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tvo.labels" . | nindent 4 }}
data:
  wlm-db-init.sh: |
    #!/bin/bash
    set -ex
    workloadmgr-manage db_sync
  wlm-keystone-init.sh: |
    #!/bin/bash
    set -ex
    # Create wlm service user in keystone
    openstack user create --domain default --password {{ .Values.keystone.wlm_api.password }} {{ .Values.keystone.wlm_api.username }} || true
    openstack role add --project service --user {{ .Values.keystone.wlm_api.username }} admin || true
    # Create wlm service
    openstack service create --name workloadmgr --description "TrilioVault Workload Manager" workloadmgr || true
    # Create endpoints — using NodePort address so datamover can reach the API
    NODE_IP={{ .Values.service.node_ip }}
    openstack endpoint create --region {{ .Values.keystone.region }} workloadmgr public http://${NODE_IP}:{{ .Values.service.wlm_api.node_port }}/v1/%\(tenant_id\)s || true
    openstack endpoint create --region {{ .Values.keystone.region }} workloadmgr internal http://${NODE_IP}:{{ .Values.service.wlm_api.node_port }}/v1/%\(tenant_id\)s || true
    openstack endpoint create --region {{ .Values.keystone.region }} workloadmgr admin http://${NODE_IP}:{{ .Values.service.wlm_api.node_port }}/v1/%\(tenant_id\)s || true
