apiVersion: batch/v1
kind: Job
metadata:
  name: triliovault-wlm-keystone-init
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tvo.labels" . | nindent 4 }}
    component: wlm-keystone-init
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        application: triliovault
        component: wlm-keystone-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: triliovault-wlm
      {{- include "tvo.imagePullSecrets" . | nindent 6 }}
      nodeSelector:
        {{ .Values.labels.job.node_selector_key }}: {{ .Values.labels.job.node_selector_value }}
      containers:
        - name: wlm-keystone-init
          image: {{ .Values.images.triliovault_wlm }}
          imagePullPolicy: {{ .Values.images.pull_policy }}
          command: ["/bin/bash", "/tmp/bin/wlm-keystone-init.sh"]
          env:
            - name: OS_AUTH_URL
              value: {{ .Values.keystone.auth_url }}
            - name: OS_PROJECT_NAME
              value: {{ .Values.keystone.admin_project }}
            - name: OS_USERNAME
              value: {{ .Values.keystone.admin_user }}
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trilio-openstack-secret
                  key: CloudAdminPassword
            - name: OS_USER_DOMAIN_NAME
              value: Default
            - name: OS_PROJECT_DOMAIN_NAME
              value: Default
            - name: OS_IDENTITY_API_VERSION
              value: "3"
            {{- include "tvo.caBundleEnv" . | nindent 12 }}
          volumeMounts:
            - name: wlm-bin
              mountPath: /tmp/bin
              readOnly: true
            {{- include "tvo.caBundleVolumeMount" . | nindent 12 }}
      volumes:
        - name: wlm-bin
          configMap:
            name: triliovault-wlm-bin
            defaultMode: 0555
        {{- include "tvo.caBundleVolume" . | nindent 8 }}
