## IMPORTANT: replicas for wlm-cron is hardcoded to 1 and must never be scaled.
## Multiple wlm-cron instances cause duplicate scheduled job execution.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triliovault-wlm-cron
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tvo.labels" . | nindent 4 }}
    component: wlm-cron
spec:
  replicas: 1
  selector:
    matchLabels:
      application: triliovault
      component: wlm-cron
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        application: triliovault
        component: wlm-cron
    spec:
      serviceAccountName: triliovault-wlm
      {{- include "tvo.imagePullSecrets" . | nindent 6 }}
      nodeSelector:
        {{ .Values.labels.wlm_cron.node_selector_key }}: {{ .Values.labels.wlm_cron.node_selector_value }}
      securityContext:
        runAsUser: {{ .Values.common.nova_user_id }}
        fsGroup: {{ .Values.common.nova_group_id }}
      containers:
        - name: triliovault-wlm-cron
          image: {{ .Values.images.triliovault_wlm }}
          imagePullPolicy: {{ .Values.images.pull_policy }}
          command: ["/bin/bash", "-c", "workloadmgr-cron --config-file /etc/triliovault-wlm/triliovault-wlm.conf"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: wlm-etc
              mountPath: /etc/triliovault-wlm/triliovault-wlm.conf
              subPath: triliovault-wlm.conf
              readOnly: true
            - name: trilio-logs
              mountPath: /var/log/triliovault
      volumes:
        - name: wlm-etc
          secret:
            secretName: triliovault-wlm-etc
            defaultMode: 0444
        - name: trilio-logs
          emptyDir: {}
