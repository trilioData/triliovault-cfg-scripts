{{- if .Values.images.trilio_container_registry_login_enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: trilio-registry-secret
  namespace: {{ .Values.namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{%q:{"username":%q,"password":%q,"auth":%q}}}` .Values.images.registry_url .Values.images.registry_username .Values.images.registry_password (printf "%s:%s" .Values.images.registry_username .Values.images.registry_password | b64enc) | b64enc }}
{{- end }}
