# TrilioVault Control Plane Bundle for Sunbeam Canonical OpenStack
#
# Deploys trilio-wlm-k8s and trilio-dm-api-k8s into the "openstack" (k8s)
# model. trilio-wlm-k8s embeds its own co-located DMS (Dynamic Mount Service)
# server as a second container in the same pod (one DMS instance per WLM
# replica, 1:1) -- there is no separate trilio-dms-k8s application anymore.
# Run this bundle AFTER Sunbeam bootstrap completes and the openstack model is
# healthy.
#
# Usage:
#   ./deploy_trilio.py ctlplane
#
# This bundle declares TRILIO APPLICATIONS ONLY. Sunbeam's own applications
# (mysql, rabbitmq, keystone, traefik, traefik-public) are NOT declared here,
# and the relations to them are added afterwards by deploy_trilio.py.
#
# WHY (TVAULT-7644): a bundle is a DESIRED-STATE document. Naming an existing
# application in it -- even purely to reference it in a relation -- makes Juju
# reconcile that application to whatever revision/scale the bundle states. Those
# numbers are read off one cloud at one moment in time, so on any OTHER cloud
# the same file is an instruction to DOWNGRADE. That is exactly how this broke:
# microceph was pinned to 251 from the dev cloud and the QA cloud ran 296, so
# the deploy tried to roll Sunbeam's storage layer backwards.
#
# Pinning to the "currently deployed" values is not a fix either -- it just
# moves the breakage to the next cloud, or to the next time Sunbeam is upgraded.
# The only safe bundle is one that never mentions an application it does not own.

bundle: kubernetes

applications:

  trilio-wlm-k8s:
    charm: trilio-wlm-k8s
    channel: 6.2/candidate
    revision: 18
    scale: 3
    trust: true
    options:
      api-workers: 2
      debug: false
    resources:
      trilio-wlm-image: docker.io/trilio/trilio-wlm-canonical:6.2.1-2024.1

  trilio-dm-api-k8s:
    charm: trilio-dm-api-k8s
    channel: 6.2/candidate
    revision: 7
    scale: 3
    trust: true
    options:
      debug: false
      api-workers: 2
    resources:
      trilio-dm-api-image: docker.io/trilio/trilio-datamover-api-canonical:6.2.1-2024.1

relations:
  # Trilio-to-Trilio only. Both endpoints are owned by this bundle, so there is
  # no third-party application to reconcile. Everything else is in the script.
  - [trilio-dm-api-k8s:wlm-service, trilio-wlm-k8s:wlm-service]
