# ctlplane_inputs.yaml
#
# T4O Control Plane Configuration for Sunbeam (MicroK8s)
#
# Quick-start: fill manual_inputs.yaml (image tag + registry), then run bash prepare.sh.
# prepare.sh auto-fills image tags (from manual_inputs.yaml) and Keystone credentials
# (from the live cluster) into the [auto] fields below.
#
# Advanced customization: edit this file directly after prepare.sh fills it.
#
# Usage:
#   vi manual_inputs.yaml      # set trilio_image_tag and registry auth
#   bash prepare.sh            # installs tools, labels nodes, fills [auto] fields, deploys infra
#   bash deploy_ctlplane.sh    # deploys T4O control plane via Helm

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
namespace: "trilio-openstack"

# Number of Kubernetes nodes to label triliovault-control-plane=enabled.
# All T4O pods and infrastructure (MySQL, RabbitMQ) only schedule on labeled nodes.
# Minimum 3 for HA; 1 is sufficient for lab/dev environments.
node_count: 3

# Helm CLI version to install if not already present.
helm_version: "3.17.2"

# ---------------------------------------------------------------------------
# T4O Control Plane Images                              [auto from manual_inputs.yaml]
# prepare.sh populates these from manual_inputs.yaml trilio_image_tag.
# Format: docker.io/trilio/<component>-canonical:<version>-<openstack-release>
# Override here only if you need per-component image customization.
# ---------------------------------------------------------------------------
images:
  triliovault_wlm:           ""
  triliovault_datamover_api: ""
  triliovault_dms:           ""
  triliovault_horizon:       ""
  pull_policy: "IfNotPresent"

# ---------------------------------------------------------------------------
# Container Registry Authentication                    [auto from manual_inputs.yaml]
# prepare.sh populates these from manual_inputs.yaml registry settings.
# Override here only if ctlplane requires a different registry from dataplane.
# ---------------------------------------------------------------------------
registry:
  login_enabled: false
  url:      "docker.io"
  username: ""
  password: ""

# ---------------------------------------------------------------------------
# Keystone                                                           [auto]
# prepare.sh auto-populates these from the Sunbeam cluster.
# Override manually if auto-detection fails.
# ---------------------------------------------------------------------------
keystone:
  auth_url:       ""         # auto: from sunbeam openrc or keystone-keystone-admin secret
  admin_user:     "admin"
  admin_password: ""         # auto: from keystone-keystone-admin secret
  admin_project:  "admin"
  region_name:    "RegionOne"

# ---------------------------------------------------------------------------
# Passwords                                                        [auto]
# prepare.sh generates these once and writes them here.
# Do not change after infra is deployed — MySQL, RabbitMQ, and Keystone
# accounts are created with these values on first run.
# ---------------------------------------------------------------------------
passwords:
  mysql_root:     ""
  mysql_wlm:      ""
  mysql_dmapi:    ""
  rabbitmq_wlm:   ""
  rabbitmq_dmapi: ""
  keystone_wlm:   ""
  keystone_dmapi: ""
