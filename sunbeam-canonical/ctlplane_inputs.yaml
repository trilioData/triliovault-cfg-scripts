# ctlplane_inputs.yaml
#
# T4O Control Plane Configuration for Sunbeam (MicroK8s)
#
# Edit this file before running deploy_ctlplane.sh.
# Sections marked [auto] are populated by prepare.sh from the live cluster.
# Sections marked [manual] must be set by the user.
#
# Usage:
#   bash prepare.sh            # installs tools, labels nodes, auto-fills [auto] values
#   vi ctlplane_inputs.yaml    # review and fill any [manual] values
#   bash deploy_ctlplane.sh    # deploy infra + T4O control plane

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
namespace: "trilio-openstack"

# Number of Kubernetes nodes to label triliovault-control-plane=enabled.
# All T4O pods and infrastructure (MySQL, RabbitMQ) only schedule on labeled nodes.
# Minimum 3 for HA; 1 is sufficient for lab/dev environments.
node_count: 3

# Helm CLI version to install if not already present.
helm_version: "3.17.2"

# ---------------------------------------------------------------------------
# T4O Control Plane Images                                           [manual]
# Update these on every T4O release.
# Format: docker.io/trilio/<component>:<version>-stable-<os-release>
# ---------------------------------------------------------------------------
images:
  triliovault_wlm:           "docker.io/trilio/trilio-wlm:6.2.1-stable-caracal-ubuntu_jammy"
  triliovault_datamover_api: "docker.io/trilio/trilio-datamover-api:6.2.1-stable-caracal-ubuntu_jammy"
  triliovault_dms:           "docker.io/trilio/trilio-dms:6.2.1-stable-caracal-ubuntu_jammy"
  pull_policy: "IfNotPresent"

# ---------------------------------------------------------------------------
# Container Registry Authentication                                  [manual]
# Set login_enabled: true when pulling from a private / authenticated registry.
# Leave false for public docker.io images.
# ---------------------------------------------------------------------------
registry:
  login_enabled: false
  url:      "docker.io"
  username: ""
  password: ""

# ---------------------------------------------------------------------------
# Keystone                                                           [auto]
# prepare.sh auto-populates these from the Sunbeam cluster.
# Override manually if auto-detection fails.
# ---------------------------------------------------------------------------
keystone:
  auth_url:       ""         # auto: from sunbeam openrc or keystone-keystone-admin secret
  admin_user:     "admin"
  admin_password: ""         # auto: from keystone-keystone-admin secret
  admin_project:  "admin"
  region_name:    "RegionOne"

# ---------------------------------------------------------------------------
# MySQL InnoDB Cluster                                               [manual]
# Managed by MySQL Operator for Kubernetes (mysql/mysql-operator, GPL 2.0).
# CRD: InnoDBCluster
# ---------------------------------------------------------------------------
mysql:
  # Number of MySQL server instances. Minimum 3 for HA (tolerates 1 failure).
  instances: 3

  # MySQL server container image.
  # Leave empty to use the operator's default (latest validated version).
  image: ""

  # Number of MySQL Router instances (handles connection routing and failover).
  router_instances: 1
  router_image: ""           # empty = matches server image version

  storage:
    # Kubernetes StorageClass for each instance's data PVC.
    # Leave empty to use the cluster's default StorageClass.
    # MicroK8s: "microk8s-hostpath" | Ceph: "rook-ceph-block" | LVM: "local-storage"
    storage_class: ""
    storage_size: "10Gi"

  resources:
    requests:
      cpu:    "250m"
      memory: "512Mi"
    limits:
      cpu:    "1000m"
      memory: "2Gi"

# ---------------------------------------------------------------------------
# RabbitMQ Cluster                                                   [manual]
# Managed by RabbitMQ Cluster Operator (rabbitmq/cluster-operator, MPL 2.0).
# CRD: RabbitmqCluster
# ---------------------------------------------------------------------------
rabbitmq:
  # Number of RabbitMQ replicas. Minimum 3 for HA (tolerates 1 failure).
  replicas: 3

  # RabbitMQ container image.
  # Leave empty to use the operator's default (latest stable).
  # Quorum queues require RabbitMQ >= 3.13.
  image: ""

  storage:
    # Kubernetes StorageClass for each replica's message data PVC.
    storage_class: ""
    storage_size: "8Gi"

  resources:
    requests:
      cpu:    "100m"
      memory: "256Mi"
    limits:
      cpu:    "500m"
      memory: "1Gi"

  quorum_queues:
    # Enable only when using RabbitMQ >= 3.13.
    # When true, also set rabbit_quorum_queue: true in dataplane_inputs.yaml.
    enabled: false

  # Extra rabbitmq.conf lines appended to the cluster configuration.
  # Example: "vm_memory_high_watermark.relative = 0.6\nchannel_max = 2048"
  additional_config: ""
