# TrilioVault Data Plane Bundle — clouds WITHOUT a microceph Juju application
#
# Use this instead of trilio-dataplane-bundle.yaml in either of these cases:
#
#   1. The cloud uses no Ceph at all — Cinder is LVM/iSCSI or a vendor driver,
#      and Nova ephemeral is on local disk. Nothing further to configure: the
#      charm renders triliovault-datamover.conf with no [ceph] stanzas, which
#      is the correct outcome, not a degraded one.
#
#   2. The cloud uses Ceph, but the cluster lives OUTSIDE Sunbeam — deployed by
#      cephadm, Rook, or another third-party tool. There is no microceph/
#      ceph-mon application to relate to, so no broker can mint a key for us,
#      and the charm holds no admin credential for a cluster it does not
#      manage. YOU pre-create the Ceph client and hand the charm its name and
#      keyring; see the ceph-* options below.
#
# The only difference from trilio-dataplane-bundle.yaml is the absence of the
# microceph reference entry and the trilio-data-mover:ceph relation. Deploying
# the standard bundle on a cloud with no microceph application fails, because
# Juju cannot resolve that relation endpoint.
#
# Usage:
#   juju switch openstack-machines
#   juju deploy ./trilio-dataplane-bundle-no-microceph.yaml
#
# Cross-model SAAS offers are declared in the saas: section below.
# Find the correct offer URLs for your deployment with:
#   juju find-offers --format=tabular
# Update the saas: urls to match your controller name (default: sunbeam-controller).

saas:
  rabbitmq:
    url: sunbeam-controller:controller0/openstack.rabbitmq
  keystone-credentials:
    url: sunbeam-controller:controller0/openstack.keystone-credentials
  cert-distributor:
    url: sunbeam-controller:controller0/openstack.cert-distributor

applications:

  # Reference entry for the existing principal — not redeployed by this bundle.
  # Juju requires all relation endpoints to be declared even for pre-existing apps.
  #
  # CAUTION (TVAULT-7404 incident, 2026-07-24): omitting revision/scale on
  # reference entries for pre-existing apps once caused Juju to force-scale
  # and force-upgrade unrelated core apps during a ctlplane bundle deploy,
  # triggering a near-total control-plane outage. Always keep revision: and
  # scale: pinned to the CURRENTLY DEPLOYED values (check with `juju status`
  # before touching this file) — never leave them implicit.
  #
  # >>> SET THESE FROM YOUR OWN CLOUD BEFORE DEPLOYING. <<<
  # The values below are placeholders from one lab. This bundle is written for
  # other people's clouds, which by definition differ — deploying with a
  # revision or scale that does not match what is actually running is exactly
  # what triggered the 2026-07-24 outage. Check first:
  #     juju status openstack-hypervisor
  openstack-hypervisor:
    charm: openstack-hypervisor
    channel: 2024.1/stable
    revision: 438      # <-- REPLACE with your deployed revision
    scale: 2           # <-- REPLACE with your compute node count

  # NOTE: no microceph reference entry here — that is the point of this bundle.

  trilio-data-mover:
    charm: trilio-data-mover-sunbeam
    channel: 6.2/candidate
    # Deliberately NOT pinned to revision 13: the ceph-* options below were
    # added after it, so pinning 13 makes `juju deploy` fail on an unknown
    # config option for the very case this bundle exists to serve. Track the
    # channel, or pin to the first revision published with external-Ceph
    # support once it is released.
    #
    # (The pin-the-revision caution above applies to REFERENCE entries for
    # pre-existing applications, not to the app this bundle actually deploys.)
    options:
      triliovault-pkg-source: "deb [trusted=yes] https://apt.fury.io/trilio-maint-6-2 /"
      trilio-version: ""     # Leave empty for latest; or pin to e.g. "6.2.1"
      debug: false

      # --- Ceph ------------------------------------------------------------
      # Ceph as storage used for Cinder or Nova.
      #
      # CASE 1 — no Ceph anywhere. Set false and stop; nothing else applies.
      # CASE 2 — external Ceph cluster. Leave true and set the options below.
      ceph_enabled: true

      # The Ceph cluster is Sunbeam's own microceph, reached over the ceph
      # relation. Considered ONLY when ceph_enabled is true.
      #
      # false here means an EXTERNAL cluster, which is why this bundle has no
      # microceph relation to offer.
      internal_ceph_enabled: false

      # Ceph client contego authenticates as. YOU must create it on the
      # external cluster with read/write/execute on the Cinder and Nova RBD
      # pools — the charm cannot, having no admin credential for a cluster it
      # does not manage:
      #
      #   ceph auth get-or-create client.trilio-data-mover \
      #     mon 'profile rbd' \
      #     osd 'profile rbd pool=cinder-volumes, profile rbd pool=nova' \
      #     -o ceph.client.trilio-data-mover.keyring
      #
      # The default below matches the name the relation path uses, so the same
      # name works in both modes. Change it only to reuse an existing client.
      trilio_ceph_username: "trilio-data-mover"

      # ceph_conf and ceph_keyring are WRITE-IF-ABSENT: neither
      # /etc/ceph/ceph.conf nor the keyring is ever overwritten. On Sunbeam a
      # compute node usually has neither — Nova reaches Ceph via Cinder's
      # per-volume connection_info, not /etc/ceph — so these values are
      # normally what provides them. A file another tool did place is reused
      # untouched and the value ignored.
      #
      # >>> DO NOT PASTE A REAL KEYRING INTO THIS FILE. <<<
      # Juju config is not secret storage: the value lives in the controller
      # database, is printed by `juju config trilio-data-mover`, and is emitted
      # by `juju export-bundle`. Committing a cephx key here leaks it into git.
      # Set both from files at deploy time instead:
      #
      #   juju config trilio-data-mover \
      #     ceph_conf="$(cat /etc/ceph/ceph.conf)" \
      #     ceph_keyring="$(cat ./ceph.client.trilio-data-mover.keyring)"

relations:
  # Subordinate binding to the compute principal
  - [trilio-data-mover:juju-info, openstack-hypervisor:juju-info]
  # Cross-model relations via saas: aliases above
  - [trilio-data-mover:amqp, rabbitmq:amqp]
  - [trilio-data-mover:identity-credentials, keystone-credentials:identity-credentials]
  # Without this, tvault-contego's ca-bundle.pem never gets written by
  # _write_ca_cert() (it early-returns when no cert is available), leaving a
  # stale/incorrectly-owned file in place — SSL verification against Keystone
  # then fails with a permission error.
  - [trilio-data-mover:receive-ca-cert, cert-distributor:send-ca-cert]
  # NOTE: no trilio-data-mover:ceph relation — there is no microceph app to
  # relate to. Ceph access, if any, comes from the ceph-* config above.
