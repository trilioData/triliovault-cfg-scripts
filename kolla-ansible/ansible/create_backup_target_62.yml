---
# create_backup_target_62.yml
#
# Creates the T4O 6.2 backup target after upgrading from T4O 5.2.
# Run this after:
#   1. kolla-ansible upgrade --tags triliovault
#   2. ansible-playbook cleanup_backup_targets.yml
#
# Reads backup target config from existing_backup_targets.yaml produced by
# collect_backup_targets.sh (run BEFORE the upgrade).
#
# workloadmgr and trilio-dms-cli execute inside the triliovault_wlm_api
# container on the controller node — these tools ship inside the container
# image and are not available on the host.
#
# Usage:
#   ansible-playbook -i triliovault_inventory.txt create_backup_target_62.yml \
#     [-e backup_target_name=my-bt] \
#     [-e backup_target_openrc=/etc/kolla/admin-openrc.sh] \
#     [-e backup_target_collected_file=existing_backup_targets.yaml] \
#     [--tags create-backup-target-62]
#
# For S3 targets, export the S3 secret key before running:
#   export TRILIOVAULT_S3_SECRET_KEY=<key>
# Or pass it as an extra variable:
#   -e triliovault_s3_secret_key=<key>

- name: Create T4O 6.2 backup target
  hosts: "{{ (groups[triliovault_wlm_api_group | default('triliovault-wlm-api')] | first) }}"
  gather_facts: false
  tags:
    - create-backup-target-62
  vars:
    wlm_container: "triliovault_wlm_api"
    bt_name: "{{ backup_target_name | default('default-backup-target') }}"
    openrc_file: "{{ backup_target_openrc | default('/etc/kolla/admin-openrc.sh') }}"
    collected_file: "{{ backup_target_collected_file | default('existing_backup_targets.yaml') }}"
    container_openrc_path: "/tmp/triliovault-cloudrc-bt-$$"

  tasks:

    # -----------------------------------------------------------------------
    # Load collected backup target config from the Ansible host
    # -----------------------------------------------------------------------
    - name: Load backup target config from collected YAML
      include_vars:
        file: "{{ collected_file }}"
        name: bt_data
      delegate_to: localhost

    - name: Show backup target type
      debug:
        msg: "Backup target type: {{ bt_data.backup_target.type }}"

    # -----------------------------------------------------------------------
    # Detect container runtime (docker or podman)
    # -----------------------------------------------------------------------
    - name: Detect container runtime with running WLM container
      shell: |
        for rt in docker podman; do
          if command -v "$rt" >/dev/null 2>&1 && \
             "$rt" ps --format '{{ "{{" }}.Names{{ "}}" }}' 2>/dev/null | \
             grep -q "^{{ wlm_container }}$"; then
            echo "$rt"
            exit 0
          fi
        done
        echo "none"
      register: container_runtime_result
      changed_when: false
      become: true

    - name: Fail if WLM container not found
      fail:
        msg: >
          Container '{{ wlm_container }}' not found via docker or podman.
          Ensure T4O 6.2 is deployed and all containers are running.
      when: container_runtime_result.stdout | trim == "none"

    - name: Set container runtime fact
      set_fact:
        container_runtime: "{{ container_runtime_result.stdout | trim }}"

    - name: Show detected container runtime
      debug:
        msg: "Container runtime: {{ container_runtime }}"

    # -----------------------------------------------------------------------
    # Copy OpenRC into the container so openstack CLI can authenticate
    # (needed for S3 backup targets only)
    # -----------------------------------------------------------------------
    - name: Copy OpenRC file into WLM container
      shell: >
        {{ container_runtime }} cp {{ openrc_file }} {{ wlm_container }}:{{ container_openrc_path }}
      become: true
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    # -----------------------------------------------------------------------
    # NFS backup target — create directly via workloadmgr inside container
    # -----------------------------------------------------------------------
    - name: Create NFS backup target
      shell: >
        {{ container_runtime }} exec {{ wlm_container }}
        workloadmgr backup-target-create
        --name "{{ bt_name }}"
        --type nfs
        --nfs-shares "{{ bt_data.backup_target.nfs_shares }}"
        --nfs-options "{{ bt_data.backup_target.nfs_options | default('nolock,soft,timeo=180,intr,lookupcache=none') }}"
        --is-default true
      become: true
      register: nfs_bt_result
      when: bt_data.backup_target.type | lower == 'nfs'

    - name: Show NFS backup target creation output
      debug:
        var: nfs_bt_result.stdout_lines
      when: bt_data.backup_target.type | lower == 'nfs'

    # -----------------------------------------------------------------------
    # S3 backup target
    # -----------------------------------------------------------------------
    - name: Set S3 secret key fact
      set_fact:
        s3_secret_key: >-
          {{
            triliovault_s3_secret_key
            if triliovault_s3_secret_key is defined and triliovault_s3_secret_key != ''
            else lookup('env', 'TRILIOVAULT_S3_SECRET_KEY')
          }}
      no_log: true
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    - name: Fail if S3 secret key not provided
      fail:
        msg: >
          S3 secret key is required. Either export TRILIOVAULT_S3_SECRET_KEY
          or pass -e triliovault_s3_secret_key=<key>.
      when:
        - bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']
        - s3_secret_key | default('') == ''

    - name: Create DMS secret payload inside WLM container
      shell: |
        {{ container_runtime }} exec {{ wlm_container }} bash -c '
          trilio-dms-cli secret-payload create \
            --access-key "{{ bt_data.backup_target.s3_access_key }}" \
            --secret-key "{{ s3_secret_key }}" \
            --bucket "{{ bt_data.backup_target.s3_bucket }}" \
            {% if bt_data.backup_target.s3_endpoint | default("") %}
            --endpoint-url "{{ bt_data.backup_target.s3_endpoint }}" \
            {% endif %}
            -o /tmp/trilio_secret_payload.json \
          && cat /tmp/trilio_secret_payload.json
        '
      become: true
      register: dms_payload_result
      no_log: true
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    - name: Resolve Barbican public endpoint inside WLM container
      shell: |
        {{ container_runtime }} exec {{ wlm_container }} bash -c '
          source {{ container_openrc_path }}
          OS_INTERFACE=public openstack endpoint list \
            --service key-manager --interface public -f json 2>/dev/null | \
          python3 -c "
        import json, sys
        eps = json.load(sys.stdin)
        if not eps: sys.exit(1)
        url = eps[0][\"URL\"].rstrip(\"/\")
        if url.endswith(\"/v1\"):
            url = url[:-3]
        print(url)
        "
        '
      become: true
      register: barbican_endpoint_result
      changed_when: false
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    - name: Fail if Barbican endpoint not found
      fail:
        msg: "Could not resolve Barbican public endpoint from keystone catalog."
      when:
        - bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']
        - barbican_endpoint_result.stdout | trim == ''

    - name: Store S3 credentials in Barbican inside WLM container
      shell: |
        {{ container_runtime }} exec {{ wlm_container }} bash -c '
          source {{ container_openrc_path }}
          openstack secret store \
            --name "secret-key-{{ bt_name | replace(" ", "-") }}" \
            --payload "$(cat /tmp/trilio_secret_payload.json)" \
            -f json
        '
      become: true
      register: barbican_store_result
      no_log: true
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    - name: Build normalised Barbican secret href
      set_fact:
        secret_href: >-
          {{
            barbican_endpoint_result.stdout | trim
          }}/v1/secrets/{{
            (barbican_store_result.stdout | from_json).get('Secret href', '')
            | regex_search('[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          }}
      no_log: true
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    - name: Create S3 backup target via workloadmgr inside WLM container
      shell: >
        {{ container_runtime }} exec {{ wlm_container }}
        workloadmgr backup-target-create
        --name "{{ bt_name }}"
        --type "{{ bt_data.backup_target.type }}"
        --secret-ref "{{ secret_href }}"
        --is-default true
      become: true
      register: s3_bt_result
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    - name: Show S3 backup target creation output
      debug:
        var: s3_bt_result.stdout_lines
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    # -----------------------------------------------------------------------
    # Clean up temp files in container
    # -----------------------------------------------------------------------
    - name: Remove temp files from WLM container
      shell: >
        {{ container_runtime }} exec {{ wlm_container }}
        rm -f {{ container_openrc_path }} /tmp/trilio_secret_payload.json
      become: true
      ignore_errors: true
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    # -----------------------------------------------------------------------
    # Verify
    # -----------------------------------------------------------------------
    - name: Verify backup target list
      shell: >
        {{ container_runtime }} exec {{ wlm_container }}
        workloadmgr backup-target-list
      become: true
      register: bt_list_result
      changed_when: false

    - name: Show backup target list
      debug:
        var: bt_list_result.stdout_lines
