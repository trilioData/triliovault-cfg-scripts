---
# create_backup_target_62.yml
#
# Creates the T4O 6.2 backup target after upgrading from T4O 5.2.
# Run this after:
#   1. kolla-ansible upgrade --tags triliovault
#   2. ansible-playbook cleanup_backup_targets.yml
#
# Reads backup target config from existing_backup_targets.yaml produced by
# collect_backup_targets.sh (run BEFORE the upgrade).
#
# For NFS targets, workloadmgr is called directly with the updated argument
# names introduced in T4O 6.2.
#
# For S3 targets, credentials are stored in OpenStack Barbican using
# trilio-dms-cli before the backup target is created. trilio-dms-cli and
# openstack CLI run inside the triliovault_wlm_api container via docker exec.
# The Barbican secret href is normalised to the public endpoint before being
# passed to workloadmgr.
#
# Usage:
#   ansible-playbook -i <INVENTORY> create_backup_target_62.yml

- name: Create T4O 6.2 backup target
  hosts: "{{ (groups[triliovault_wlm_api_group | default('triliovault-wlm-api')] | first) }}"
  gather_facts: false
  vars:
    wlm_container: "triliovault_wlm_api"
    cloudrc: "/etc/kolla/triliovault-cloudrc"
    collected_file: "{{ backup_target_collected_file | default('existing_backup_targets.yaml') }}"

  tasks:

    - name: Load backup target config from collected YAML
      include_vars:
        file: "{{ collected_file }}"
        name: bt_data
      delegate_to: localhost

    - name: Set backup target name
      set_fact:
        bt_name: "{{ 'nfs' if bt_data.backup_target.type | lower == 'nfs' else 's3' }}-backup-target-1"

    # -----------------------------------------------------------------------
    # NFS backup target
    # -----------------------------------------------------------------------
    - name: Create NFS backup target
      shell: |
        set -a; source {{ cloudrc }}; set +a
        docker exec \
          -e OS_AUTH_URL -e OS_USERNAME -e OS_PASSWORD \
          -e OS_PROJECT_NAME -e OS_PROJECT_ID \
          -e OS_USER_DOMAIN_NAME -e OS_PROJECT_DOMAIN_ID \
          -e OS_IDENTITY_API_VERSION -e OS_REGION_NAME -e OS_INTERFACE -e OS_CACERT \
          {{ wlm_container }} \
          workloadmgr backup-target-create \
            --btt-name "{{ bt_name }}" \
            --type nfs \
            --filesystem-export "{{ bt_data.backup_target.nfs_shares }}" \
            --nfs-mount-opts "{{ bt_data.backup_target.nfs_options | default('nolock,soft,timeo=180,intr,lookupcache=none') }}" \
            --default
      become: true
      when: bt_data.backup_target.type | lower == 'nfs'

    # -----------------------------------------------------------------------
    # S3 backup target — credentials are stored in Barbican before creation.
    #
    # Flow:
    #   1. If a custom SSL cert is configured (triliovault_copy_ceph_s3_ssl_cert),
    #      copy it from the Ansible control node's
    #      /etc/kolla/config/triliovault/ (per the T4O install docs, this is
    #      where the operator places it — s3_ssl_cert_file_name is a bare
    #      filename, not a path) onto the wlm-api host.
    #   2. trilio-dms-cli creates an encrypted secret payload in the container
    #   3. openstack secret store saves it to Barbican (inside container)
    #   4. openstack endpoint list resolves the public Barbican URL
    #   5. Secret href is normalised to the public endpoint
    #   6. workloadmgr backup-target-create uses --secret-ref
    # -----------------------------------------------------------------------
    - name: Copy S3 SSL certificate to wlm-api host
      copy:
        src: "/etc/kolla/config/triliovault/{{ bt_data.backup_target.s3_ssl_cert_file_name }}"
        dest: "/tmp/{{ bt_data.backup_target.s3_ssl_cert_file_name }}"
        mode: "0644"
      become: true
      when:
        - bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']
        - bt_data.backup_target.copy_ceph_s3_ssl_cert | default(false) | bool

    - name: Create S3 secret payload via trilio-dms-cli
      shell: |
        set -a; source {{ cloudrc }}; set +a
        ENDPOINT_FLAG=""
        SSL_FLAG="--ssl"
        FILESYSTEM_EXP="{{ bt_data.backup_target.s3_endpoint | urlsplit('hostname') }}/{{ bt_data.backup_target.s3_bucket }}"
        if [ -n "{{ bt_data.backup_target.s3_endpoint | default('') }}" ]; then
          ENDPOINT_FLAG="--endpoint-url {{ bt_data.backup_target.s3_endpoint }}"
        fi
        if [ "{{ bt_data.backup_target.s3_ssl_enabled | lower }}" == "false" ]; then
          SSL_FLAG="--no-ssl "
        fi
        if [ "{{ bt_data.backup_target.s3_ssl_verify | lower }}" == "true" ]; then
          if [ "{{ bt_data.backup_target.copy_ceph_s3_ssl_cert | default(false) | lower }}" == "true" ]; then
            docker cp /tmp/{{ bt_data.backup_target.s3_ssl_cert_file_name }} {{ wlm_container }}:/tmp/s3-cert.pem
            SSL_VERIFY_FLAG="--ssl-verify --ssl-cert /tmp/s3-cert.pem "
          else
            SSL_VERIFY_FLAG="--ssl-verify "
          fi
        else
          SSL_VERIFY_FLAG="--no-ssl-verify"
        fi

        docker exec \
          {{ wlm_container }} \
          trilio-dms-cli secret-payload create \
            --access-key "{{ bt_data.backup_target.s3_access_key }}" \
            --secret-key "{{ bt_data.backup_target.s3_secret_key }}" \
            --bucket "{{ bt_data.backup_target.s3_bucket }}" \
            $SSL_FLAG \
            $SSL_VERIFY_FLAG \
            $ENDPOINT_FLAG \
            --filesystem-export $FILESYSTEM_EXP \
            -o /tmp/bt_secret.json
        docker cp {{ wlm_container }}:/tmp/bt_secret.json /tmp/triliovault_bt_secret.json
        docker exec {{ wlm_container }} rm -f /tmp/bt_secret.json
      become: true
      no_log: true
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    - name: Remove S3 SSL certificate temp copy from wlm-api host
      file:
        path: "/tmp/{{ bt_data.backup_target.s3_ssl_cert_file_name }}"
        state: absent
      become: true
      when:
        - bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']
        - bt_data.backup_target.copy_ceph_s3_ssl_cert | default(false) | bool

    - name: Store S3 credentials in Barbican
      shell: |
        set -a; source {{ cloudrc }}; set +a
        docker exec \
          -e OS_AUTH_URL -e OS_USERNAME -e OS_PASSWORD \
          -e OS_PROJECT_NAME -e OS_PROJECT_ID \
          -e OS_USER_DOMAIN_NAME -e OS_PROJECT_DOMAIN_ID \
          -e OS_IDENTITY_API_VERSION -e OS_REGION_NAME -e OS_INTERFACE -e OS_CACERT \
          {{ wlm_container }} \
          openstack secret store \
            --name "secret-key-{{ bt_name }}" \
            --payload "$(cat /tmp/triliovault_bt_secret.json)" \
            -f json
        rm -f /tmp/triliovault_bt_secret.json
      become: true
      no_log: true
      register: barbican_secret_result
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    - name: Create S3 backup target
      shell: |
        set -a; source {{ cloudrc }}; set +a
        ENDPOINT_FLAG=""
        if [ -n "{{ bt_data.backup_target.s3_endpoint | default('') }}" ]; then
          ENDPOINT_FLAG="--s3-endpoint-url {{ bt_data.backup_target.s3_endpoint }}"
        fi
        docker exec \
          -e OS_AUTH_URL -e OS_USERNAME -e OS_PASSWORD \
          -e OS_PROJECT_NAME -e OS_PROJECT_ID \
          -e OS_USER_DOMAIN_NAME -e OS_PROJECT_DOMAIN_ID \
          -e OS_IDENTITY_API_VERSION -e OS_REGION_NAME -e OS_INTERFACE -e OS_CACERT \
          {{ wlm_container }} \
          workloadmgr backup-target-create \
            --btt-name "{{ bt_name }}" \
            --type s3 \
            --s3-bucket "{{ bt_data.backup_target.s3_bucket }}" \
            $ENDPOINT_FLAG \
            --secret-ref "{{ (barbican_secret_result.stdout | from_json)['Secret href'] }}" \
            --default
      become: true
      no_log: true
      when: bt_data.backup_target.type | lower in ['amazon_s3', 'other_s3_compatible']

    # -----------------------------------------------------------------------
    # Verify
    # -----------------------------------------------------------------------
    - name: Verify backup target list
      shell: |
        set -a; source {{ cloudrc }}; set +a
        docker exec \
          -e OS_AUTH_URL -e OS_USERNAME -e OS_PASSWORD \
          -e OS_PROJECT_NAME -e OS_PROJECT_ID \
          -e OS_USER_DOMAIN_NAME -e OS_PROJECT_DOMAIN_ID \
          -e OS_IDENTITY_API_VERSION -e OS_REGION_NAME -e OS_INTERFACE -e OS_CACERT \
          {{ wlm_container }} \
          workloadmgr backup-target-list
      become: true
      register: bt_list_result
      changed_when: false

    - name: Show backup target list
      debug:
        var: bt_list_result.stdout_lines


