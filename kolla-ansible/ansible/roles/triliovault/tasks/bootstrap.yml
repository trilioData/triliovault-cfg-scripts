---

- name: Create database for triliovault services for zed and next releases
  become: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: mysql_db
    module_args:
      login_host: "{{ database_address }}"
      login_port: "{{ database_port }}"
      login_user: "{{ triliovault_database_shard_root_user }}"
      login_password: "{{ database_password }}"
      name: "{{ item.database_name }}"
  run_once: True
  delegate_to: "{{ groups[item.group_name][0] }}"
  with_items:
     - "{{ triliovault_db_details }}"
  when:
    - not use_preconfigured_databases | bool

- name: Create triliovault database users and set permissions for zed and next releases
  become: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: mysql_user
    module_args:
      login_host: "{{ database_address }}"
      login_port: "{{ database_port }}"
      login_user: "{{ triliovault_database_shard_root_user }}"
      login_password: "{{ database_password }}"
      name: "{{ item.database_user }}"
      password: "{{ item.database_password }}"
      host: "%"
      priv: "{{ item.database_name }}.*:ALL"
      append_privs: "yes"
  run_once: True
  delegate_to: "{{ groups[item.group_name][0]  }}"
  with_items:
     - "{{ triliovault_db_details }}"
  when:
    - not use_preconfigured_databases | bool

- name: Register triliovault users in ProxySQL mysql_users
  become: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: community.mysql.mysql_query
    module_args:
      login_host: "{{ hostvars[groups['proxysql'][0]]['ansible_' + api_interface]['ipv4']['address'] }}"
      login_port: "{{ proxysql_admin_port | default(6032) }}"
      login_user: "admin"
      login_password: "{{ proxysql_admin_password }}"
      query:
        - "DELETE FROM mysql_users WHERE username='{{ item.database_user }}'"
        - "INSERT INTO mysql_users (username, password, default_hostgroup, max_connections) VALUES ('{{ item.database_user }}', '{{ item.database_password }}', {{ triliovault_database_shard_id | default(0) }}, 200)"
  with_items: "{{ triliovault_db_details }}"
  run_once: True
  delegate_to: "{{ groups[item.group_name][0] }}"
  when:
    - enable_proxysql | default(false) | bool
    - not use_preconfigured_databases | bool
    - openstack_release not in ['zed', '2023.1', '2023.2', '2024.1']

- name: Load and save triliovault ProxySQL users to runtime
  become: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: community.mysql.mysql_query
    module_args:
      login_host: "{{ hostvars[groups['proxysql'][0]]['ansible_' + api_interface]['ipv4']['address'] }}"
      login_port: "{{ proxysql_admin_port | default(6032) }}"
      login_user: "admin"
      login_password: "{{ proxysql_admin_password }}"
      query:
        - "LOAD MYSQL USERS TO RUNTIME"
        - "SAVE MYSQL USERS TO DISK"
  run_once: True
  delegate_to: "{{ groups['triliovault-datamover-api'][0] }}"
  when:
    - enable_proxysql | default(false) | bool
    - not use_preconfigured_databases | bool
    - openstack_release not in ['zed', '2023.1', '2023.2', '2024.1']

- import_tasks: rabbitmq.yml

- include_tasks: bootstrap_service.yml
