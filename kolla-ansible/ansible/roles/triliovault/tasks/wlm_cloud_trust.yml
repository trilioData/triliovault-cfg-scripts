---

- name: Create Cloud Admin Trust
  hosts: triliovault-wlm-api
  become: true
  gather_facts: false
  vars:
    # This is a standalone play, so the triliovault role defaults are not in scope - the
    # variables below come from /etc/kolla/globals.yml. globals.yml also defines
    # triliovault_docker_image_prefix and, being extra-vars, overrides this fallback; the
    # fallback only covers a globals.yml that predates TVAULT-7702.
    triliovault_docker_image_prefix: >-
      {{ '' if (kolla_container_engine | default('docker')) == 'docker'
      and (triliovault_docker_registry | default('docker.io')) in ['', 'docker.io', 'index.docker.io']
      else ((triliovault_docker_registry ~ '/') if triliovault_docker_registry else '') }}
  tasks:
    - name: Create Cloud Admin Trust
      become: true
      docker_container:
        name: wlm_cloud_trust
        image: "{{ triliovault_docker_image_prefix }}trilio/kolla-{{ kolla_base_distro }}-trilio-wlm:{{ triliovault_tag }}"
        command: 
          - /bin/bash
          - -c
          - /opt/create_cloud_trust.sh
        state: started
        detach: no
        interactive: yes
        network_mode: host
        tty: yes
        volumes:
          - /etc/kolla/triliovault-wlm-api/triliovault-wlm-api.conf:/etc/triliovault-wlm/triliovault-wlm.conf:ro
          - /etc/kolla/triliovault-wlm-api/api-paste.ini:/etc/triliovault-wlm/api-paste.ini:ro
          - /etc/kolla/triliovault-cloudrc:/opt/triliovault-cloudrc:rw
          - /etc/kolla/triliovault-wlm-api/create_cloud_trust.sh:/opt/create_cloud_trust.sh:rw
      tags: wlm_cloud_trust
      run_once: true
