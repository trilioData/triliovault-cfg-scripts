---
# Each container has two handler entries sharing the same listen topic.
# Only the one matching triliovault_kolla_module fires; the other is skipped by its when condition.
# This lets a single role support both kolla_docker (Zed/Antelope) and
# kolla_container (Bobcat / Caracal / Dalmatian / Epoxy / Flamingo).

- name: Restart triliovault-datamover-api container (kolla_docker)
  vars:
    service_name: "triliovault-datamover-api"
    service: "{{ triliovault_services[service_name] }}"
  become: true
  kolla_docker:
    action: "recreate_or_restart_container"
    common_options: "{{ docker_common_options }}"
    name: "{{ service.container_name }}"
    image: "{{ service.image }}"
    privileged: "{{ service.privileged | default(False) }}"
    volumes: "{{ service.volumes|reject('equalto', '')|list }}"
    dimensions: "{{ service.dimensions }}"
    auth_username: "{{ triliovault_docker_username }}"
    auth_password: "{{ triliovault_docker_password }}"
    auth_registry: "{{ triliovault_docker_registry }}"
  listen: "Restart triliovault-datamover-api container"
  when:
    - kolla_action != "config"
    - triliovault_kolla_module == 'kolla_docker'

