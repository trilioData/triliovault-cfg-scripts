[DEFAULT]
log_config_append = /etc/triliovault-wlm/wlm_logging.conf
use_syslog = False
use_stderr = False
{% set backup_target_names = [] %}
{% for target in backup_targets %}
    {% set _ = backup_target_names.append(target.get('backup-target-name')) %}
{% endfor %}
{% set backup_target_names_string = backup_target_names | join(',') %}
enabled_backends = {{ backup_target_names_string }}
triliovault_hostnames = {{ options.triliovault_hostnames }}

api_workers = {{ options.workers }}
workloads_workers = {{ options.workers }}
max_wait_for_upload = {{ options.max_wait_for_upload }}
helper_command = sudo /usr/bin/workloadmgr-rootwrap /etc/triliovault-wlm/rootwrap.conf privsep-helper
config_status = configured
taskflow_max_cache_size = 1024
transport_url = {{ options.transport_url }}
rabbit_virtual_host = {{ options.vhost }}

sql_connection = {{ options.sql_connection }}

compute_driver = libvirt.LibvirtDriver
state_path = /var/lib/workloadmgr
rootwrap_config = /etc/triliovault-wlm/rootwrap.conf
api_paste_config = /etc/triliovault-wlm/api-paste.ini

{% if ext -%}
osapi_workloads_listen_port = {{ ext }}
{% elif options.bind_port -%}
osapi_workloads_listen_port = {{ options.bind_port }}
{% else -%}
osapi_workloads_listen_port = 8770
{% endif -%}

verbose = {{ options.verbose }}
debug = {{ options.debug }}

glance_production_host = {{ identity_service.get('glance_url') }}
glance_production_api_servers = {{ identity_service.get('glance_url') }}
cinder_production_endpoint_template = {{ identity_service.get('cinder_url') }}
nova_production_endpoint_template = {{ identity_service.get('nova_url') }}
neutron_production_url = {{ identity_service.get('neutron_url') }}

trustee_role = {{ options.trustee_role }}

global_job_scheduler_override = False

region_name_for_services = {{ options.region }}

{% if identity_service.get('auth_host') -%}

nova_admin_auth_url = {{ identity_service.get('auth_protocol') }}://{{ identity_service.get('auth_host') }}:{{ identity_service.get('auth_port') }}/v{{ identity_service.get('api_version') }}
neutron_admin_auth_url = {{ identity_service.get('auth_protocol') }}://{{ identity_service.get('auth_host') }}:{{ identity_service.get('auth_port') }}/v{{ identity_service.get('api_version') }}
keystone_endpoint_url = {{ identity_service.get('auth_protocol') }}://{{ identity_service.get('auth_host') }}:{{ identity_service.get('auth_port') }}/v{{ identity_service.get('api_version') }}

{% if identity_service.get('service_domain') -%}
domain_name = {{ identity_service.get('service_domain_id') }}
triliovault_user_domain_id = {{ identity_service.get('service_domain_id') }}
{% endif -%}

{% endif -%}

cloud_unique_id = {{ identity_service.get('admin_user_id') }}
cloud_admin_user_id = {{ identity_service.get('admin_user_id') }}
cloud_admin_domain = {{ identity_service.get('admin_domain_id') }}
cloud_admin_project_id  = {{ identity_service.get('admin_project_id') }}
cloud_admin_role = Admin

keystone_auth_version = {{ identity_service.get('api_version') }}
glance_api_version = 2

vault_data_directory = /var/triliovault-mounts
vault_data_directory_old = /var/triliovault
vault_storage_das_device = none
barbican_api_class = workloadmgr.keymanager.barbican.API
progress_tracking_update_interval = {{ options.progress_tracking_update_interval }}
fail_on_qga_freeze_failure = {{ options.fail_on_qga_freeze_failure }}



{% for target in backup_targets %}
[{{ target.get('backup-target-name') }}]
{% if target.get('backup-target-type') == 's3' %}
vault_storage_type = s3
vault_s3_endpoint_url = {{ target.get('s3-endpoint-url') }}
vault_s3_bucket = {{ target.get('s3-bucket') }}
{% if target.get('s3-bucket-object-lock-enabled') %}
immutable = 1
{% else %}
immutable = 0
{% endif %}
vault_storage_filesystem_export = {{ target.get('vault-storage-nfs-export') }}
{% else %}
vault_storage_type = nfs
vault_storage_filesystem_export = {{ target.get('nfs-shares') }}
vault_storage_nfs_options = {{ target.get('nfs-options') }}
{% endif %}
{% if target.get('is-default') %}
is_default = 1
{% else %}
is_default = 0
{% endif %}
{% endfor %}


{% if identity_service.get('auth_host') -%}
# NOTE(jamespage): Trilio needs versioned endpoints in the keystone_authtoken section
# as well as a load of other deprecated/legacy configuration options
[keystone_authtoken]
auth_uri = {{ identity_service.get('service_protocol') }}://{{ identity_service.get('service_host') }}:{{ identity_service.get('service_port') }}/v{{ identity_service.get('api_version') }}
auth_url = {{ identity_service.get('auth_protocol') }}://{{ identity_service.get('auth_host') }}:{{ identity_service.get('auth_port') }}/v{{ identity_service.get('api_version') }}
www_authenticate_uri = {{ identity_service.get('auth_protocol') }}://{{ identity_service.get('auth_host') }}:{{ identity_service.get('auth_port') }}/v{{ identity_service.get('api_version') }}
auth_type = password
{% if identity_service.get('service_domain') -%}
project_domain_name = {{ identity_service.get('service_domain') }}
user_domain_name = {{ identity_service.get('service_domain') }}
project_domain_id = {{ identity_service.get('service_domain_id') }}
user_domain_id = {{ identity_service.get('service_domain_id') }}
{% else %}
project_domain_name = default
user_domain_name = default
{% endif -%}
project_name = services
username = {{ identity_service.get('service_username') }}
password = {{ identity_service.get('service_password') }}
admin_password = {{ identity_service.get('service_password') }}
admin_user = {{ identity_service.get('service_username') }}
admin_tenant_name = services
{% if identity_service.get('signing_dir') -%}
signing_dir = {{ identity_service.get('signing_dir') }}
{% endif -%}
{% if options.use_memcache == true -%}
memcached_servers = {{ options.memcache_url }}
{% endif -%}
# endofhacks
{% endif -%}

[clients]
endpoint_type = internal
client_retry_limit = {{ options.client_retry_limit }}

[global_job_scheduler]
misfire_grace_time = {{ options.misfire_grace_time }}

[filesearch]
process_timeout = {{ options.process_timeout }}

[s3fuse_sys_admin]
helper_command = sudo /usr/bin/workloadmgr-rootwrap /etc/triliovault-wlm/rootwrap.conf privsep-helper

[barbican]
encryption_support = true

