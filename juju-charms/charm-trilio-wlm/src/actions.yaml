unmount-old-backup-targets:
  description: |
    Unmount old static backup target mounts left over from T4O 5.x/6.0/6.1.
    Stops tvault-object-store service and lazy-unmounts all mounts under
    /var/triliovault-mounts on this unit. Run this on the trilio-wlm unit
    after upgrading to T4O 6.2 charms.
create-backup-targets:
  description: |
    Create T4O 6.2 backup targets from old 6.1 trilio-backup-targets JSON.
    Pass the backup-targets JSON from the old 6.1 overlay bundle's
    trilio-backup-targets config option. Run on the trilio-wlm leader unit
    after upgrading to 6.2 and running unmount-old-backup-targets.
  properties:
    backup-targets:
      type: string
      description: |
        JSON list of backup targets in the same format as the old 6.1
        trilio-backup-targets charm config option (array of objects with
        backup-target-name, backup-target-type, and type-specific keys).
  required:
    - backup-targets
create-cloud-admin-trust:
  description: Create trust between Trilio WLM user and Cloud Admin
  properties:
    password:
      type: string
      description: Password for the cloud admin account
  required:
    - password
create-license:
  description: Create license for operation of TrilioVault. License file is provided as the 'license' resource.
ghost-share:
  description: "Bind mount NFS share 'host' for secondary Trilio Vault deployment"
  properties:
    nfs-shares:
      type: string
      description: Comma separated nfs-shares configuration option from secondary deployment. NFS shares must be provided in the same order as the nfs-shares configuration option for the local deployment.
  required:
    - nfs-shares
update-trilio:
  description: |
    Update the trilio packages and run post-update steps such as rerender
    configuration files and run any upgrade tasks such as database migrations.
