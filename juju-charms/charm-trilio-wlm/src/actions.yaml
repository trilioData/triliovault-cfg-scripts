unmount-old-backup-targets:
  description: |
    Unmount old static backup target mounts left over from T4O 5.x/6.0/6.1.
    Kills any running s3vaultfuse processes, then lazy-unmounts all mounts
    under /var/triliovault-mounts deepest-first (NFS with umount -l -f,
    FUSE with umount -l). Run this on the trilio-wlm unit after upgrading
    to T4O 6.2 charms.
create-backup-targets:
  description: |
    Create T4O 6.2 backup targets from an old 6.1 overlay bundle YAML file.
    Copy the bundle file to the unit first using juju scp, then pass the
    file path. The action reads trilio-backup-targets from the bundle and
    calls workloadmgr backup-target-create for each entry. Run on the
    trilio-wlm leader unit after upgrading to 6.2 and running
    unmount-old-backup-targets.
  properties:
    bundle-file:
      type: string
      description: |
        Absolute path to the old 6.1 overlay bundle YAML file on the
        trilio-wlm leader unit. Use juju scp to copy the file to the unit
        before running this action.
  required:
    - bundle-file
create-cloud-admin-trust:
  description: Create trust between Trilio WLM user and Cloud Admin
  properties:
    password:
      type: string
      description: Password for the cloud admin account
  required:
    - password
create-license:
  description: Create license for operation of TrilioVault. License file is provided as the 'license' resource.
ghost-share:
  description: "Bind mount NFS share 'host' for secondary Trilio Vault deployment"
  properties:
    nfs-shares:
      type: string
      description: Comma separated nfs-shares configuration option from secondary deployment. NFS shares must be provided in the same order as the nfs-shares configuration option for the local deployment.
  required:
    - nfs-shares
update-trilio:
  description: |
    Update the trilio packages and run post-update steps such as rerender
    configuration files and run any upgrade tasks such as database migrations.
