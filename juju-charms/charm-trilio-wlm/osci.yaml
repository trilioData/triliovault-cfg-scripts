- project:
    templates:
      - charm-unit-jobs-py36
      - charm-unit-jobs-py38
    check:
      jobs:
      - charm-build
      - bionic-queens-42_trilio-wlm
      - bionic-ussuri-42_trilio-wlm
      - focal-ussuri-42_trilio-wlm
      - focal-ussuri-42-s3_trilio-wlm
      - focal-wallaby-42_trilio-wlm
      - focal-yoga-42_trilio-wlm
      - focal-yoga-42-s3_trilio-wlm
      - jammy-yoga-42_trilio-wlm
      - jammy-yoga-42-s3_trilio-wlm
    vars:
      needs_charm_build: true
      charm_build_name: trilio-wlm
      build_type: charmcraft
      charmcraft_channel: 2.0/stable
- job:
    name: jammy-yoga-42_trilio-wlm
    parent: jammy-yoga
    voting: false
    vars:
      tox_extra_args: '-- jammy-yoga-42'
- job:
    name: jammy-yoga-42-s3_trilio-wlm
    parent: jammy-yoga
    voting: false
    vars:
      tox_extra_args: '-- jammy-yoga-42-s3'
- job:
    name: focal-yoga-42_trilio-wlm
    parent: focal-yoga
    vars:
      tox_extra_args: '-- focal-yoga-42'
- job:
    name: focal-yoga-42-s3_trilio-wlm
    parent: focal-yoga
    vars:
      tox_extra_args: '-- focal-yoga-42-s3'
- job:
    name: focal-ussuri-42_trilio-wlm
    parent: func-target
    dependencies:
      - osci-lint
      - tox-py36
      - tox-py38
      - charm-build
    vars:
      tox_extra_args: '-- focal-ussuri-42'
- job:
    name: focal-ussuri-42-s3_trilio-wlm
    parent: func-target
    dependencies:
      - focal-ussuri-42_trilio-wlm
    vars:
      tox_extra_args: '-- focal-ussuri-42-s3'
- job:
    name: focal-wallaby-42_trilio-wlm
    parent: func-target
    dependencies:
      - focal-ussuri-42-s3_trilio-wlm
    vars:
      tox_extra_args: '-- focal-wallaby-42'
- job:
    name: bionic-ussuri-42_trilio-wlm
    parent: func-target
    dependencies:
      - focal-ussuri-42-s3_trilio-wlm
    vars:
      tox_extra_args: '-- bionic-ussuri-42'
- job:
    name: bionic-queens-42_trilio-wlm
    parent: func-target
    dependencies:
      - focal-ussuri-42_trilio-wlm
    vars:
      tox_extra_args: '-- bionic-queens-42'
