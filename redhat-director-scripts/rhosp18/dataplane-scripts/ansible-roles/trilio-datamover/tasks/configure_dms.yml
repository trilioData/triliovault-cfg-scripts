---
- name: Ensure Trilio DMS directory exists
  become: true
  file:
    path: "{{ triliovault_dms_config_dest }}"
    state: directory
    owner: '42436'
    group: '42436'

- name: Create Trilio DMS configuration file
  become: true
  template:
    src: triliovault_dms_conf.j2
    dest: "{{ triliovault_dms_config_dest }}/server.conf"
    owner: '42436'
    group: '42436'
    mode: '0644'
  notify:
    - Restart triliovault-dms

- name: Create S3VaultFuse global configuration file
  become: true
  template:
    src: s3vaultfuse_global_conf.j2
    dest: "{{ triliovault_dms_config_dest }}/s3vaultfuse-global.conf"
    owner: '42436'
    group: '42436'
    mode: '0644'
  notify:
    - Restart triliovault-dms

- name: Create Triliovault DMS log directory
  become: true
  file:
    path: /var/log/containers/triliovault-dms
    state: directory

- name: Render triliovault_dms_config_json.j2
  become: true
  template:
    src: "triliovault_dms_config_json.j2"
    dest: "{{ triliovault_dms_config_dest }}/triliovault_dms_config.json"
    mode: "0644"
    owner: "42436"
  notify: 
    - "Restart triliovault-dms"


- name: Render triliovault-dms container json
  become: true
  template:
    src: "triliovault-dms-container-json.j2"
    dest: "/var/lib/openstack/config/containers/triliovault-dms.json"
    mode: "0644"
  notify: 
    - "Restart triliovault-dms"


- name: Ship tmpfiles.d config for the Triliovault DMS runtime directory
  become: true
  template:
    src: trilio_dms_tmpfiles_conf.j2
    dest: /etc/tmpfiles.d/trilio-dms.conf
    owner: root
    group: root
    mode: '0644'

# Apply it now instead of waiting for the next boot. Idempotent: for a "d"
# line systemd-tmpfiles creates the directory when it is missing and corrects
# the mode/owner when it is not, so this is safe on every run.
#
# Must stay ahead of "Deploy trilio DMS containers" below - the directory has
# to exist before edpm_container_manage starts the container. Deliberately no
# handler notify: the container json task above already notifies a restart
# when the mount list changes, and a DMS server sitting dead on a missing
# /run/dms is under Restart=always and picks the directory up on its next
# retry.
#
# Bare command name, not an absolute path: systemd-tmpfiles lives in /usr/bin
# on RHEL 9 but this role is also read on hosts where /bin vs /usr/bin
# symlinking differs.
- name: Create the Triliovault DMS runtime directory now
  become: true
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/trilio-dms.conf
  changed_when: false

- name: Deploy trilio DMS containers
  ansible.builtin.include_role:
    name: osp.edpm.edpm_container_manage
  vars:
    edpm_container_manage_config: '/var/lib/openstack/config/containers'
    edpm_container_manage_healthcheck_disabled: true
    edpm_container_manage_config_patterns: 'triliovault-dms.json'
    edpm_container_manage_clean_orphans: false


