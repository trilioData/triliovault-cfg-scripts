---
# Cleanup tasks for upgrading from T4O 6.0/6.1 to 6.2 on RHOSO18 data plane nodes.
# Run AFTER T4O 6.2 is installed. Old object store/NFS containers, defunct
# mount points, and config files must be removed cleanly to avoid hung mounts.
#
# Usage:
#   ansible-playbook ... --tags upgrade-and-clean-backup-target-mounts

# Step 1: Lazy-unmount S3 FUSE mounts first (before stopping containers).
# Stopping the container that owns a FUSE mount without unmounting first causes hang.
# awk checks $2 (FSTYPE column) to avoid false matches on path names containing "fuse".
- name: Lazy unmount all S3 FUSE mounts under vault_data_dir
  become: true
  shell: |
    findmnt -r -n -o TARGET,FSTYPE | grep "^{{ vault_data_dir }}" | awk '$2 ~ /^fuse/ {print $1}' | sort -r | while read -r mnt; do
      echo "Lazy unmounting FUSE mount: $mnt"
      umount -l "$mnt" || true
    done
  args:
    executable: /bin/bash
  changed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 2: Lazy-unmount NFS mounts under vault_data_dir
# awk checks $2 (FSTYPE column) exactly to avoid false matches on path names containing "nfs".
- name: Lazy unmount all NFS mounts under vault_data_dir
  become: true
  shell: |
    findmnt -r -n -o TARGET,FSTYPE | grep "^{{ vault_data_dir }}" | awk '($2 == "nfs" || $2 == "nfs4") {print $1}' | sort -r | while read -r mnt; do
      echo "Lazy unmounting NFS mount: $mnt"
      umount -l -f "$mnt" || true
    done
  args:
    executable: /bin/bash
  changed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 3: Stop and disable old S3 object store systemd services.
# Service name pattern: edpm_triliovault-object-store-<bt_name>.service
# Must be done before stopping containers, otherwise systemd restarts them.
- name: Get list of old object store systemd services
  become: true
  shell: systemctl list-unit-files --no-legend --no-pager | grep 'edpm_triliovault-object-store-' | awk '{print $1}'
  args:
    executable: /bin/bash
  register: object_store_services
  changed_when: false
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

- name: Stop and disable old object store systemd services
  become: true
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ object_store_services.stdout_lines }}"
  when: object_store_services.stdout_lines | length > 0
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 4: Stop and disable old NFS mount systemd services.
# Service name pattern: edpm_triliovault-nfs-container-<bt_name>.service
- name: Get list of old NFS mount systemd services
  become: true
  shell: systemctl list-unit-files --no-legend --no-pager | grep 'edpm_triliovault-nfs-container-' | awk '{print $1}'
  args:
    executable: /bin/bash
  register: nfs_services
  changed_when: false
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

- name: Stop and disable old NFS mount systemd services
  become: true
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ nfs_services.stdout_lines }}"
  when: nfs_services.stdout_lines | length > 0
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 5: Remove old S3 object store containers
- name: Get list of old object store containers
  become: true
  command: podman ps -a --format '{{ "{{" }}.Names{{ "}}" }}' --filter name=triliovault-object-store
  register: object_store_containers
  changed_when: false
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

- name: Stop old object store containers
  become: true
  command: podman stop "{{ item }}"
  loop: "{{ object_store_containers.stdout_lines }}"
  when: object_store_containers.stdout_lines | length > 0
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

- name: Remove old object store containers
  become: true
  command: podman rm -f "{{ item }}"
  loop: "{{ object_store_containers.stdout_lines }}"
  when: object_store_containers.stdout_lines | length > 0
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 6: Remove old NFS mount containers
- name: Get list of old NFS mount containers
  become: true
  command: podman ps -a --format '{{ "{{" }}.Names{{ "}}" }}' --filter name=triliovault-nfs-container
  register: nfs_containers
  changed_when: false
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

- name: Stop old NFS mount containers
  become: true
  command: podman stop "{{ item }}"
  loop: "{{ nfs_containers.stdout_lines }}"
  when: nfs_containers.stdout_lines | length > 0
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

- name: Remove old NFS mount containers
  become: true
  command: podman rm -f "{{ item }}"
  loop: "{{ nfs_containers.stdout_lines }}"
  when: nfs_containers.stdout_lines | length > 0
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 7: Remove old S3 object store container JSON files from containers dir
- name: Find old object store container JSON files
  become: true
  find:
    paths: /var/lib/openstack/config/containers
    patterns: "triliovault-object-store-*.json"
  register: old_object_store_container_jsons
  tags:
    - upgrade-and-clean-backup-target-mounts

- name: Remove old object store container JSON files
  become: true
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_object_store_container_jsons.files }}"
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 8: Remove old NFS container JSON files from containers dir
- name: Find old NFS container JSON files
  become: true
  find:
    paths: /var/lib/openstack/config/containers
    patterns: "triliovault-nfs-container-*.json"
  register: old_nfs_container_jsons
  tags:
    - upgrade-and-clean-backup-target-mounts

- name: Remove old NFS container JSON files
  become: true
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_nfs_container_jsons.files }}"
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 9: Remove old S3 object store config directory
# Contains: triliovault-object-store-<name>.conf, triliovault-object-store-<name>.json,
#           object_store_logging.conf, s3-cert-<name>.pem
- name: Remove old object store config directory
  become: true
  file:
    path: /var/lib/openstack/config/triliovault-object-store
    state: absent
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 10: Remove old NFS config directory
# Contains: triliovault_nfs_config-<name>.json, nfs_mount-<name>.sh
- name: Remove old NFS config directory
  become: true
  file:
    path: /var/lib/openstack/config/triliovault-nfs
    state: absent
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 11: Remove old object store log directory
- name: Remove old object store log directory
  become: true
  file:
    path: /var/log/containers/triliovault-object-store
    state: absent
  tags:
    - upgrade-and-clean-backup-target-mounts

# Step 12: Final check — report any remaining mounts under vault_data_dir
- name: List any remaining mounts under vault_data_dir
  become: true
  shell: findmnt -r -n -o TARGET,FSTYPE,SOURCE | grep "^{{ vault_data_dir }}" || true
  args:
    executable: /bin/bash
  register: remaining_mounts
  changed_when: false
  failed_when: false
  tags:
    - upgrade-and-clean-backup-target-mounts

- name: Report remaining mounts
  debug:
    msg: "Remaining mounts under {{ vault_data_dir }}: {{ remaining_mounts.stdout_lines }}"
  when: remaining_mounts.stdout_lines | length > 0
  tags:
    - upgrade-and-clean-backup-target-mounts

- name: Confirm cleanup complete
  debug:
    msg: "Old backup target cleanup complete. No remaining mounts found under {{ vault_data_dir }}."
  when: remaining_mounts.stdout_lines | length == 0
  tags:
    - upgrade-and-clean-backup-target-mounts
