---

triliovault_datamover_config_src: /var/lib/openstack/configs
triliovault_datamover_config_dest: /var/lib/openstack/config/triliovault-datamover
triliovault_dms_config_src: /var/lib/openstack/configs
triliovault_dms_config_dest: /var/lib/openstack/config/triliovault-dms


# defaults file for trilio-datamover
vault_data_dir: "/var/lib/trilio/triliovault-mounts"
dmapi_transport_url: ""
dmapi_database_connection: ""
cinder_backend_ceph: true
libvirt_images_rbd_ceph_conf: "/etc/ceph/ceph.conf"
ceph_cinder_user: "cinder"
oslomsg_rpc_use_ssl: true
cinder_backend_power_flex: false
## Do we need this parameter? Check datamover conf.
cinder_http_retries: "10"

## Images
triliovault_datamover_image: "docker.io/trilio/trilio-datamover:6.0.0-stable-19-rhosp18.0"
triliovault_wlm_image: "docker.io/trilio/trilio-wlm:6.0.0-stable-19-rhosp18.0"
triliovault_dms_image: "docker.io/trilio/trilio-dms:6.2.0-stable-19-rhosp18.0"

ca_bundle_exists: "true"
edpm_nova_tls_ca_src_dir: "/var/lib/openstack/cacerts/nova"


trilio_container_registry_username: ""
trilio_container_registry_password: ""
trilio_container_registry_url: "docker.io"

# S3VaultFuse Global Config parameters
# These can be overridden by adding s3vaultfuse_global to cm-trilio-datamover.yaml under trilio_env.yml
s3vaultfuse_global:
  default:
    vault_storage_type: "s3"
    vault_s3_max_pool_connections: 50
    vault_s3_read_timeout: 30
    vault_s3_max_attempts: 3
    vault_s3_auth_version: "DEFAULT"
    vault_s3_signature_version: "default"
    vault_s3_ssl: "True"
    vault_s3_ssl_verify: "True"
    vault_s3_region_name: "us-east-1"
    vault_segment_size: 33554432
    vault_cache_size: 16
    queue_depth: 100
    worker_pool_size: 10
    vault_retry_count: 2
    vault_enable_threadpool: "True"
    vault_threaded_filesystem: "True"
    max_uploads_pending: 20
    vault_logging_level: "error"
    log_file: "/var/log/tvault-object-store/tvault-object-store.log"
    log_config_append: "/etc/triliovault-object-store/object_store_logging.conf"
    trace_function_calls: "False"
    bucket_object_lock: "False"
    use_manifest_suffix: "False"
    azure_immutability_enabled: "False"
    metadata_cache_max_items: 32
    vault_cache_username: "nova"
  s3fuse_sys_admin:
    helper_command: "sudo /usr/bin/trilio-dms-rootwrap /etc/triliovault-dms/rootwrap.conf privsep-helper"

