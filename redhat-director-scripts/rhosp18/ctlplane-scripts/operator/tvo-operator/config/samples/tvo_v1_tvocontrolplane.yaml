apiVersion: tvo.trilio.io/v1
kind: TVOControlPlane
metadata:
  name: tvocontrolplane-sample
spec:
  # Default values copied from <project_dir>/helm-charts/tvo-chart/values.yaml
  crdType: "TVOControlPlane"
  common:
    dmapi_workers: "16"
    memcached_servers: ""
    my_ip:
      host_interface: null
    nova_group_id: "42436"
    nova_user_id: "42436"
    oslo_enable_proxy_headers_parsing: false
    trustee_role: creator
  database:
    common:
      host: EDIT_DB_HOSTNAME
      root_password: EDIT_PASSWORD
      root_user_name: root
    datamover_api:
      database: dmapi
      password: EDIT_PASSWORD
      user: dmapi
    wlm_api:
      database: workloadmgr
      password: EDIT_PASSWORD
      user: workloadmgr
  helm3_hook: true
  images:
    bootstrap: docker.io/openstackhelm/heat:ocata-ubuntu_xenial
    db_drop: docker.io/openstackhelm/heat:ocata-ubuntu_xenial
    db_init: docker.io/openstackhelm/heat:ocata-ubuntu_xenial
    dep_check: quay.io/airshipit/kubernetes-entrypoint:v1.0.0
    image_repo_sync: docker.io/docker:17.07.0
    ks_endpoints: docker.io/openstackhelm/heat:ocata-ubuntu_xenial
    ks_service: docker.io/openstackhelm/heat:ocata-ubuntu_xenial
    ks_user: docker.io/openstackhelm/heat:ocata-ubuntu_xenial
    local_registry:
      active: false
      exclude:
      - dep_check
      - image_repo_sync
    pull_policy: IfNotPresent
    rabbit_init: docker.io/rabbitmq:3.7-management
    triliovault_datamover_api: docker.io/trilio/trilio-datamover-api-helm:5.0.0-train-ubuntu_bionic
    triliovault_datamover_db_sync: docker.io/trilio/trilio-datamover-api-helm:5.0.0-train-ubuntu_bionic
    triliovault_wlm: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
    triliovault_wlm_api: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
    triliovault_wlm_cron: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
    triliovault_wlm_db_sync: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
    triliovault_wlm_scheduler: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
    triliovault_wlm_workloads: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
  openstack:
    namespace: "openstack"
    osp_secret_name: "osp-secret"
  keystone:
    common:
      admin_role_name: admin
      auth_uri: ""
      auth_url: ""
      cloud_admin_domain_name: Default
      cloud_admin_project_name: admin
      cloud_admin_user_name: admin
      cloud_admin_user_password: ""
      is_self_signed_ssl_cert: true
      keystone_auth_host: ""
      keystone_auth_port: ""
      keystone_auth_protocol: ""
      region_name: regionOne
      service_project_domain_name: Default
      service_project_name: service
    datamover_api:
      internal_endpoint: ENDPOINT_PROTOCOL_INTERNAL://ENDPOINT_HOST_INTERNAL:8784/v2
      password: EDIT_PASSWORD
      public_auth_host: ""
      public_endpoint: ENDPOINT_PROTOCOL_PUBLIC://ENDPOINT_HOST_PUBLIC:8784/v2
      service_desc: TrilioVault Datamover Api Service
      service_name: dmapi
      service_type: datamover
      user: dmapi
    identity: null
    keystone_interface: internal
    wlm_api:
      internal_endpoint: ENDPOINT_PROTOCOL_INTERNAL://ENDPOINT_HOST_INTERNAL:8781/v1/$(tenant_id)s
      password: EDIT_PASSWORD
      public_auth_host: ""
      public_endpoint: ENDPOINT_PROTOCOL_PUBLIC://ENDPOINT_HOST_PUBLIC:8781/v1/$(tenant_id)s
      service_desc: TrilioVault Workloadmgr Api Service
      service_name: TrilioVaultWLM
      service_type: workloads
      user: triliovault
  labels:
    datamover_api:
      node_selector_key: trilio-control-plane
      node_selector_value: enabled
    wlm_api:
      node_selector_key: trilio-control-plane
      node_selector_value: enabled
    wlm_cron:
      node_selector_key: trilio-control-plane
      node_selector_value: enabled
    wlm_scheduler:
      node_selector_key: trilio-control-plane
      node_selector_value: enabled
    wlm_workloads:
      node_selector_key: trilio-control-plane
      node_selector_value: enabled
  pod:
    triliovault_wlm_api:
      networks: ""
      debug_mode: false
    triliovault_wlm_scheduler:
      networks: ""
      debug_mode: false
    triliovault_wlm_cron:
      networks: ""
      debug_mode: false
    triliovault_wlm_workloads:
      networks: ""
      debug_mode: false
    triliovault_datamover_api:
      networks: ""
      debug_mode: false
    affinity:
      anti:
        topologyKey:
          default: kubernetes.io/hostname
        type:
          default: preferredDuringSchedulingIgnoredDuringExecution
        weight:
          default: 10
    lifecycle:
      disruption_budget:
        datamover_api:
          min_available: 2
        wlm_api:
          min_available: 2
      termination_grace_period:
        datamover:
          timeout: 30
        datamover_api:
          timeout: 30
        wlm_api:
          timeout: 30
        wlm_cron:
          timeout: 30
        wlm_scheduler:
          timeout: 30
        wlm_workloads:
          timeout: 30
      upgrades:
        daemonsets:
          datamover:
            enabled: true
            max_unavailable: 1
            min_ready_seconds: 0
          pod_replacement_strategy: RollingUpdate
        deployments:
          pod_replacement_strategy: RollingUpdate
          revision_history: 3
          rolling_update:
            max_surge: 3
            max_unavailable: 1
    replicas:
      triliovault_datamover_api: 3
      triliovault_wlm_api: 3
      triliovault_wlm_cron: 1
      triliovault_wlm_scheduler: 3
      triliovault_wlm_workloads: 3
    resources:
      datamover_api:
        limits:
          cpu: 2000m
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 128Mi
      enabled: false
      jobs:
        bootstrap:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
        db_drop:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
        db_init:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
        db_sync:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
        image_repo_sync:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
        ks_endpoints:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
        ks_service:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
        ks_user:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
        rabbit_init:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
        tests:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
      wlm_api:
        limits:
          cpu: 2000m
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 128Mi
      wlm_cron:
        limits:
          cpu: 2000m
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 128Mi
      wlm_scheduler:
        limits:
          cpu: 2000m
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 128Mi
      wlm_workloads:
        limits:
          cpu: 2000m
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 128Mi
    security_context:
      triliovault:
        container:
          triliovault_datamover_api:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsGroup: 0
            runAsUser: 63630
          triliovault_datamover_api_init:
            readOnlyRootFilesystem: false
            runAsGroup: 63630
            runAsUser: 0
          triliovault_wlm_api:
            privileged: true
            readOnlyRootFilesystem: false
            runAsUser: 42436
          triliovault_wlm_cron:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 42436
          triliovault_wlm_init:
            readOnlyRootFilesystem: false
            runAsGroup: 42436
            runAsUser: 0
          triliovault_wlm_scheduler:
            privileged: true
            readOnlyRootFilesystem: false
            runAsUser: 42436
          triliovault_wlm_workloads:
            privileged: true
            readOnlyRootFilesystem: false
            runAsUser: 42436
        pod:
          runAsUser: 42424
  dms:
    # s3vaultfuse-global.conf parameters
    # These configure how DMS spawns s3vaultfuse processes on control plane nodes.
    # The values below are defaults -- modify only the params you need to override.
    s3vaultfuse:
      default:
        vault_storage_type: "s3"
        vault_s3_max_pool_connections: 50
        vault_s3_read_timeout: 30
        vault_s3_max_attempts: 3
        vault_s3_auth_version: "DEFAULT"
        vault_s3_signature_version: "default"
        # SSL settings -- DMS overrides these via env vars; set here only to change the site-wide default
        vault_s3_ssl: "True"
        vault_s3_ssl_verify: "True"
        vault_s3_region_name: "us-east-1"
        # FUSE / caching
        vault_segment_size: 33554432
        vault_cache_size: 16
        queue_depth: 100
        worker_pool_size: 10
        vault_retry_count: 2
        # Thread pool
        vault_enable_threadpool: "True"
        vault_threaded_filesystem: "True"
        max_uploads_pending: 20
        # Logging
        vault_logging_level: "error"
        log_file: "/var/log/triliovault/triliovault-object-store.log"
        log_config_append: "/etc/triliovault-object-store/object_store_logging.conf"
        trace_function_calls: "False"
        # S3 bucket features
        bucket_object_lock: "False"
        use_manifest_suffix: "False"
        azure_immutability_enabled: "False"
        # Metadata cache
        metadata_cache_max_items: 32
        vault_cache_username: "nova"
      s3fuse_sys_admin:
        helper_command: "sudo /usr/bin/trilio-dms-rootwrap /etc/triliovault-dms/rootwrap.conf privsep-helper"
  rabbitmq:
    common:
      admin_password: EDIT_PASSWORD
      admin_user: admin
      driver: messagingv2
      host: EDIT_HOST
      port: "5672"
    datamover_api:
      password: EDIT_PASSWORD
      transport_url: ""
      user: dmapi
      vhost: dmapi
    wlm_api:
      password: EDIT_PASSWORD
      transport_url: ""
      user: workloadmgr
      vhost: workloadmgr

  
