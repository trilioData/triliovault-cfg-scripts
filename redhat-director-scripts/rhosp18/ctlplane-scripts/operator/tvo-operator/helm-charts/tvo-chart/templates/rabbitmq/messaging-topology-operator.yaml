{{- if eq .Values.crdType "TVOControlPlane" }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rabbitmq-messaging-topology-operator
  namespace: trilio-openstack
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-7"
spec:
  channel: stable
  name: rabbitmq-messaging-topology-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  startingCSV: rabbitmq-messaging-topology-operator.v1.14.2
  config:
    volumes:
      - name: rabbitmq-ca
        secret:
          secretName: cert-trilio-rabbitmq-cluster
          defaultMode: 420
    volumeMounts:
      - name: rabbitmq-ca
        mountPath: /etc/ssl/certs/rabbitmq-ca.crt
        subPath: ca.crt
        readOnly: true
{{- end }}
