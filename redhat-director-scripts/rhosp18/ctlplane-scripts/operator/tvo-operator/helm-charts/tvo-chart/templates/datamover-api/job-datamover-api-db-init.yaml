{{- if eq .Values.crdType "TVOControlPlane" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "job-triliovault-datamover-api-db-init"
  labels:
    application: triliovault
    component: datamover-api-db-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-3"
spec:
  backoffLimit: 1000
  template:
    metadata:
      labels:
        application: triliovault
        component: datamover-api-db-init
    spec:
      securityContext:
        runAsUser: {{ .Values.pod.security_context.triliovault.container.triliovault_datamover_api.runAsUser }}
        fsGroup: {{ .Values.pod.security_context.triliovault.container.triliovault_datamover_api.runAsGroup }}
      serviceAccountName: triliovault-datamover-api
      restartPolicy: OnFailure
      nodeSelector:
        trilio-control-plane: enabled
      containers:
        - name: "datamover-api-db-init"
          securityContext:
            readOnlyRootFilesystem: false
            runAsUser: {{ .Values.pod.security_context.triliovault.container.triliovault_datamover_api.runAsUser }}
          image: {{ .Values.images.triliovault_datamover_api }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trilio-openstack-secret
                  key: DmapiDatabasePassword
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trilio-openstack-secret
                  key: DbRootPassword
            - name: DMAPI_DATABASE_USER
              value: "{{- .Values.database.datamover_api.user -}}"
            - name: DMAPI_DATABASE_HOST
              value: "{{- .Values.database.common.host -}}"
            - name: DMAPI_DATABASE_PORT
              value: "{{- .Values.database.common.port -}}"
            - name: DMAPI_DATABASE_NAME
              value: "{{- .Values.database.datamover_api.database -}}"
          command:
            - /bin/bash
            - -c
            - /tmp/triliovault-datamover-api-db-init.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: triliovault-datamover-api-bin
              mountPath: /tmp/triliovault-datamover-api-db-init.sh
              subPath: triliovault-datamover-api-db-init.sh
            - name: triliovault-datamover-api-etc
              mountPath: /etc/triliovault-datamover/triliovault-datamover-api.conf
              subPath: triliovault-datamover-api.conf
              readOnly: true
            - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
              name: combined-ca-bundle
              readOnly: true
              subPath: tls-ca-bundle.pem
            - name: triliovault-datamover-api-etc
              mountPath: /etc/triliovault-datamover/datamover_api_logging.conf
              subPath: datamover_api_logging.conf
              readOnly: true
            - name: trilio-logs
              mountPath: /var/log/triliovault
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: trilio-logs
          emptyDir: {}
        - name: triliovault-datamover-api-bin
          configMap:
            name: triliovault-datamover-api-bin
            defaultMode: 0555
        - name: triliovault-datamover-api-etc
          secret:
            secretName: triliovault-datamover-api-etc
            defaultMode: 0444
        - name: combined-ca-bundle
          secret:
            defaultMode: 292
            secretName: combined-ca-bundle
{{- end }}

