{{- if and (eq .Values.crdType "TVOControlPlane") (.Values.database.common.use_trilio_galera) }}
---
apiVersion: mariadb.openstack.org/v1beta1
kind: Galera
metadata:
  # NOTE: must never contain the substring "-galera-" — RHOSO's mariadb-operator
  # (report_local_galera_state.py) derives the CR name from the pod hostname via
  # an unanchored `re.sub(r'-galera-[0-9]*', '', pod_name)`, which strips every
  # occurrence of "-galera-", not just the trailing ordinal suffix. A CR name
  # like "trilio-galera-cluster" gets mangled to "triliocluster", the operator
  # 404s trying to read/write that CR's status, and Galera pods never get a
  # gcomm URI (TVAULT-7493).
  name: trilio-db-cluster
  namespace: {{ .Release.Namespace }}
  labels:
    app: galera
    component: database
  # No helm.sh/hook annotations here on purpose (TVAULT-7556).
  #
  # As a post-install,post-upgrade hook with no hook-delete-policy, Helm's default
  # (before-hook-creation) deleted and recreated this CR on EVERY helm upgrade. That tore
  # down the MariaDB StatefulSet mid-upgrade, so the previous revision's wlm/dmapi pods -
  # still running, because Helm had not yet reached the Deployment hooks at weight 100 -
  # lost their database and crash-looped until Galera re-formed. Confirmed by the CR uid
  # and creationTimestamp changing on every upgrade.
  #
  # As a plain templated resource Helm patches it in place, so the database is never torn
  # down and Galera fields in tvo-operator-inputs.yaml still take effect. Deleting the CR
  # out-of-band is self-healing too: it is part of the release manifest, so the next
  # upgrade recreates it - and because the PVCs come from the StatefulSet's
  # volumeClaimTemplates they are not garbage-collected with it, so the rebuilt cluster
  # re-binds the same PVs with the data intact (verified: databases survived a CR
  # delete+recreate). Galera's credentials come from a fixed secret
  # (spec.secret: trilio-openstack-secret), not an auto-generated one, so a recreate does
  # not suffer RabbitMQ's regenerated-credential problem.
  #
  # Ordering note: manifest resources are applied before post-install/post-upgrade hooks,
  # so the CR still exists before galera-cluster-wait-job (-13) runs - no hook-weight
  # needed. Requires Helm ownership metadata on a pre-existing CR; see
  # patch_helm_ownership_metadata.sh, run from deploy_tvo_control_plane.sh.
spec:
  # Galera cluster configuration
  replicas: {{ .Values.database.galera.replicas }}

  # Storage configuration
  storageClass: {{ .Values.database.galera.storageClass }}
  storageRequest: {{ .Values.database.galera.storageRequest }}

  # Secret containing passwords
  secret: {{ .Values.database.galera.secret }}

  # Container image
  containerImage: {{ .Values.images.galera }}

  # Disk logging configuration
  logToDisk: {{ .Values.database.galera.logToDisk }}

  # Resource limits and requests
  resources:
    requests:
      cpu: {{ .Values.database.galera.resources.requests.cpu | quote }}
      memory: {{ .Values.database.galera.resources.requests.memory }}
    limits:
      cpu: {{ .Values.database.galera.resources.limits.cpu | quote }}
      memory: {{ .Values.database.galera.resources.limits.memory }}

  # TLS configuration
  tls:
    caBundleSecretName: {{ .Values.database.galera.tls.caBundleSecretName }}
    secretName: {{ .Values.database.galera.tls.secretName }}

  # Node selector
  {{- if .Values.database.galera.nodeSelector }}
  nodeSelector:
    {{- toYaml .Values.database.galera.nodeSelector | nindent 4 }}
  {{- end }}

  # Pod anti-affinity to spread replicas across nodes
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - galera
          topologyKey: kubernetes.io/hostname
{{- end }}