{{- if eq .Values.crdType "TVOControlPlane" }}
apiVersion: rabbitmq.openstack.org/v1beta1
kind: RabbitMq
metadata:
  name: trilio-rabbitmq-cluster
  namespace: {{ .Values.rabbitmq.common.namespace }}
  # No helm.sh/hook annotations here on purpose (TVAULT-7517 + TVAULT-7556).
  #
  # As a hook with the default hook-delete-policy (before-hook-creation) this CR was
  # deleted and recreated on EVERY helm upgrade, minting a fresh auto-generated
  # default-user secret while the StatefulSet's PVCs kept the old Mnesia credentials -
  # breaking dmapi/wlm auth (TVAULT-7517).
  #
  # As a plain templated resource Helm patches it in place across upgrades, so the broker
  # keeps a stable identity and RabbitMQ fields in tvo-operator-inputs.yaml still take
  # effect. Deleting it out-of-band is also self-healing: it is part of the release
  # manifest, so the next upgrade recreates it.
  #
  # This requires the pre-existing CR to carry Helm ownership metadata, which Helm never
  # stamps on hook resources - without it an upgrade from a release where this WAS a hook
  # aborts with "invalid ownership metadata" before any candidate release is built
  # (TVAULT-7556). patch_helm_ownership_metadata.sh, run from
  # deploy_tvo_control_plane.sh before the CR is applied, stamps that metadata once.
spec:
  replicas: {{ .Values.rabbitmq.cluster.replicas }}
  # Pin the broker to RHOSO's own RabbitMQ container image (TVAULT-7511 follow-up).
  #
  # The native RabbitMq CRD documents containerImage as "will be set to environmental
  # default if empty", and that default is the upstream community build
  # quay.io/podified-antelope-centos9/openstack-rabbitmq:current-podified - not a Red Hat
  # supported image. RHOSO's own rabbitmq/rabbitmq-cell1 CRs avoid it only because
  # openstack-operator injects OpenStackVersion.status.containerImages.rabbitmqImage into
  # the CRs it owns; a standalone CR like this one is never touched by that, and
  # infra-operator (which reconciles RabbitMq from FR6 on) ships no RELATED_IMAGE_* env
  # for rabbitmq to fall back on. So T4O has to set it explicitly, exactly as
  # galera-cluster.yaml does for MariaDB.
  #
  # values.yaml carries a Red Hat default for images.rabbitmq, so an inputs file that
  # merely omits the key still resolves to a supported image - the CR spec is merged over
  # the chart defaults, not instead of them. The guard therefore only covers the explicit
  # images.rabbitmq: "" (or null) case: it keeps that from rendering a null containerImage,
  # which the CRD's string type would reject and which would fail the whole release, and
  # hands the choice back to the operator default instead.
{{- if .Values.images.rabbitmq }}
  containerImage: {{ .Values.images.rabbitmq }}
{{- end }}
  delayStartSeconds: 30
  resources:
    requests:
      cpu: {{ .Values.rabbitmq.cluster.resources.requests.cpu }}
      memory: {{ .Values.rabbitmq.cluster.resources.requests.memory }}
    limits:
      cpu: {{ .Values.rabbitmq.cluster.resources.limits.cpu }}
      memory: {{ .Values.rabbitmq.cluster.resources.limits.memory }}
  persistence:
    storageClassName: {{ .Values.rabbitmq.cluster.persistence.storage_class_name }}
    storage: {{ .Values.rabbitmq.cluster.persistence.storage }}
  tls:
    secretName: cert-trilio-rabbitmq-cluster
    caSecretName: cert-trilio-rabbitmq-cluster
    disableNonTLSListeners: true
  override:
    service:
      metadata:
        annotations:
          metallb.universe.tf/address-pool: {{ .Values.common.metallb_address_pool }}
          dnsmasq.network.openstack.org/hostname: trilio-rabbitmq-cluster.trilio-openstack.svc
      spec:
        type: LoadBalancer
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - trilio-rabbitmq-cluster
            topologyKey: kubernetes.io/hostname
  # Broker tuning the FR6 RabbitMQ operator does not set for itself (TVAULT-7678).
  #
  # infra-operator generates conf.d/10-operatorDefaults.conf covering cluster formation,
  # cluster_partition_handling, TLS listeners/ports, disk_free_limit and
  # vm_memory_high_watermark.relative, but it sets nothing for the connection,
  # message-size, heartbeat or GC limits. Without this block FR6 runs those on bare
  # broker defaults, while every FR5 deployment had them tuned. They came from the
  # till-FR5 inputs file's rabbitmq.cluster.rabbitmq.additional_config, which
  # TVAULT-7511 dropped when it pruned the community-operator fields on the assumption
  # the native CRD had no equivalent. It does - spec.rabbitmq.additionalConfig, the same
  # path as the community CRD (the same class of wrong assumption as
  # spec.containerImage, TVAULT-7634).
  #
  # This reads the same values key as the till-FR5 template on purpose, so the two
  # variants stay symmetric and a customer's own tuning carries across the FR5 -> FR6
  # move. The corollary is that update_tvo_operator_inputs_to_latest.py matters for
  # correctness on that move, not just tidiness: additionalConfig lands in
  # conf.d/90-userDefinedConfiguration.conf, which the broker loads AFTER
  # 10-operatorDefaults.conf, so a till-FR5 block carried over by hand would override
  # the operator's pause_minority and its TLS listener setup. That script strips the
  # block; the chart default above then supplies the FR6-safe tuning.
  #
  # Deliberately not carried over from FR5 either: advancedConfig, because a user value
  # makes the operator's buildAdvancedConfig() early-return and replace its
  # FIPS-/version-aware TLS config (and {client,{verify,verify_peer}}) with FR5's
  # hardcoded tlsv1.2 + verify_none; and erlangInetConfig, because the StatefulSet
  # passes -kernel inetrc, so an inetrc must itself carry {resolv_conf,...} and
  # {hosts_file,...} or DNS resolution breaks - FR5's bare {inet,true}. does not.
{{- $rabbitmqCfg := .Values.rabbitmq.cluster.rabbitmq | default dict }}
{{- if $rabbitmqCfg.additional_config }}
  rabbitmq:
    additionalConfig: |
{{ $rabbitmqCfg.additional_config | nindent 6 }}
{{- end }}
  terminationGracePeriodSeconds: {{ .Values.rabbitmq.cluster.termination_grace_period_seconds | default 604800 }}
{{- end }}
