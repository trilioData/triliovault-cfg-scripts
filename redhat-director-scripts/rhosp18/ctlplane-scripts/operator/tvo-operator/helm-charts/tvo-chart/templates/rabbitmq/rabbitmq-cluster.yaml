{{- if eq .Values.crdType "TVOControlPlane" }}
apiVersion: {{ .Values.rabbitmq.cluster.api_version }}
kind: RabbitmqCluster
metadata:
  name: trilio-rabbitmq-cluster
  namespace: {{ .Values.rabbitmq.common.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-18"
spec:
  replicas: {{ .Values.rabbitmq.cluster.replicas }}
  image: {{ .Values.rabbitmq.cluster.image }}
  override:
    statefulSet:
      spec:
        template:
          metadata: {}
          spec:
            containers:
            - args:
              - /usr/lib/rabbitmq/bin/rabbitmq-server
              env:
              - name: RABBITMQ_UPGRADE_LOG
                value: /var/lib/rabbitmq/rabbitmq_upgrade.log
              - name: HOME
                value: /var/lib/rabbitmq
              - name: PATH
                value: /usr/lib/rabbitmq/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              image: {{ .Values.rabbitmq.cluster.image }}
              name: rabbitmq
              resources: {}
            initContainers:
            - name: setup-container
              resources: {}
              securityContext: {}
            securityContext: {}
  resources:
    requests:
      cpu: {{ .Values.rabbitmq.cluster.resources.requests.cpu }}
      memory: {{ .Values.rabbitmq.cluster.resources.requests.memory }}
    limits:
      cpu: {{ .Values.rabbitmq.cluster.resources.limits.cpu }}
      memory: {{ .Values.rabbitmq.cluster.resources.limits.memory }}
  persistence:
    storageClassName: {{ .Values.rabbitmq.cluster.persistence.storage_class_name }}
    storage: {{ .Values.rabbitmq.cluster.persistence.storage }}
  tls:
    secretName: cert-trilio-rabbitmq-cluster
    caSecretName: cert-trilio-rabbitmq-cluster
    disableNonTLSListeners: true
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - trilio-rabbitmq-cluster
            topologyKey: kubernetes.io/hostname
  rabbitmq:
    additionalConfig: |
{{ .Values.rabbitmq.cluster.rabbitmq.additional_config | nindent 6 }}
  service:
    type: {{ .Values.rabbitmq.cluster.service.type }}

{{- end }}
