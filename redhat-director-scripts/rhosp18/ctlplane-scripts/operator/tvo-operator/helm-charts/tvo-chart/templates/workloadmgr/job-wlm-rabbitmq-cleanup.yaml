{{- if eq .Values.crdType "TVOControlPlane" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "job-triliovault-wlm-rabbitmq-cleanup"
  labels:
    application: triliovault
    component: wlm-rabbitmq-cleanup
  annotations:
    # Weight 99 lands this immediately before the Deployments, which are themselves
    # post-upgrade hooks at weight 100-104. That is the last moment before any pod of
    # the new release declares a fanout exchange, and it keeps the window in which the
    # still-running old pods are disturbed down to seconds. It used to be a pre-upgrade
    # hook, on the belief that Helm applies the release Deployments before post-upgrade
    # hooks - which is not true for this chart, because those Deployments ARE
    # post-upgrade hooks. TVAULT-7572.
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "99"
spec:
  backoffLimit: 1000
  template:
    metadata:
      labels:
        application: triliovault
        component: wlm-rabbitmq-cleanup
    spec:
      securityContext:
        runAsUser: {{ .Values.common.nova_user_id }}
        fsGroup: {{ .Values.common.nova_group_id }}
      serviceAccountName: triliovault-wlm
      restartPolicy: OnFailure
      nodeSelector:
        trilio-control-plane: enabled
      containers:
        - name: "wlm-rabbitmq-cleanup"
          securityContext:
            readOnlyRootFilesystem: false
            runAsUser: {{ .Values.common.nova_user_id }}
          image: {{ .Values.images.triliovault_wlm_api }}
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: trilio-rabbitmq-cluster-default-user
                  key: username
            - name: RABBITMQ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trilio-rabbitmq-cluster-default-user
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              {{ tpl (.Files.Get "scripts/_triliovault-wlm-rabbitmq-cleanup.sh.tpl") . | nindent 14 }}
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
              name: combined-ca-bundle
              readOnly: true
              subPath: tls-ca-bundle.pem
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: combined-ca-bundle
          secret:
            defaultMode: 292
            secretName: combined-ca-bundle
{{- end }}
