{{- if eq .Values.crdType "TVOControlPlane" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "job-triliovault-wlm-rabbitmq-cleanup"
  labels:
    application: triliovault
    component: wlm-rabbitmq-cleanup
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-4"
spec:
  backoffLimit: 1000
  template:
    metadata:
      labels:
        application: triliovault
        component: wlm-rabbitmq-cleanup
    spec:
      securityContext:
        runAsUser: {{ .Values.common.nova_user_id }}
        fsGroup: {{ .Values.common.nova_group_id }}
      serviceAccountName: triliovault-wlm
      restartPolicy: OnFailure
      nodeSelector:
        trilio-control-plane: enabled
      containers:
        - name: "wlm-rabbitmq-cleanup"
          securityContext:
            readOnlyRootFilesystem: false
            runAsUser: {{ .Values.common.nova_user_id }}
          image: {{ .Values.images.triliovault_wlm_api }}
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: trilio-rabbitmq-cluster-default-user
                  key: username
            - name: RABBITMQ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trilio-rabbitmq-cluster-default-user
                  key: password
          command:
            - /bin/bash
            - -c
            - /tmp/triliovault-wlm-rabbitmq-cleanup.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: triliovault-wlm-bin
              mountPath: /tmp/triliovault-wlm-rabbitmq-cleanup.sh
              subPath: triliovault-wlm-rabbitmq-cleanup.sh
            - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
              name: combined-ca-bundle
              readOnly: true
              subPath: tls-ca-bundle.pem
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: triliovault-wlm-bin
          configMap:
            name: "triliovault-wlm-bin"
            defaultMode: 0555
        - name: combined-ca-bundle
          secret:
            defaultMode: 292
            secretName: combined-ca-bundle
{{- end }}
