{{- if eq .Values.crdType "TVOControlPlane" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: default-triliovault-dms
  namespace: trilio-openstack
rules:
  - apiGroups:
      - ""
      - extensions
      - batch
      - apps
    verbs:
      - get
      - list
    resources:
      - jobs
      - pods
{{- end }}