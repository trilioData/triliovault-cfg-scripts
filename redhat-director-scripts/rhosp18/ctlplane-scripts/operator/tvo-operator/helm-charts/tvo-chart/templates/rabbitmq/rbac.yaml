apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-job-sa
  namespace: trilio-openstack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wait-job-role
  namespace: trilio-openstack
rules:
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "installplans", "clusterserviceversions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wait-job-rb
  namespace: trilio-openstack
subjects:
  - kind: ServiceAccount
    name: wait-job-sa
roleRef:
  kind: Role
  name: wait-job-role
  apiGroup: rbac.authorization.k8s.io
