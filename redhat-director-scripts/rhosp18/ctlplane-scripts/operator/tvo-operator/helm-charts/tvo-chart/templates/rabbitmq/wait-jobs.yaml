---
# Job 4: Wait for RabbitMQ Admin User CR Creation
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-rabbitmq-admin-user
  namespace: trilio-openstack
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-8"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: wait-job-sa
      restartPolicy: OnFailure
      containers:
        - name: wait-for-rabbitmq-admin-user
          image: quay.io/openshift/origin-cli:latest
          command:
            - /bin/sh
            - -xc
            - |
              until oc get users.rabbitmq.com -n {{ .Values.rabbitmq.common.namespace }} | grep -q {{ .Values.rabbitmq.admin_user.name }}; do
                echo "Waiting for RabbitMQ Admin User CR...";
                sleep 10;
              done
              oc wait --for=condition=Ready users.rabbitmq.com/{{ .Values.rabbitmq.admin_user.name }} -n {{ .Values.rabbitmq.common.namespace }} --timeout=120s
              echo "RabbitMQ Admin User is ready."
