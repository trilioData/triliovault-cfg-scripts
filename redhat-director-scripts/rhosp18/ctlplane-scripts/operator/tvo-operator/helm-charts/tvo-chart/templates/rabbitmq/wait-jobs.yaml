---
# Job 4: Wait for RabbitMQ Admin User CR Creation
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-rabbitmq-admin-user
  namespace: trilio-openstack
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-8"
spec:
  template:
    spec:
      serviceAccountName: wait-job-sa
      restartPolicy: OnFailure
      containers:
        - name: wait-for-rabbitmq-admin-user
          image: quay.io/openshift/origin-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              until oc get users.rabbitmq.com -n {{ .Values.rabbitmq.common.namespace }} | grep -q trilio-rabbitmq-admin; do
                echo "Waiting for RabbitMQ Admin User CR...";
                sleep 10;
              done
              oc wait --for=condition=Ready users.rabbitmq.com/trilio-rabbitmq-admin -n {{ .Values.rabbitmq.common.namespace }} --timeout=600s
              echo "RabbitMQ Admin User is ready."
