{{- if eq .Values.crdType "TVOControlPlane" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triliovault-wlm-scheduler
  labels:
    application: triliovault
    component: wlm-scheduler
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "103"
spec:
  replicas: {{ .Values.pod.replicas.triliovault_wlm_scheduler }}
  selector:
    matchLabels:
      application: triliovault
      component: wlm-scheduler
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 3
  template:
    metadata:
      labels:
        application: triliovault
        component: wlm-scheduler
      {{- if .Values.pod.triliovault_wlm_scheduler.networks }}
      annotations:
        k8s.v1.cni.cncf.io/networks: {{ .Values.pod.triliovault_wlm_scheduler.networks | quote }}
      {{- end }}
    spec:
      serviceAccountName: triliovault-wlm
      securityContext:
        runAsUser: {{ .Values.common.nova_user_id }}
        fsGroup: {{ .Values.common.nova_group_id }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: application
                    operator: In
                    values:
                    - triliovault
                  - key: component
                    operator: In
                    values:
                    - wlm-scheduler
              topologyKey: kubernetes.io/hostname
            weight: 10
      nodeSelector:
        trilio-control-plane: enabled
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: triliovault-wlm-scheduler-init
          image: {{ .Values.images.triliovault_wlm_scheduler }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
            runAsGroup: {{ .Values.common.nova_user_id }}
            runAsUser: 0
          env:
            - name: POD_NAME
              value: "triliovault-wlm-scheduler"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openstack-secret
                  key: CloudAdminPassword
            - name: WLM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trilio-openstack-secret
                  key: WlmDatabasePassword
            - name: WLM_KEYSTONE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trilio-openstack-secret
                  key: WlmKeystonePassword
            - name: WLM_RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trilio-openstack-secret
                  key: WlmRabbitPassword
            - name: WLM_RABBIT_USER
              value: "{{- .Values.rabbitmq.wlm_api.user -}}"
            - name: WLM_RABBIT_VHOST
              value: "{{- .Values.rabbitmq.wlm_api.vhost -}}"
            - name: WLM_RABBIT_HOST
              value: "{{- .Values.rabbitmq.common.host -}}"
            - name: IS_RABBIT_SSL_ENABLED
              value: "{{- .Values.rabbitmq.common.ssl -}}"
            - name: WLM_DATABASE_USER
              value: "{{- .Values.database.wlm_api.user -}}"
            - name: WLM_DATABASE_HOST
              value: "{{- .Values.database.common.host -}}"
            - name: WLM_DATABASE_PORT
              value: "{{- .Values.database.common.port -}}"
            - name: WLM_DATABASE_NAME
              value: "{{- .Values.database.wlm_api.database -}}"
            {{- range .Values.triliovault_backup_targets }}
            {{- if eq .backup_target_type "s3" }}
            - name: {{ .backup_target_name }}_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: trilio-openstack-secret
                  key: {{ .backup_target_name }}_s3_access_key
            - name: {{ .backup_target_name }}_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: trilio-openstack-secret
                  key: {{ .backup_target_name }}_s3_secret_key
            {{- end }}
            {{- end }}
          command:
            - /bin/bash
            - -c
            - /tmp/triliovault-wlm-api-init.sh
          terminationMessagePath: /var/log/termination-log
          volumeMounts:
            - name: trilio-logs
              mountPath: /var/log/triliovault
            - name: triliovault-wlm-bin
              mountPath: /tmp/triliovault-wlm-api-init.sh
              subPath: triliovault-wlm-init.sh
            - name: triliovault-wlm-bin
              mountPath: /tmp/triliovault-cloudrc
              subPath: triliovault-cloudrc
            - name: pod-shared-triliovault-wlm-scheduler
              mountPath: /tmp/pod-shared-triliovault-wlm-scheduler
            - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
              name: combined-ca-bundle
              subPath: tls-ca-bundle.pem
              readOnly: true
            - name: trilio-mounts
              mountPath: {{ .Values.common.vault_data_dir }}
              mountPropagation: Bidirectional
      containers:
        - name: triliovault-wlm-scheduler
          image: {{ .Values.images.triliovault_wlm_scheduler }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
            runAsUser: {{ .Values.common.nova_user_id }}
          {{- if .Values.pod.triliovault_wlm_api.debug_mode }}
          command:
            - /bin/bash
            - -c
            - /usr/bin/sleep 500m
          {{- else }}
          command:
            - /bin/bash
            - -c
            - /tmp/triliovault-wlm-scheduler.sh
            - start
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - /tmp/triliovault-wlm-scheduler.sh
                  - stop
          {{- end }}
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: trilio-logs
              mountPath: /var/log/triliovault
            - mountPath: /etc/triliovault-wlm/wlm_logging.conf
              name: triliovault-wlm-etc
              readOnly: true
              subPath: wlm_logging.conf
            - name: triliovault-wlm-etc
              mountPath: /etc/triliovault-wlm/triliovault-wlm.conf
              subPath: triliovault-wlm.conf
              readOnly: true
            - name: triliovault-wlm-etc
              mountPath: /etc/triliovault-wlm/api-paste.ini
              subPath: api-paste.ini
              readOnly: true
            - name: triliovault-wlm-bin
              mountPath: /tmp/triliovault-wlm-scheduler.sh
              subPath: triliovault-wlm-scheduler.sh
            - name: pod-shared-triliovault-wlm-scheduler
              mountPath: /tmp/pod-shared-triliovault-wlm-scheduler
            - name: trilio-mounts
              mountPath: {{ .Values.common.vault_data_dir }}
              mountPropagation: Bidirectional
            - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
              name: combined-ca-bundle
              readOnly: true
              subPath: tls-ca-bundle.pem
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: trilio-logs
          emptyDir: {}
        - name: triliovault-wlm-etc
          secret:
            secretName: triliovault-wlm-etc
            defaultMode: 0444
        - name: triliovault-wlm-bin
          configMap:
            name: triliovault-wlm-bin
            defaultMode: 0555
        - name: pod-shared-triliovault-wlm-scheduler
          emptyDir: {}
        - name: trilio-mounts
          hostPath:
            path: {{ .Values.common.vault_data_dir }}
            type: DirectoryOrCreate
        - name: combined-ca-bundle
          secret:
            defaultMode: 292
            secretName: combined-ca-bundle
{{- end }}