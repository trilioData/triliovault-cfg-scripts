crdType: "TVOControlPlane"
labels:
  wlm_api:
    node_selector_key: trilio-control-plane
    node_selector_value: enabled
  wlm_cron:
    node_selector_key: trilio-control-plane
    node_selector_value: enabled
  wlm_scheduler:
    node_selector_key: trilio-control-plane
    node_selector_value: enabled
  wlm_workloads:
    node_selector_key: trilio-control-plane
    node_selector_value: enabled
  datamover_api:
    node_selector_key: trilio-control-plane
    node_selector_value: enabled
images:
  triliovault_wlm: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
  triliovault_wlm_api: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
  triliovault_wlm_scheduler: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
  triliovault_wlm_cron: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
  triliovault_wlm_workloads: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
  triliovault_datamover_api: docker.io/trilio/trilio-datamover-api-helm:5.0.0-train-ubuntu_bionic
  triliovault_datamover_db_sync: docker.io/trilio/trilio-datamover-api-helm:5.0.0-train-ubuntu_bionic
  triliovault_wlm_db_sync: docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic
  triliovault_dms: docker.io/trilio/trilio-dms:6.2.0-stable-rhosp18.0
  openshift_cli: registry.redhat.io/openshift4/ose-cli:latest
  # RHOSO's supported RabbitMQ image. Consumed by both rabbitmq chart variants
  # (spec.image on the community RabbitmqCluster, spec.containerImage on the native
  # RabbitMq). Kept here as a chart default so an inputs file that predates the
  # images.rabbitmq key still gets a Red Hat image instead of the RabbitMq operator's
  # upstream quay.io/podified-antelope-centos9 default.
  rabbitmq: registry.redhat.io/rhoso/openstack-rabbitmq-rhel9:18.0
common:
  nova_user_id: "42436"
  nova_group_id: "42436"
  trustee_role: "creator"
  dmapi_workers: "16"
  memcached_servers: ""
  oslo_enable_proxy_headers_parsing: false
  vault_data_dir: "/var/lib/trilio/triliovault-mounts"
openstack:
  namespace: "openstack"
  osp_secret_name: "osp-secret"
keystone:
  keystone_interface: "internal"
  common:
    service_project_name: "service"
    service_project_domain_name: "Default"
    admin_role_name: "admin"
    cloud_admin_user_name: "admin"
    cloud_admin_project_name: "admin"
    cloud_admin_domain_name: "Default"
    region_name: "regionOne"
    auth_url: ""
    auth_uri: ""
    keystone_auth_protocol: ""
    keystone_auth_host: ""
    keystone_auth_port: ""
    is_self_signed_ssl_cert: True
    ssl_verify: True
  datamover_api:
    user: "dmapi"
    service_name: "dmapi"
    service_type: "datamover"
    service_desc: "TrilioVault Datamover Api Service"
    internal_endpoint: "ENDPOINT_PROTOCOL_INTERNAL://ENDPOINT_HOST_INTERNAL:8784/v2"
    public_endpoint: "ENDPOINT_PROTOCOL_PUBLIC://ENDPOINT_HOST_PUBLIC:8784/v2"
    public_auth_host: ""
  wlm_api:
    user: "triliovault"
    service_name: "TrilioVaultWLM"
    service_type: "workloads"
    service_desc: "TrilioVault Workloadmgr Api Service"
    internal_endpoint: "ENDPOINT_PROTOCOL_INTERNAL://ENDPOINT_HOST_INTERNAL:8781/v1/$(tenant_id)s"
    public_endpoint: "ENDPOINT_PROTOCOL_PUBLIC://ENDPOINT_HOST_PUBLIC:8781/v1/$(tenant_id)s"
    public_auth_host: ""
database:
  common:
    root_user_name: "root"
    host: "EDIT_DB_HOSTNAME"
  datamover_api:
    user: "dmapi"
    database: "dmapi"
  wlm_api:
    user: "workloadmgr"
    database: "workloadmgr"
rabbitmq:
  common:
    admin_user: "trilio-rabbitmq-admin"
    host: "trilio-rabbitmq-cluster.trilio-openstack.svc"
    port: "15671"
    driver: "messagingv2"
    ssl: true
    namespace: "trilio-openstack"
    rabbit_quorum_queue: true
    rabbit_transient_quorum_queue: true
    amqp_durable_queues: true
  operator:
    api_version: "operators.coreos.com/v1"
    operator_name: "rabbitmq-cluster-operator"
    channel: "stable"
    starting_csv: "rabbitmq-cluster-operator.v2.16.0"
    install_plan_approval: "Automatic"
    source_namespace: "openshift-marketplace"
    source: "community-operators"
  cluster:
    api_version: "rabbitmq.com/v1beta1"
    replicas: 3
    image: "rabbitmq:3.13.7-management"
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 2
        memory: 4Gi
    persistence:
      storage_class_name: "ocs-storagecluster-ceph-rbd"
      storage: 10Gi
    rabbitmq:
      # Broker tuning applied to whichever RabbitMQ CR this image's chart variant
      # creates: templates/rabbitmq/ (native CRD, FR6 onwards) or
      # templates/rabbitmq-till-18.0.18/ (community CRD, till FR5). Both read this same
      # key. Only one variant ships in a given operator image - build_operator_image.sh
      # prunes the other - but values.yaml is shared, so this default has to be correct
      # for both (TVAULT-7678).
      #
      # It therefore holds only keys that NEITHER operator sets for itself. Both
      # generate their own conf.d/10-operatorDefaults.conf covering cluster formation,
      # cluster_partition_handling, disk_free_limit and log.console, and on FR6 also the
      # TLS listeners and vm_memory_high_watermark.relative = 0.6. This value lands in
      # conf.d/90-userDefinedConfiguration.conf, which the broker loads AFTER that and
      # therefore OVERRIDES it - so adding an operator-owned key here silently changes
      # platform behaviour. In particular cluster_partition_handling would override
      # FR6's pause_minority (wrong for our quorum queues) and ssl_options.* would
      # override its TLS listener setup.
      #
      # tvo-operator-inputs-till-fr5.yaml carries its own additional_config, which
      # replaces this string wholesale, so FR5 deployments do not depend on what is
      # here. Note the community operator sets no vm_memory_high_watermark.* at all (it
      # injects total_memory_available_override_value instead), so FR5 relies on its own
      # inputs value for that - do not prune it from the FR5 inputs file.
      #
      # Every key here was checked against rabbitmq-server v4.2.x rabbit.schema (4.2.7
      # ships in openstack-rabbitmq-rhel9:18.0.21). An unrecognised key stops the broker
      # booting, and a recognised-but-dead key silently does nothing: FR5's
      # vm_memory_high_watermark_paging_ratio is marked "DEPRECATED. Not used since
      # RabbitMQ 4.0", so it is deliberately not carried over. channel_max and
      # connection_max resolve as aliases of max_channels_per_connection /
      # max_connections.
      additional_config: |
        # Connection and channel limits
        channel_max = 2048
        connection_max = 1000

        # Heartbeat and timeouts
        heartbeat = 60

        # Message size limit (100MB)
        max_message_size = 104857600

        # Consumer timeout (30 minutes)
        consumer_timeout = 1800000

        # Background GC for better memory management
        background_gc_enabled = true
        background_gc_target_interval = 60000
    service:
      type: ClusterIP
  datamover_api:
    user: "dmapi"
    vhost: "dmapi"
  wlm_api:
    user: "workloadmgr"
    vhost: "workloadmgr"
helm3_hook: true
pod:
  triliovault_wlm_api:
    networks: ""
    debug_mode: false
  triliovault_wlm_scheduler:
    networks: ""
    debug_mode: false
  triliovault_wlm_cron:
    networks: ""
    debug_mode: false
  triliovault_wlm_workloads:
    networks: ""
    debug_mode: false
  triliovault_datamover_api:
    networks: ""
    debug_mode: false
  triliovault_dms:
    networks: ""
    debug_mode: false
  security_context:
    triliovault:
      container:
        triliovault_datamover_api:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          runAsUser: 63630
          runAsGroup: 0
        triliovault_wlm_api:
          readOnlyRootFilesystem: false
          privileged: true
          runAsUser: 42436
        triliovault_wlm_scheduler:
          readOnlyRootFilesystem: false
          privileged: true
          runAsUser: 42436
        triliovault_wlm_cron:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          runAsUser: 42436
        triliovault_wlm_workloads:
          readOnlyRootFilesystem: false
          privileged: true
          runAsUser: 42436
        triliovault_wlm_init:
          readOnlyRootFilesystem: false
          runAsUser: 0
          runAsGroup: 42436
        triliovault_datamover_api_init:
          readOnlyRootFilesystem: false
          runAsUser: 0
          runAsGroup: 63630
  replicas:
    triliovault_wlm_api: 3
    triliovault_datamover_api: 3
    triliovault_wlm_workloads: 3
    triliovault_wlm_cron: 1
    triliovault_wlm_scheduler: 3
dms:
  s3vaultfuse:
    default:
      vault_storage_type: "s3"
      vault_s3_max_pool_connections: 50
      vault_s3_read_timeout: 30
      vault_s3_max_attempts: 3
      vault_s3_auth_version: "DEFAULT"
      vault_s3_signature_version: "default"
      vault_s3_ssl: "True"
      vault_s3_ssl_verify: "True"
      vault_s3_region_name: "us-east-1"
      vault_segment_size: 33554432
      vault_cache_size: 16
      queue_depth: 100
      worker_pool_size: 10
      vault_retry_count: 2
      vault_enable_threadpool: "True"
      vault_threaded_filesystem: "True"
      max_uploads_pending: 20
      vault_logging_level: "error"
      log_file: "/var/log/triliovault/triliovault-object-store.log"
      log_config_append: "/etc/triliovault-object-store/object_store_logging.conf"
      trace_function_calls: "False"
      bucket_object_lock: "False"
      use_manifest_suffix: "False"
      azure_immutability_enabled: "False"
      metadata_cache_max_items: 32
      vault_cache_username: "nova"
    s3fuse_sys_admin:
      helper_command: "sudo /usr/bin/trilio-dms-rootwrap /etc/triliovault-dms/rootwrap.conf privsep-helper"
workloadmgr:
  policyOverrides:
    # Example of overriding a default policy rule
    # workload:workload_delete: rule:admin_api
    # snapshot:snapshot_delete: rule:admin_api
