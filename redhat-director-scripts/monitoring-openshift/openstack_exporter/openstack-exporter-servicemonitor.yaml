apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openstack-exporter
  namespace: trilio-monitoring
  labels:
    release: prometheus-user-workload
spec:
  selector:
    matchLabels:
      app: openstack-exporter
  namespaceSelector:
    matchNames:
      - trilio-monitoring
  endpoints:
    - port: os-metrics
      path: /metrics
      interval: 30s

