{{- if eq .Values.action "Install" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "job-triliovault-datamover-db-init"
  labels:
    application: triliovault
    component: datamover-db-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-3"
spec:
  backoffLimit: 1000
  template:
    metadata:
      labels:
        application: triliovault
        component: datamover-db-init
    spec:
      securityContext:
        runAsUser: {{ .Values.pod.security_context.triliovault.container.triliovault_datamover.runAsUser }}
        fsGroup: {{ .Values.pod.security_context.triliovault.container.triliovault_datamover.runAsGroup }}
      serviceAccountName: triliovault-datamover
      restartPolicy: OnFailure
      nodeSelector:
        trilio-control-plane: enabled
      containers:
        - name: "datamover-db-init"
          securityContext:
            readOnlyRootFilesystem: false
            runAsUser: {{ .Values.pod.security_context.triliovault.container.triliovault_datamover.runAsUser }}
          image: {{ .Values.images.triliovault_datamover }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - /tmp/triliovault-datamover-db-init.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: triliovault-datamover-bin
              mountPath: /tmp/triliovault-datamover-db-init.sh
              subPath: triliovault-datamover-db-init.sh
            - name: triliovault-datamover-etc
              mountPath: /etc/triliovault-datamover/triliovault-datamover.conf
              subPath: triliovault-datamover.conf
              readOnly: true
            # - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
            #   name: combined-ca-bundle
            #   readOnly: true
            #   subPath: tls-ca-bundle.pem
            - name: triliovault-datamover-etc
              mountPath: /etc/triliovault-datamover/datamover_api_logging.conf
              subPath: datamover_api_logging.conf
              readOnly: true
            - name: trilio-logs
              mountPath: /var/log/triliovault
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: trilio-logs
          emptyDir: {}
        - name: triliovault-datamover-bin
          configMap:
            name: triliovault-datamover-bin
            defaultMode: 0555
        - name: triliovault-datamover-etc
          secret:
            secretName: triliovault-datamover-etc
            defaultMode: 0444
        # - name: combined-ca-bundle
        #   secret:
        #     defaultMode: 292
        #     secretName: combined-ca-bundle
{{- end }}

