{{- if eq .Values.action "Install" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: triliovault-datamover
  namespace: trilio-openstack
rules:
  - apiGroups:
      - ""
      - extensions
      - batch
      - apps
    verbs:
      - get
      - list
    resources:
      - services
      - endpoints
      - jobs
      - pods
{{- end }}
