---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trilio-backup-targets-{{ .Values.trilio_backup_target.backup_target_name | lower | replace "_" "-" }}
  namespace: trilio-openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trilio-backup-targets-{{ .Values.trilio_backup_target.backup_target_name | lower | replace "_" "-" }}
subjects:
  - kind: ServiceAccount
    name: trilio-backup-targets-{{ .Values.trilio_backup_target.backup_target_name | lower | replace "_" "-" }}
    namespace: trilio-openstack