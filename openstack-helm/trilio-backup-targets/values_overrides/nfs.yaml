trilio_backup_target:
  backup_target_name: 'nfs-bt2'
  backup_target_type: 'nfs'
  is_default: False
  nfs_server: 192.168.0.51
  nfs_shares: /home/openstack-helm
  nfs_options: "nolock,soft,timeo=600,intr,lookupcache=none,nfsvers=3,retrans=10"
  storage_size: 10Gi
  storage_class_name: ceph-filesystem
  static: false

images:
  trilio_wlm: docker.io/trilio/trilio-wlm-helm:6.1.0-dev-maint1-1-2023.2
