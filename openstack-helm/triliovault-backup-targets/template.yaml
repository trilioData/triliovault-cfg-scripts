# Source: triliovault-backup-targets/templates/nfs_mount/configmap-bin-nfs-single-bt.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: triliovault-nfs-bin-single-bt-s3-bt1
  namespace: triliovault
data:
  triliovault-nfs-mount.sh: |
    
    #!/bin/bash
    set -e
    
    # Base64 encode the NFS path to create a unique mount directory
    
    mkdir -p /var/lib/trilio/triliovault-mounts/L21udC9zaGFyZQ==
    sudo /usr/bin/workloadmgr-rootwrap /etc/triliovault-wlm/rootwrap.conf mount -t nfs 11.30.1.10:/mnt/share /var/lib/trilio/triliovault-mounts/L21udC9zaGFyZQ== -o nolock,soft,timeo=600,intr,lookupcache=none,nfsvers=3,retrans=10
    
    echo -e "NFS backup target mounted successfully"
    tail -f /dev/null
---
# Source: triliovault-backup-targets/templates/object_store/configmap-bin-object-store.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: triliovault-object-store-bin
data:
  triliovault-object-store.sh: |
    
    #!/bin/bash
    
    set -e
    
    COMMAND="${@:-start}"
    
    function start () {
    
      ## Start triliovault object store service if backup target type is s3
      /usr/bin/python3 /usr/bin/s3vaultfuse.py --config-file=/etc/triliovault-object-store/triliovault-object-store.conf
      sleep 20s
      status=$?
      if [ $status -ne 0 ]; then
        echo "Failed to start tvault-object-store service: $status"
        exit $status
      fi
    
    }
    
    function stop () {
      kill -TERM 1
    }
    
    $COMMAND
---
# Source: triliovault-backup-targets/templates/nfs_mount/pv-nfs-single-bt.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: triliovault-nfs-pv-s3-bt1
  namespace: triliovault
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    server: 11.30.1.10
    path: /mnt/share
---
# Source: triliovault-backup-targets/templates/nfs_mount/pvc-nfs-single-bt.yaml
