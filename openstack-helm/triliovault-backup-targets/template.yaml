# Source: triliovault-backup-targets/templates/nfs_mount/daemonset-nfs-mount.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: triliovault-nfs-mount-s3-bt1
  namespace: triliovault
  labels:
    application: triliovault
    component: nfs-mount
spec:
  selector:
    matchLabels:
      application: triliovault
      component: nfs-mount
  template:
    metadata:
      labels:
        application: triliovault
        component: nfs-mount
    spec:
      securityContext:
        runAsUser: 42436
        fsGroup: 42436
      serviceAccountName: triliovault-nfs
      nodeSelector:
        trilio-control-plane: enabled
        openstack-compute-node: enabled
      containers:
        - name: "nfs-mount"
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
            runAsUser: 42436
          image: docker.io/trilio/trilio-wlm-helm:6.1.0-tv6578-2023.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - /tmp/triliovault-nfs-mount.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: triliovault-nfs-bin
              mountPath: /tmp/triliovault-nfs-mount.sh
              subPath: triliovault-nfs-mount.sh
            - name: trilio-mounts
              mountPath: /var/lib/trilio/triliovault-mounts
              mountPropagation: Bidirectional
            - name: nfs-mounts
              mountPath: /mnt/nfs
              mountPropagation: Bidirectional
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: triliovault-nfs-bin
          configMap:
            name: triliovault-nfs-bin-single-bt-s3-bt1
            defaultMode: 0555
        - name: trilio-mounts
          hostPath:
            path: /var/lib/trilio/triliovault-mounts
            type: DirectoryOrCreate
        - name: nfs-mounts
          persistentVolumeClaim:
            claimName: triliovault-nfs-pvc-s3-bt1
