{{- if eq .Values.triliovault_backup_target.backup_target_type "s3" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: triliovault-object-store-etc-single-bt-{{ .Values.triliovault_backup_target.backup_target_name | lower | replace "_" "-" }}
type: Opaque
data:
  object_store_logging.conf: |-
    {{ tpl (.Files.Get "conf/_object_store_logging_conf.tpl") . | b64enc }}
  triliovault-object-store-{{ .Values.triliovault_backup_target.backup_target_name | lower }}.conf: |-
    {{ include "to_ini_object_store" (dict "target" .Values.triliovault_backup_target "Values" .Values) | b64enc }}
  {{- if and .Values.triliovault_backup_target.s3_self_signed_cert .Values.triliovault_backup_target.s3_ssl_ca_cert }}
  s3-cert-{{ .Values.triliovault_backup_target.backup_target_name | lower }}.pem: |-
    {{ .Values.triliovault_backup_target.s3_ssl_ca_cert | b64enc }}
  {{- end }}
{{- end }}