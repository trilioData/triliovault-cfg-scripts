{{- $libvirt_tls := .Values.conf.triliovault.libvirt_tls }}
{{- if and .Values.manifests.daemonset_datamover $libvirt_tls.enabled (eq $libvirt_tls.source "secret") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: triliovault-datamover-libvirt-tls
type: Opaque
data:
  cacert.pem: {{ required "conf.triliovault.libvirt_tls.ca_cert is required when source is secret" $libvirt_tls.ca_cert | b64enc }}
  clientcert.pem: {{ required "conf.triliovault.libvirt_tls.client_cert is required when source is secret" $libvirt_tls.client_cert | b64enc }}
  clientkey.pem: {{ required "conf.triliovault.libvirt_tls.client_key is required when source is secret" $libvirt_tls.client_key | b64enc }}
{{- end }}
