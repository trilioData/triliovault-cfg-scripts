{{/*
Gateway API alternative to ingress-wlm-api.yaml, for platforms whose public
endpoints are served by a Gateway instead of an Ingress controller (MOSK 26.2+
Application Gateway). TLS is terminated at the Gateway listener; the route
forwards plain HTTP to the internal wlm-api service.
*/}}
{{- if .Values.manifests.httproute_wlm_api }}
{{- $envAll := . }}
{{- $route := .Values.network.wlm_api.http_route }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: triliovault-wlm-api
spec:
  parentRefs:
    - name: {{ $route.gateway.name }}
      namespace: {{ $route.gateway.namespace }}
{{- if $route.gateway.sectionName }}
      sectionName: {{ $route.gateway.sectionName }}
{{- end }}
  hostnames:
    - {{ tuple "workloads" "public" $envAll | include "helm-toolkit.endpoints.hostname_fqdn_endpoint_lookup" | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ tuple "workloads" "internal" $envAll | include "helm-toolkit.endpoints.hostname_short_endpoint_lookup" }}
          port: {{ tuple "workloads" "internal" "api" $envAll | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{- if $route.timeouts }}
      timeouts:
{{ toYaml $route.timeouts | indent 8 }}
{{- end }}
{{- end }}
