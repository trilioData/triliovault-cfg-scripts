## Edit nfs shares ip and path.
conf:
  triliovault:
    backup_target_type: "nfs"
    nfs:
      provisioning_mode: static-with-sc  # options: dynamic, static-with-sc, static-without-sc (i.e storageClassName: "")
      storage_class_name: "kubernetes-ssd" # Provide storage class with ReadWriteMany access mode
      name: bt1-nfs
      nfs_shares: 
      - path: /home/openstack-helm
        ip: 192.168.0.51
      nfs_options: "nolock,soft,vers=3,timeo=180,intr,lookupcache=none"