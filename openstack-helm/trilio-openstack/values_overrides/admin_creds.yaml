conf:
  datamover:
    DEFAULT:
      dmapi_transport_url: rabbit://nova:password@rabbitmq-rabbitmq-0.rabbitmq.openstack.svc.cluster.local:5672,nova:password@rabbitmq-rabbitmq-1.rabbitmq.openstack.svc.cluster.local:5672/nova
  datamover_api:
    DEFAULT:
      transport_url: rabbit://nova:password@rabbitmq-rabbitmq-0.rabbitmq.openstack.svc.cluster.local:5672,nova:password@rabbitmq-rabbitmq-1.rabbitmq.openstack.svc.cluster.local:5672/nova
endpoints:
  identity:
    name: keystone
    auth:
      admin:
        region_name: RegionOne
        username: admin
        password: password
        project_name: admin
        user_domain_name: default
        project_domain_name: default
    host_fqdn_override:
      default:
        host: keystone-api.openstack.svc.cluster.local
      internal:
        host: keystone-api.openstack.svc.cluster.local
      public:
        host: keystone.triliodata.demo
  oslo_messaging:
    auth:
      admin:
        username: rabbitmq
        password: password
        secret:
          tls:
            internal: rabbitmq-tls-direct
    host_fqdn_override:
      default:
        host: rabbitmq.openstack.svc.cluster.local
  oslo_messaging_nova:
    auth:
      admin:
        username: rabbitmq
        password: password
        secret:
          tls:
            internal: rabbitmq-tls-direct
    host_fqdn_override:
      default:
        host: rabbitmq.openstack.svc.cluster.local
  oslo_db_triliovault_datamover:
    auth:
      admin:
        username: root
        password: password
        secret:
          tls:
            internal: mariadb-tls-direct
    host_fqdn_override:
      default:
        host: mariadb.openstack.svc.cluster.local
  oslo_db_triliovault_wlm:
    auth:
      admin:
        username: root
        password: password
        secret:
          tls:
            internal: mariadb-tls-direct
    host_fqdn_override:
      default:
        host: mariadb.openstack.svc.cluster.local
  datamover:
    host_fqdn_override:
      default:
        host: triliovault-datamover-api.trilio-openstack.svc.cluster.local
      public:
        host: triliovault-datamover.triliodata.demo
        tls:
          crt: |
          key: ""
          ca: |
  workloads:
    host_fqdn_override:
      default:
        host: triliovault-wlm-api.trilio-openstack.svc.cluster.local
      public:
        host: triliovault-wlm.triliodata.demo
        tls:
          crt: |
          key: ""
          ca: | 
  image:
    host_fqdn_override:
      default:
        host: glance-api.openstack.svc.cluster.local
      public:
        host: glance.triliodata.demo
  network:
    host_fqdn_override:
      default:
        host: neutron-server.openstack.svc.cluster.local
      public:
        host: neutron.triliodata.demo
  compute:
    host_fqdn_override:
      default:
        host: nova-api.openstack.svc.cluster.local
      public:
        host: nova.triliodata.demo
  volumev3:
    host_fqdn_override:
      default:
        host: cinder-api.openstack.svc.cluster.local
      public:
        host: cinder.triliodata.demo
  oslo_cache:
    host_fqdn_override:
      default:
        host: memcached.openstack.svc.cluster.local
