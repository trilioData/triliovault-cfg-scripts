---
# MOSK 26.2 with OpenStack Gazpacho (2026.1). Pass this file in utils/install_mosk.sh in
# place of mosk25.1.yaml, together with app_gateway.yaml in place of ingress.yaml
# (clouds not yet migrated to Application Gateway keep ingress.yaml + the MOSK 25.1 ingress patch).
# The *-mosk26.2 T4O images are retags of the 6.2.1 *-mosk25.1 images (same digests, no
# rebuild): the containers carry their own userspace, so the Ubuntu 24.04 hosts don't affect
# them, and the nova objects the datamover uses (Instance 2.8, BlockDeviceMapping 1.21) are the
# same versions in Caracal and Gazpacho. Only the Horizon plugin is rebuilt (on the MOSK Gazpacho
# Horizon image), and it is set in the OpenStackDeployment, not here.
# Verified on a MOSK 26.2 Gazpacho lab: install, cloud trust, NFS and S3 full and incremental
# snapshots, and restores all succeeded (TVAULT-7745).
images:
  tags:
    bootstrap: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    db_init: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    db_drop: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    rabbit_init: docker.io/rabbitmq:3.7-management
    ks_user: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    ks_service: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    ks_endpoints: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    dep_check: quay.io/airshipit/kubernetes-entrypoint:v1.0.0
    image_repo_sync: docker.io/docker:17.07.0
    triliovault_wlm_cloud_trust: docker.io/trilio/trilio-wlm-helm:6.2.1-test-mosk26.2
    triliovault_wlm_api: docker.io/trilio/trilio-wlm-helm:6.2.1-test-mosk26.2
    triliovault_wlm_cron: docker.io/trilio/trilio-wlm-helm:6.2.1-test-mosk26.2
    triliovault_wlm_scheduler: docker.io/trilio/trilio-wlm-helm:6.2.1-test-mosk26.2
    triliovault_wlm_workloads: docker.io/trilio/trilio-wlm-helm:6.2.1-test-mosk26.2
    triliovault_wlm_db_sync: docker.io/trilio/trilio-wlm-helm:6.2.1-test-mosk26.2
    triliovault_datamover: docker.io/trilio/trilio-datamover-helm:6.2.1-test-mosk26.2
    triliovault_datamover_api: docker.io/trilio/trilio-datamover-api-helm:6.2.1-test-mosk26.2
    triliovault_datamover_db_sync: docker.io/trilio/trilio-datamover-api-helm:6.2.1-test-mosk26.2
    triliovault_dms: docker.io/trilio/trilio-dms-helm:6.2.1-test-mosk26.2
    triliovault_dms_init: docker.io/trilio/trilio-dms-helm:6.2.1-test-mosk26.2
