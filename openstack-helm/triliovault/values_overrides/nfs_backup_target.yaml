action: 'add-backup-target'

images:
  triliovault_backup_target: 'docker.io/trilio/trilio-wlm-helm:5.0.0-train-ubuntu_bionic'

nfs_data_dir: /var/trilio/triliovault-mounts

triliovault_backup_target:
  backup_target_name: 'nfs-BT1'
  backup_target_type: 'nfs'
  is_default: False
  nfs_shares: '192.168.2.30:/nfs/share'
  nfs_options: 'nolock,soft,timeo=600,intr,lookupcache=none,nfsvers=3,retrans=10'
