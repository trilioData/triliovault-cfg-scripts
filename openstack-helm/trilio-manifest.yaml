    app.kubernetes.io/instance: release-name
spec:
  selector:
    matchLabels:
      release_group: release-name
      application: triliovault
      component: datamover
      app.kubernetes.io/name: triliovault
      app.kubernetes.io/component: datamover
      app.kubernetes.io/instance: release-name
  
  minReadySeconds: 0
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        release_group: release-name
        application: triliovault
        component: datamover
        app.kubernetes.io/name: triliovault
        app.kubernetes.io/component: datamover
        app.kubernetes.io/instance: release-name
      annotations:
        "openstackhelm.openstack.org/release_uuid": ""
        configmap-bin-datamover-hash: "937fb2a8078ffb514b25f2102de5ce856e4069f43d1964421ec4396b2a4598bf"
        configmap-etc-datamover-hash: "943a9e7203ea96faa4b9ed1b881c1c9bd5e6d3de5fc476a52e78b945093c22eb"
    spec:
      serviceAccountName: triliovault-datamover-openstack-compute-node
      securityContext:
        runAsUser: 42424
        fsGroup: 42424
      affinity:
        
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: release_group
                    operator: In
                    values:
                    - release-name
                  - key: application
                    operator: In
                    values:
                    - triliovault
                  - key: component
                    operator: In
                    values:
                    - datamover
              topologyKey: kubernetes.io/hostname
            weight: 10
      hostNetwork: true
      hostPID: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        openstack-compute-node: enabled

      imagePullSecrets:
        - name: triliovault-image-registry

      initContainers:
        
        - name: init
          image: "quay.io/airshipit/kubernetes-entrypoint:v1.0.0"
          imagePullPolicy: IfNotPresent  
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: INTERFACE_NAME
              value: eth0
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/
            - name: DEPENDENCY_SERVICE
              value: "default:triliovault-datamover-api"
            - name: DEPENDENCY_JOBS
              value: "triliovault-datamover-db-sync,triliovault-datamover-rabbit-init,triliovault-datamover-ks-user,triliovault-datamover-ks-endpoints"
            - name: DEPENDENCY_DAEMONSET
              value: ""
            - name: DEPENDENCY_CONTAINER
              value: ""
            - name: DEPENDENCY_POD_JSON
              value: ""
            - name: DEPENDENCY_CUSTOM_RESOURCE
              value: ""
          command:
            - kubernetes-entrypoint
          volumeMounts:
            null
        - name: triliovault-datamover-init
          image: "docker.io/trilio/trilio-datamover-helm:6.1.4-2023.2"
          imagePullPolicy: IfNotPresent
          
          securityContext:
            readOnlyRootFilesystem: false
            runAsGroup: 42424
            runAsUser: 0
          command:
            - /tmp/triliovault-datamover-init.sh
          terminationMessagePath: /var/log/termination-log
          volumeMounts:
            - name: vartrilio
              mountPath: /var/trilio
            - name: varlibtrilio
              mountPath: /var/lib/trilio
            - name: varlogtriliovaultdatamover
              mountPath: /var/log/triliovault
            - name: triliovault-datamover-bin
              mountPath: /tmp/triliovault-datamover-init.sh
              subPath: triliovault-datamover-init.sh
              readOnly: true
            - mountPath: /etc/nova/nova.conf.d
              name: nova-confd
            - name: pod-shared-triliovault-datamover
              mountPath: /tmp/pod-shared-triliovault-datamover

        - name: ceph-keyring-placement-triliovault
          image: "docker.io/trilio/trilio-datamover-helm:6.1.4-2023.2"
          imagePullPolicy: IfNotPresent
          
          securityContext:
            readOnlyRootFilesystem: false
            runAsGroup: 42424
            runAsUser: 42424
          command:
            - /tmp/ceph_keyring_placement_triliovault.sh
          env:
            - name: RBD_USER
              value: "cinder"
          terminationMessagePath: /var/log/termination-log
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: etcceph
              mountPath: /etc/ceph
            - name: triliovault-datamover-bin
              mountPath: /tmp/ceph_keyring_placement_triliovault.sh
              subPath: ceph_keyring_placement_triliovault.sh
              readOnly: true
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: keyring
              readOnly: true

        
      containers:
        - name: triliovault-datamover
          image: "docker.io/trilio/trilio-datamover-helm:6.1.4-2023.2"
          imagePullPolicy: IfNotPresent
          
          
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
            runAsUser: 42424
          command:
            - /tmp/triliovault-datamover.sh
            - start
          lifecycle:
            preStop:
              exec:
                command:
                  - /tmp/triliovault-datamover.sh
                  - stop
          volumeMounts:
            
            - name: ca-cert-bundle
              mountPath: /etc/ssl/certs/openstack-ca-bundle.pem
              readOnly: true
              subPath: ca_bundle
            - name: ca-cert
              mountPath: /certs
            - name: pod-tmp
              mountPath: /tmp
            - name: localtime
              mountPath: "/etc/localtime"
              readOnly: yes
            - name: pod-shared-triliovault-datamover
              mountPath: /tmp/pod-shared-triliovault-datamover
            - name: vartrilio
              mountPath: /var/trilio
            - name: varlibtrilio
              mountPath: /var/lib/trilio
              mountPropagation: Bidirectional
            - name: varlogtriliovaultdatamover
              mountPath: /var/log/triliovault
            - name: triliovault-datamover-etc
              mountPath: /etc/triliovault-datamover/triliovault-datamover.conf
              subPath: triliovault-datamover.conf
              readOnly: true
            - name: triliovault-datamover-bin
              mountPath: /tmp/triliovault-datamover.sh
              subPath: triliovault-datamover.sh
              readOnly: true
            - mountPath: /etc/nova/nova.conf.d
              name: nova-confd
            - name: varlibnova
              mountPath: /var/lib/nova
            - name: varliblibvirt
              mountPath: /var/lib/libvirt
            - name: run
              mountPath: /run
            - name: cgroup
              mountPath: /sys/fs/cgroup
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            - name: triliovault-datamover-etc
              mountPath: /etc/nova/nova.conf
              subPath: nova-compute.conf
              readOnly: true
            - name: triliovault-datamover-etc
              mountPath: /etc/triliovault-datamover/datamover_logging.conf
              subPath: datamover_logging.conf
              readOnly: true
            - name: triliovault-datamover-etc
              mountPath: /etc/triliovault-object-store/object_store_logging.conf
              subPath: object_store_logging.conf
              readOnly: true
            - name: triliovault-datamover-etc
              mountPath: /etc/triliovault-datamover/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: etcceph
              mountPath: /etc/ceph
            - name: triliovault-datamover-etc
              mountPath: /etc/ceph/ceph.conf
              subPath: ceph.conf
              readOnly: true
            - name: ceph-keyring
              mountPath: /tmp/client-keyring
              subPath: keyring
              readOnly: true
            
            - name: dev
              mountPath: /dev
              mountPropagation: HostToContainer
            - name: etciscsi
              mountPath: /etc/iscsi
              mountPropagation: HostToContainer
            - mountPath: /lib/modules
              name: libmodules
              readOnly: true
            - name: host-rootfs
              mountPath: /mnt/host-rootfs
              mountPropagation: HostToContainer
            - name: usrlocalsbin
              mountPath: /usr/local/sbin
            - name: runlock
              mountPath: /run/lock
            - name: triliovault-datamover-bin
              mountPath: /usr/local/sbin/multipath
              subPath: multipath
            - name: triliovault-datamover-bin
              mountPath: /usr/local/sbin/multipathd
              subPath: multipathd
            - name: triliovault-datamover-bin
              mountPath: /usr/local/sbin/iscsiadm
              subPath: iscsiadm
            - name: etcmultipath
              mountPath: /etc/multipath
              mountPropagation: Bidirectional
            - name: multipathconf
              mountPath: /etc/multipath.conf
            - mountPath: /var/lib/openstack/lock
              mountPropagation: Bidirectional
              name: lockpath
            - name: sysblock
              mountPath: /sys/block
              mountPropagation: HostToContainer                                    

      volumes:
        
        - name: ca-cert-bundle
          secret:
            secretName: triliovault-datamover-ca-bundle
        - name: ca-cert
          emptyDir: {}
        - name: pod-tmp
          emptyDir: {}
        - name: localtime
          hostPath:
