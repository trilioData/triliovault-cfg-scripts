name: security-scan-devops-repository

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.75.0
  MAIL_TO: shyam.biradar@trilio.io

jobs:
  security-scan-devops-repository:
    name: security-scan-devops-repository
    if: vars.CURRENT_DEVOPS_RELEASE_BRANCH != '' && (github.event_name == 'schedule' || github.ref_name == vars.CURRENT_DEVOPS_RELEASE_BRANCH)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: security-scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ vars.CURRENT_DEVOPS_RELEASE_BRANCH }}
          persist-credentials: false

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/trivy-results.json
          exit-code: "0"
          hide-progress: true

      - name: Render PDF report
        id: report
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ vars.CURRENT_DEVOPS_RELEASE_BRANCH }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet reportlab==4.4.10
          day=$(date -u +%Y-%m-%d)
          report="$RUNNER_TEMP/trivy-report-devops-repository-$day.pdf"
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/trivy_pdf_report.py \
            --input "$RUNNER_TEMP/trivy-results.json" \
            --repo-root . \
            --pdf "$report" \
            --summary "$RUNNER_TEMP/trivy-summary.html" \
            --repository "$REPOSITORY" \
            --branch "$BRANCH" \
            --commit "$(git rev-parse HEAD)" \
            --run-url "$RUN_URL"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "day=$day" >> "$GITHUB_OUTPUT"

      - name: Email report
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: T4O DevOps security scan <${{ secrets.SMTP_USERNAME }}>
          to: ${{ env.MAIL_TO }}
          subject: "security-scan-devops-repository: ${{ github.repository }} ${{ vars.CURRENT_DEVOPS_RELEASE_BRANCH }} ${{ steps.report.outputs.day }}"
          html_body: file://${{ runner.temp }}/trivy-summary.html
          attachments: ${{ steps.report.outputs.report }}
