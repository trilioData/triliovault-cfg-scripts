name: security-scan-rhoso18-container-images

on:
  push:
    branches:
      - dev-stable/6.3
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCANNER_VERSION: v0.75.0
  MAIL_FROM: trilio.build@trilio.io

jobs:
  security-scan-rhoso18-container-images:
    name: security-scan-rhoso18-container-images
    if: vars.CURRENT_DEVOPS_RELEASE_BRANCH != '' && (github.event_name == 'schedule' || github.ref_name == vars.CURRENT_DEVOPS_RELEASE_BRANCH)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: security-scan
    env:
      REGISTRY_NAMESPACE: trilio
      IMAGES: trilio-datamover-api trilio-datamover trilio-wlm trilio-horizon-plugin trilio-dms
      TAG_CONTAINS: 6.3.0 rhoso18.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ vars.CURRENT_DEVOPS_RELEASE_BRANCH }}
          persist-credentials: false

      - name: Find image tag
        id: tag
        env:
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 .github/scripts/dockerhub_common_tag.py \
            --namespace "$REGISTRY_NAMESPACE" \
            --repositories $IMAGES \
            --contains $TAG_CONTAINS

      - name: Install scanner
        id: setup
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: ${{ env.SCANNER_VERSION }}

      - name: Security scan
        id: scan
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TRIVY_USERNAME: ${{ vars.DOCKERHUB_USER }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for image in $IMAGES; do
            echo "Scanning docker.io/$REGISTRY_NAMESPACE/$image:$TAG"
            trivy image \
              --image-src remote \
              --scanners vuln,secret \
              --severity UNKNOWN,MEDIUM,HIGH,CRITICAL \
              --format json \
              --output "$RUNNER_TEMP/scan-$image.json" \
              --exit-code 0 \
              --timeout 30m \
              --quiet \
              "docker.io/$REGISTRY_NAMESPACE/$image:$TAG"
          done

      - name: Render PDF report
        id: report
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          day=$(date -u +%Y-%m-%d)
          echo "stamp=$(TZ=Asia/Kolkata date +%d%m%Y)" >> "$GITHUB_OUTPUT"
          report="$RUNNER_TEMP/trilio-rhoso18-container-images-report-${TAG:-unknown}-$day.pdf"
          summary="$RUNNER_TEMP/security-scan-summary.html"
          inputs=()
          for image in $IMAGES; do
            inputs+=(--input "$image=$RUNNER_TEMP/scan-$image.json")
          done
          if [[ "$SCAN_OUTCOME" == "success" ]] \
            && python3 -m venv "$RUNNER_TEMP/venv" \
            && "$RUNNER_TEMP/venv/bin/pip" install --quiet reportlab==4.4.10 \
            && "$RUNNER_TEMP/venv/bin/python" .github/scripts/security_scan_pdf_report.py \
              --group-by image \
              "${inputs[@]}" \
              --pdf "$report" \
              --summary "$summary" \
              --title "Trilio Security Scan for RHOSO18 Images - $TAG" \
              --registry "docker.io/$REGISTRY_NAMESPACE" \
              --image-tag "$TAG" \
              --run-url "$RUN_URL"; then
            echo "report=$report" >> "$GITHUB_OUTPUT"
          else
            cat > "$summary" <<EOF
          <html><body style="font-family:Arial,Helvetica,sans-serif;color:#212121;">
          <h2 style="font-size:20px;">Trilio Security Scan for RHOSO18 Images</h2>
          <p style="font-size:14px;color:#c62828;font-weight:bold;">The image scan failed and no report was produced.</p>
          <p style="font-size:13px;">Images: $IMAGES<br>Tag: ${TAG:-no tag containing $TAG_CONTAINS was found in every image}</p>
          <p style="font-size:13px;">See the workflow run for the error: <a href="$RUN_URL">$RUN_URL</a></p>
          </body></html>
          EOF
            echo "report=" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Email report
        if: always()
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_FROM }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Trilio Build <${{ env.MAIL_FROM }}>
          to: ${{ steps.scan.outcome == 'success' && steps.report.outcome == 'success' && vars.TEAM_EMAIL_ID || vars.BUILD_PERSON_EMAIL_ID }}
          subject: "Build ${{ steps.report.outputs.stamp }} - Security Scan Report: Trilio for OpenStack RHOSO18 Container Images${{ (steps.scan.outcome != 'success' || steps.report.outcome != 'success') && ' - SCAN FAILED' || '' }}"
          html_body: file://${{ runner.temp }}/security-scan-summary.html
          attachments: ${{ steps.report.outputs.report }}
