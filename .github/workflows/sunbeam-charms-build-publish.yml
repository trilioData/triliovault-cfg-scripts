name: Sunbeam charms build and publish

on:
  push:
    paths:
      - "sunbeam-canonical/charms/**"
  workflow_dispatch:
    inputs:
      channel:
        description: Charmhub channel to release the charms to
        type: choice
        default: 6.3/candidate
        options:
          - 6.3/candidate
          - 6.3/edge
          - 6.3/stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHANNEL: ${{ inputs.channel || '6.3/candidate' }}

jobs:
  detect:
    name: Detect changed charms
    if: github.event_name == 'workflow_dispatch' || github.ref_name == vars.CURRENT_DEVOPS_RELEASE_BRANCH
    runs-on: ubuntu-24.04
    outputs:
      charms: ${{ steps.changed.outputs.charms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=(trilio-wlm-k8s trilio-dm-api-k8s trilio-data-mover-sunbeam)
          selected=()
          if [[ "$EVENT_NAME" != "push" ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            selected=("${all[@]}")
          else
            for charm in "${all[@]}"; do
              if ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "sunbeam-canonical/charms/$charm"; then
                selected+=("$charm")
              fi
            done
          fi
          charms=$(jq -cn '$ARGS.positional' --args "${selected[@]}")
          echo "Charms to build: $charms"
          echo "charms=$charms" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish ${{ matrix.charm }}
    needs: detect
    if: needs.detect.outputs.charms != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        charm: ${{ fromJSON(needs.detect.outputs.charms) }}
    steps:
      - uses: actions/checkout@v4

      - uses: canonical/setup-lxd@v0.1.3

      - name: Install charmcraft
        run: |
          sudo snap install charmcraft --classic --channel=4.x/stable
          charmcraft version

      - name: Build and publish
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
          CHARM: ${{ matrix.charm }}
        run: |
          bash sunbeam-canonical/build/build_publish.sh \
            --charms "$CHARM" --mode build-and-publish --channel "$CHANNEL"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.charm }}
          path: sunbeam-canonical/charms/${{ matrix.charm }}/*.charm
          if-no-files-found: ignore
