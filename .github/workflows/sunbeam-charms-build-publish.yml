name: Sunbeam charms build and publish

on:
  push:
    paths:
      - "sunbeam-canonical/charms/**"
  workflow_dispatch:
    inputs:
      channel:
        description: Charmhub channel to release the charms to
        type: choice
        default: 6.3/candidate
        options:
          - 6.3/candidate
          - 6.2/candidate

permissions:
  contents: read

env:
  CHANNEL: ${{ inputs.channel || vars.CHARMHUB_DEFAULT_CHANNEL || '6.3/candidate' }}

jobs:
  detect:
    name: Detect changed charms
    if: github.event_name == 'workflow_dispatch' || github.ref_name == vars.CURRENT_DEVOPS_RELEASE_BRANCH
    runs-on: ubuntu-24.04
    outputs:
      charms: ${{ steps.changed.outputs.charms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=(trilio-wlm-k8s trilio-dm-api-k8s trilio-data-mover-sunbeam)
          selected=()
          if [[ "$EVENT_NAME" != "push" ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            selected=("${all[@]}")
          else
            for charm in "${all[@]}"; do
              if ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "sunbeam-canonical/charms/$charm"; then
                selected+=("$charm")
              fi
            done
          fi
          charms=$(jq -cn '$ARGS.positional' --args "${selected[@]}")
          echo "Charms to build: $charms"
          echo "charms=$charms" >> "$GITHUB_OUTPUT"

  build-publish:
    name: Build and publish ${{ matrix.charm }}
    needs: detect
    if: needs.detect.outputs.charms != '[]'
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == vars.CURRENT_DEVOPS_RELEASE_BRANCH && 'charmhub-release' || 'charmhub-manual' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.charm }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        charm: ${{ fromJSON(needs.detect.outputs.charms) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: canonical/setup-lxd@a3c85fc6fb7fff43fcfeae87659e41a8f635b7dd

      - name: Install charmcraft
        run: |
          sudo snap install charmcraft --classic --channel=4.x/stable
          charmcraft version

      - name: Build and publish
        id: build
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
          CHARM: ${{ matrix.charm }}
        run: |
          set -o pipefail
          bash sunbeam-canonical/build/build_publish.sh \
            --charms "$CHARM" --mode build-and-publish --channel "$CHANNEL" 2>&1 | tee "$RUNNER_TEMP/build-output.log"

      - name: Record result
        if: always()
        env:
          CHARM: ${{ matrix.charm }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          status=$(python3 .github/scripts/charm_build_status.py --outcome "$OUTCOME" "$RUNNER_TEMP/build-output.log")
          jq -n --arg charm "$CHARM" --arg outcome "$OUTCOME" --arg status "$status" \
            '{charm: $charm, outcome: $outcome, status: $status}' > "$RUNNER_TEMP/result/$CHARM.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: result-${{ matrix.charm }}
          path: ${{ runner.temp }}/result/${{ matrix.charm }}.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.charm }}
          path: sunbeam-canonical/charms/${{ matrix.charm }}/*.charm
          if-no-files-found: ignore

  report:
    name: Email build report
    needs: [detect, build-publish]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.charms != '[]'
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == vars.CURRENT_DEVOPS_RELEASE_BRANCH && 'charmhub-release' || 'charmhub-manual' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic --channel=4.x/stable

      - name: Render report
        id: report
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
          SELECTED: ${{ needs.detect.outputs.charms }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          echo "stamp=$(TZ=Asia/Kolkata date +%d%m%Y)" >> "$GITHUB_OUTPUT"
          : > "$RUNNER_TEMP/changes.txt"
          if [[ "$EVENT_NAME" == "push" ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git log --format='%s%n%b' "$BEFORE..$GITHUB_SHA" > "$RUNNER_TEMP/changes.txt"
          fi
          python3 .github/scripts/charm_build_report.py \
            --title "T4O Canonical Sunbeam Charms Build" \
            --channel "$CHANNEL" \
            --charm trilio-wlm-k8s=trilio-wlm-k8s \
            --charm trilio-dm-api-k8s=trilio-dm-api-k8s \
            --charm trilio-data-mover-sunbeam=trilio-data-mover-sunbeam \
            --selected "$SELECTED" \
            --results "$RUNNER_TEMP/results" \
            --summary "$RUNNER_TEMP/charm-build-report.html" \
            --branch "$BRANCH" \
            --commit "$GITHUB_SHA" \
            --trigger "$EVENT_NAME" \
            --run-url "$RUN_URL" \
            --changes "$RUNNER_TEMP/changes.txt" \
            --jira-url https://triliodata.atlassian.net/browse \
            --repo-url "$REPO_URL"

      - name: Email report
        if: always() && steps.report.outcome == 'success'
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: trilio.build@trilio.io
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Trilio Build <trilio.build@trilio.io>
          to: ${{ (needs.build-publish.result == 'success' && steps.report.outputs.failed != 'true') && vars.TEAM_EMAIL_ID || vars.BUILD_PERSON_EMAIL_ID }}
          subject: "Build ${{ steps.report.outputs.stamp }} - T4O Canonical Sunbeam Charms${{ (needs.build-publish.result != 'success' || steps.report.outputs.failed == 'true') && ' - FAILED' || '' }}"
          html_body: file://${{ runner.temp }}/charm-build-report.html
